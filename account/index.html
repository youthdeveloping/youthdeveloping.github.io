<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070a"><title>통합 계정 | YouthDeveloper</title><style>:root{--bg:#05070a;--panel:#0c1016;--line:rgba(255,255,255,.1);--text:#edf2f7;--muted:#8994a1;--green:#61ff9a;--cyan:#62e8ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 75% 5%,#11242b,transparent 30rem),var(--bg);color:var(--text);font:14px/1.6 Inter,system-ui,sans-serif;display:grid;place-items:center;padding:20px}.box{width:min(440px,100%);padding:28px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}a{color:var(--green);text-decoration:none}.eyebrow{font:11px Consolas,monospace;color:var(--green);letter-spacing:.14em}h1{font-size:30px;letter-spacing:-.05em;margin:10px 0}.muted{color:var(--muted);font-size:13px}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:12px;color:var(--muted)}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:#070a0e;color:var(--text);font:inherit}.btn{width:100%;padding:12px;border:1px solid var(--green);border-radius:8px;background:#112219;color:var(--green);font-weight:700;cursor:pointer;margin-top:8px}.switch{border:0;background:transparent;color:var(--cyan);cursor:pointer;padding:12px 0}.error{color:#ff8795;min-height:22px;font-size:12px}.profile{padding:16px;border:1px solid var(--line);border-radius:10px;margin:18px 0}.hidden{display:none!important}.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px;font-size:12px}</style></head><body><main class="box"><div class="eyebrow">YOUTHDEVELOPER IDENTITY</div><h1>통합 계정</h1><p class="muted">하나의 계정으로 YouthDeveloper 서비스에 연결할 수 있습니다. 현재 채팅 서비스 계정과 동일한 계정 체계를 사용합니다.</p><form id="authForm"><div class="field"><label for="nickname">닉네임 (2~20자)</label><input id="nickname" minlength="2" maxlength="20" autocomplete="username" required></div><div class="field"><label for="password">비밀번호 (8자 이상)</label><input id="password" type="password" minlength="8" maxlength="128" autocomplete="current-password" required></div><button class="btn" id="submit" type="submit">로그인</button></form><button class="switch" id="switch" type="button">계정이 없으신가요? 회원가입</button><div class="error" id="error" role="alert"></div><section id="profile" class="profile hidden"><strong id="who"></strong><p class="muted">로그인되어 있습니다. 이 계정은 YouthDeveloper 채팅 서비스에서도 사용할 수 있습니다.</p><button class="btn" id="logout" type="button">로그아웃</button></section><div class="links"><a href="/">홈페이지</a><a href="/server-tools/chat.html">채팅 열기</a><a href="/youthcraft/">YouthCraft</a></div></main><script>(()=>{const API='https://web.youthdeveloper-github.workers.dev/api/chat',KEY='yd_chat_token',$=id=>document.getElementById(id);let mode='login',token=localStorage.getItem(KEY)||'';function setMode(m){mode=m;$('submit').textContent=m==='login'?'로그인':'회원가입';$('switch').textContent=m==='login'?'계정이 없으신가요? 회원가입':'이미 계정이 있으신가요? 로그인';$('password').autocomplete=m==='login'?'current-password':'new-password';$('error').textContent='';}async function api(path,method='GET',body){const r=await fetch(API+path,{method,headers:{...(token?{Authorization:'Bearer '+token}:{}),...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'요청에 실패했습니다.');return d;}async function check(){if(!token)return;try{const d=await api('/me');$('profile').classList.remove('hidden');$('authForm').classList.add('hidden');$('switch').classList.add('hidden');$('who').textContent=d.user.nickname+' 님 로그인됨';}catch{token='';localStorage.removeItem(KEY);}}$('switch').onclick=()=>setMode(mode==='login'?'register':'login');$('authForm').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('error').textContent='';try{const d=await api('/'+mode,'POST',{nickname:$('nickname').value.trim(),password:$('password').value});token=d.token;localStorage.setItem(KEY,token);$('password').value='';await check();}catch(err){$('error').textContent=err.message;}finally{$('submit').disabled=false;}};$('logout').onclick=()=>{token='';localStorage.removeItem(KEY);$('profile').classList.add('hidden');$('authForm').classList.remove('hidden');$('switch').classList.remove('hidden');setMode('login');};check();})();</script></body></html>
