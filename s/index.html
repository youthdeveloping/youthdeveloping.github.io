<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#080b10"><title>URL 단축기 | YouthDeveloper</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:#10161f;--line:#273241;--text:#edf3fa;--muted:#9aa9b8;--green:#61ff9a;--cyan:#62e8ff;--red:#ff7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 10%,#10303a 0,transparent 30rem),var(--bg);color:var(--text);font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif;min-height:100vh}.wrap{width:min(760px,calc(100% - 32px));margin:auto;padding:28px 0 60px}a{color:var(--cyan);text-decoration:none}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:54px;font-size:13px}.brand{font-weight:800;letter-spacing:.03em;color:white}.eyebrow{font:700 11px monospace;letter-spacing:.16em;color:var(--green)}h1{font-size:clamp(38px,8vw,64px);line-height:1.02;letter-spacing:-.06em;margin:14px 0}.lead{color:var(--muted);line-height:1.8;max-width:560px}.panel{border:1px solid var(--line);background:#10161fdb;border-radius:18px;padding:clamp(20px,5vw,32px);margin-top:28px;box-shadow:0 22px 80px #0003}label{display:block;font-size:13px;color:#c5d1dc;margin:18px 0 8px}input{width:100%;border:1px solid #334252;background:#090e14;color:white;border-radius:10px;padding:14px;font:inherit;outline:none}input:focus{border-color:var(--cyan)}button{border:0;border-radius:10px;background:var(--green);color:#07100b;padding:14px 18px;font-weight:800;font:inherit;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.primary{width:100%;margin-top:20px}.result{display:none;margin-top:20px;padding:16px;border:1px solid #2c6450;border-radius:12px;background:#0b1d16;overflow-wrap:anywhere}.result a{display:block;margin:8px 0}.error{color:var(--red);line-height:1.6}.hint{font-size:12px;line-height:1.7;color:var(--muted);margin-top:12px}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{background:#243342;color:var(--text)}footer{margin-top:34px;color:#708090;font-size:12px;display:flex;gap:18px;justify-content:space-between;flex-wrap:wrap}
</style></head><body><main class="wrap"><nav class="top"><a class="brand" href="/">YOUTHDEVELOPER / TOOLS</a><a href="/s/admin.html">관리자</a></nav><div class="eyebrow">LINK INFRASTRUCTURE / 01</div><h1>짧게 만들고,<br>간편하게 공유하세요.</h1><p class="lead">긴 주소를 짧은 링크로 바꿔보세요. 원하는 코드를 직접 지정할 수 있고, 생성된 링크의 클릭 수는 관리자 페이지에서 확인할 수 있습니다.</p>
<section class="panel"><form id="form"><label for="longUrl">원본 URL</label><input id="longUrl" type="url" placeholder="https://example.com/page" required autocomplete="url"><label for="alias">사용자 지정 코드 <span style="color:#81909e">(선택 사항)</span></label><input id="alias" type="text" placeholder="my-link (비워두면 자동 생성)" minlength="3" maxlength="32" pattern="[A-Za-z0-9][A-Za-z0-9_-]{2,31}" autocomplete="off"><p class="hint">3~32자, 영문·숫자·밑줄·하이픈을 사용할 수 있습니다. 이미 사용 중인 코드는 선택할 수 없습니다.</p><button class="primary" id="submit" type="submit">짧은 링크 만들기 ↗</button></form><div id="result" class="result" aria-live="polite"><strong>링크가 생성되었습니다.</strong><a id="shortUrl" href="#"></a><div class="actions"><button id="copy" type="button">링크 복사</button><button id="again" type="button">새 링크 만들기</button></div></div><p id="message" class="hint" role="status"></p></section>
<footer><span>© 2026 YouthDeveloper</span><a href="/">메인 페이지</a></footer></main>
<script>
const API="https://web.youthdeveloper-github.workers.dev";const form=document.querySelector("#form"),submit=document.querySelector("#submit"),message=document.querySelector("#message"),result=document.querySelector("#result"),shortUrl=document.querySelector("#shortUrl");
form.addEventListener("submit",async e=>{e.preventDefault();message.textContent="링크를 생성하고 있습니다…";message.className="hint";submit.disabled=true;try{const res=await fetch(API+"/api/shorten",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({longUrl:document.querySelector("#longUrl").value.trim(),alias:document.querySelector("#alias").value.trim()})});const data=await res.json();if(!res.ok)throw new Error(data.error||"링크 생성에 실패했습니다.");shortUrl.href=data.shortUrl;shortUrl.textContent=data.shortUrl;result.style.display="block";message.textContent="생성 완료";}catch(err){message.textContent=err.message||"서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.";message.className="hint error";}finally{submit.disabled=false;}});
document.querySelector("#copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(shortUrl.href);message.textContent="클립보드에 복사했습니다.";}catch{message.textContent="링크를 직접 선택해 복사해 주세요.";const r=document.createRange();r.selectNodeContents(shortUrl);const s=getSelection();s.removeAllRanges();s.addRange(r);}});
document.querySelector("#again").addEventListener("click",()=>{result.style.display="none";message.textContent="";document.querySelector("#alias").focus();});
</script></body></html>
