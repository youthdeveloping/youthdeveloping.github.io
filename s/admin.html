<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#080b10"><title>URL 단축기 관리 | YouthDeveloper</title><style>
:root{color-scheme:dark;--bg:#080b10;--panel:#10161f;--line:#273241;--text:#edf3fa;--muted:#9aa9b8;--green:#61ff9a;--cyan:#62e8ff;--red:#ff7185}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif}.wrap{width:min(1100px,calc(100% - 32px));margin:auto;padding:28px 0 60px}a{color:var(--cyan);text-decoration:none}.top{display:flex;justify-content:space-between;gap:20px;margin-bottom:42px;font-size:13px}.eyebrow{color:var(--green);font:700 11px monospace;letter-spacing:.16em}h1{font-size:clamp(34px,6vw,54px);letter-spacing:-.05em;margin:12px 0}.muted{color:var(--muted);line-height:1.7}.panel{border:1px solid var(--line);background:var(--panel);padding:24px;border-radius:14px;margin:20px 0}label{display:block;font-size:13px;margin:12px 0 8px}input{width:100%;padding:13px;border:1px solid #344353;background:#080d13;color:white;border-radius:9px;font:inherit}button{border:0;background:var(--green);color:#08100b;padding:11px 15px;border-radius:8px;font:inherit;font-weight:750;cursor:pointer}button.secondary{background:#263443;color:var(--text)}button.danger{background:#3b1b25;color:#ff9aa8}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row input{flex:1;min-width:200px}.status{font-size:13px;color:var(--muted);margin-top:12px}.error{color:var(--red)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{border:1px solid var(--line);padding:16px;border-radius:10px}.stat small{display:block;color:var(--muted);margin-bottom:7px}.stat strong{font-size:24px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:720px;font-size:13px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600}td a{overflow-wrap:anywhere}.count{font-variant-numeric:tabular-nums}.hidden{display:none!important}@media(max-width:560px){.panel{padding:17px}.stats{grid-template-columns:1fr}.top{margin-bottom:28px}}
</style></head><body><main class="wrap"><nav class="top"><a href="/">YOUTHDEVELOPER / TOOLS</a><a href="/s/">단축기</a></nav><div class="eyebrow">ADMIN CONSOLE / URL SHORTENER</div><h1>링크 관리</h1><p class="muted">관리자 인증 후 생성된 링크와 클릭 통계를 확인하고 링크를 삭제할 수 있습니다. 인증 토큰은 이 브라우저의 세션에만 저장됩니다.</p>
<section class="panel" id="loginPanel"><h2>관리자 인증</h2><form id="loginForm"><label for="token">관리자 토큰</label><div class="row"><input id="token" type="password" autocomplete="current-password" placeholder="관리자 비밀번호 (ADMIN_SECRET)" required><button type="submit">인증 및 접속</button></div></form><p class="status" id="loginStatus" role="status"></p></section>
<section id="dashboard" class="hidden"><div class="row" style="justify-content:space-between"><h2>대시보드</h2><div class="row"><button id="refresh" class="secondary">새로고침</button><button id="logout" class="secondary">로그아웃</button></div></div><div class="stats"><div class="stat"><small>등록된 링크</small><strong id="total">—</strong></div><div class="stat"><small>전체 클릭 수</small><strong id="clicks">—</strong></div><div class="stat"><small>사용자 지정 코드</small><strong id="aliases">—</strong></div></div><p id="status" class="status" role="status"></p><section class="panel table-wrap"><table><thead><tr><th>단축 링크</th><th>원본 URL</th><th>클릭 수</th><th>생성일</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table></section></section>
</main><script>
const API="https://web.youthdeveloper-github.workers.dev";let token=sessionStorage.getItem("yd_short_admin_token")||"";const $=id=>document.getElementById(id);const auth=()=>({Authorization:"Bearer "+token});function showDashboard(on){$("dashboard").classList.toggle("hidden",!on);$("loginPanel").classList.toggle("hidden",on);}
async function load(){ $("status").textContent="링크 목록을 불러오는 중…";try{const r=await fetch(API+"/api/admin/links",{headers:auth()});const d=await r.json();if(!r.ok)throw new Error(d.error||"인증 실패");const links=d.links||[];$("total").textContent=links.length;$("clicks").textContent=links.reduce((s,x)=>s+Number(x.clicks||0),0).toLocaleString("ko-KR");$("aliases").textContent=links.filter(x=>x.alias).length;$("rows").replaceChildren();for(const x of links){const tr=document.createElement("tr");const short=document.createElement("a");short.href=x.shortUrl;short.textContent=x.shortUrl;short.target="_blank";short.rel="noopener";const dest=document.createElement("a");dest.href=x.url;dest.textContent=x.url;dest.target="_blank";dest.rel="noopener";const cells=[short,dest,String(x.clicks||0),x.createdAt?new Date(x.createdAt).toLocaleString("ko-KR"):"기존 링크"];for(const value of cells){const td=document.createElement("td");if(value instanceof Node)td.append(value);else td.textContent=value;if(value===String(x.clicks||0))td.className="count";tr.append(td);}const td=document.createElement("td"),btn=document.createElement("button");btn.className="danger";btn.textContent="삭제";btn.addEventListener("click",()=>removeLink(x.key));td.append(btn);tr.append(td);$("rows").append(tr);} $("status").textContent=d.truncated?"일부 링크만 표시되고 있습니다.":"총 "+links.length+"개 링크를 불러왔습니다.";}catch(e){$("status").textContent=e.message;$("status").className="status error";if(/인증|관리자/.test(e.message)){sessionStorage.removeItem("yd_short_admin_token");token="";showDashboard(false);}}}
async function removeLink(key){if(!confirm("단축 코드 '"+key+"'를 삭제하시겠습니까?"))return;try{const r=await fetch(API+"/api/admin/links/"+encodeURIComponent(key),{method:"DELETE",headers:auth()});const d=await r.json();if(!r.ok)throw new Error(d.error||"삭제 실패");await load();}catch(e){$("status").textContent=e.message;$("status").className="status error";}}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();const password=$("token").value;token="";$("loginStatus").textContent="인증 중…";try{const login=await fetch(API+"/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password})});const session=await login.json();if(!login.ok)throw new Error(session.error||"로그인 실패");token=session.token;const check=await fetch(API+"/api/admin/links",{headers:auth()});const data=await check.json();if(!check.ok)throw new Error(data.error||"인증 실패");sessionStorage.setItem("yd_short_admin_token",token);$("token").value="";$("loginStatus").textContent="인증되었습니다.";showDashboard(true);await load();}catch(err){token="";sessionStorage.removeItem("yd_short_admin_token");$("loginStatus").textContent=err.message;$("loginStatus").className="status error";}});
$("refresh").addEventListener("click",load);$("logout").addEventListener("click",()=>{sessionStorage.removeItem("yd_short_admin_token");token="";$("token").value="";showDashboard(false);$("loginStatus").textContent="로그아웃했습니다.";});
if(token){showDashboard(true);load();}else showDashboard(false);
</script></body></html>
