<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070a"><title>공지사항 | YouthDeveloper</title><style>:root{--bg:#05070a;--panel:#0c1016;--line:rgba(255,255,255,.1);--text:#edf2f7;--muted:#8b96a3;--green:#61ff9a;--cyan:#62e8ff;--mono:Consolas,monospace}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0%,#10202a,transparent 30rem),var(--bg);color:var(--text);font:14px/1.7 Inter,system-ui,sans-serif}.wrap{width:min(900px,calc(100% - 32px));margin:auto}header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font:12px var(--mono)}a{color:var(--green);text-decoration:none}.hero{padding:56px 0 30px}.eyebrow{color:var(--green);font:11px var(--mono);letter-spacing:.15em}h1{font-size:clamp(36px,7vw,58px);letter-spacing:-.06em;margin:12px 0}.muted{color:var(--muted)}.list{display:grid;gap:12px;padding-bottom:60px}.item{padding:22px;border:1px solid var(--line);background:var(--panel);border-radius:13px}.item h2{font-size:20px;margin:0 0 8px}.date{color:var(--cyan);font:11px var(--mono);margin-bottom:10px}.body{white-space:pre-wrap;overflow-wrap:anywhere;color:#c6ced7}.empty{padding:36px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}.back{border:1px solid var(--line);padding:8px 12px;border-radius:8px}</style></head><body><div class="wrap"><header><a href="/">YOUTHDEVELOPER / PORTAL</a><a href="/" class="back">← HOME</a></header><section class="hero"><div class="eyebrow">PUBLIC INFORMATION</div><h1>공지사항</h1><p class="muted">관리자가 등록한 공식 공지입니다.</p></section><main class="list" id="notices"><div class="empty">공지를 불러오는 중입니다.</div></main></div><script>(async()=>{const box=document.getElementById('notices');try{const r=await fetch('https://web.youthdeveloper-github.workers.dev/api/public/notices',{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json(),items=d.notices||[];box.replaceChildren();if(!items.length){const e=document.createElement('div');e.className='empty';e.textContent='등록된 공지가 없습니다.';box.append(e);return;}items.forEach(n=>{const a=document.createElement('article');a.className='item';const date=document.createElement('div');date.className='date';date.textContent=new Date(n.createdAt||Date.now()).toLocaleDateString('ko-KR');const h=document.createElement('h2');h.textContent=n.title;const b=document.createElement('div');b.className='body';b.textContent=n.body;a.append(date,h,b);box.append(a);});}catch(e){box.textContent='공지를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.';}})();</script></body></html>
