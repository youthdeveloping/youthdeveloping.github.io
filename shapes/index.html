<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05070a">
<meta name="description" content="카메라나 사진으로 도형을 알아보는 AI 도형 분류기">
<title>도형 분류기 · YouthDeveloper</title>
<style>
:root{--bg:#05070a;--panel:#0c1016;--line:rgba(255,255,255,.09);--text:#edf2f7;--muted:#7d8996;--green:#61ff9a;--cyan:#62e8ff;--mono:"SFMono-Regular","Cascadia Code","Roboto Mono",Consolas,monospace;--sans:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;color:var(--text);background:radial-gradient(circle at 80% 10%,rgba(98,232,255,.07),transparent 30rem),var(--bg);font-family:var(--sans)}
a{color:inherit;text-decoration:none}
.wrap{width:min(920px,calc(100% - 32px));margin:auto}
.top{padding:22px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(5,7,10,.88);backdrop-filter:blur(14px);z-index:5}
.nav{display:flex;justify-content:space-between;align-items:center}
.brand{font:700 18px var(--mono)}.brand span{color:var(--green)}
.back{font:11px var(--mono);color:var(--muted)}.back:hover{color:var(--green)}
.hero{padding:48px 0 26px}
.eyebrow{font:10px var(--mono);letter-spacing:.14em;color:var(--green)}
h1{font-size:clamp(34px,6vw,60px);letter-spacing:-.06em;margin:9px 0}
.hero p{color:var(--muted);max-width:640px;line-height:1.8;margin:0}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;padding-bottom:70px}
.card{border:1px solid var(--line);background:rgba(12,16,22,.72);border-radius:14px;overflow:hidden}
.cardhead{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.cardhead h2{font-size:15px;margin:0}.tag{font:9px var(--mono);color:var(--green)}
.body{padding:18px}
.view{aspect-ratio:1/1;background:#080b0f;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.view canvas,.view img{width:100%;height:100%;object-fit:cover;display:block}
.placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--muted);font:12px/1.7 var(--mono)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button,.file{padding:10px 14px;border:1px solid rgba(97,255,154,.25);background:rgba(97,255,154,.07);color:var(--green);border-radius:8px;cursor:pointer;font:12px var(--mono)}
button:hover,.file:hover{background:rgba(97,255,154,.14)}
button:disabled{opacity:.45;cursor:not-allowed}
.file input{display:none}
.result{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.04em;margin:0 0 4px;min-height:1.3em}
.conf{font:12px var(--mono);color:var(--muted);margin:0 0 18px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:92px 1fr 46px;align-items:center;gap:10px;font:12px var(--mono)}
.bar .name{color:var(--muted);white-space:nowrap}
.bar.top .name{color:var(--text)}
.track{height:8px;border-radius:99px;background:#080b0f;border:1px solid var(--line);overflow:hidden}
.fill{height:100%;width:0;background:var(--cyan);transition:width .18s ease}
.bar.top .fill{background:var(--green)}
.pct{text-align:right;color:var(--muted)}
.status{margin-top:14px;font:11px var(--mono);color:var(--muted);min-height:1.4em}
.status.err{color:#ff667d}
.footer{padding:25px 0;border-top:1px solid var(--line);color:var(--muted);font:10px var(--mono)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
@media(max-width:760px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="wrap nav"><a class="brand" href="/">Youth<span>Developer</span></a><a class="back" href="/services.html">← ALL SERVICES</a></div></header>
<main class="wrap">
  <section class="hero">
    <div class="eyebrow">YOUTHDEVELOPER / AI</div>
    <h1>도형 분류기</h1>
    <p>카메라로 도형을 비추거나 사진을 올리면 AI가 어떤 도형인지 맞혀 봅니다. 삼각형, 사각형, 오각형, 육각형, 원을 구분합니다.</p>
  </section>

  <section class="layout">
    <article class="card">
      <div class="cardhead"><h2>입력</h2><span class="tag">CAMERA / PHOTO</span></div>
      <div class="body">
        <div class="view" id="view">
          <div class="placeholder" id="placeholder">카메라를 켜거나<br>사진을 선택해 주세요</div>
        </div>
        <div class="btns">
          <button id="camBtn" type="button">카메라 시작</button>
          <button id="flipBtn" type="button" disabled>카메라 전환</button>
          <label class="file">사진 선택<input id="fileInput" type="file" accept="image/*"></label>
        </div>
        <div class="status" id="status">모델을 불러오는 중입니다...</div>
      </div>
    </article>

    <article class="card">
      <div class="cardhead"><h2>결과</h2><span class="tag">PREDICTION</span></div>
      <div class="body">
        <p class="result" id="result">-</p>
        <p class="conf" id="conf">아직 분석한 내용이 없습니다</p>
        <div class="bars" id="bars"></div>
      </div>
    </article>
  </section>
</main>
<footer class="footer"><div class="wrap">YouthDeveloper // powered by Teachable Machine · 2026</div></footer>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<script>
(() => {
  'use strict';
  const MODEL_URL = 'https://teachablemachine.withgoogle.com/models/x-2g3fE7M/';

  const $ = id => document.getElementById(id);
  const view = $('view'), placeholder = $('placeholder'), statusEl = $('status');
  const camBtn = $('camBtn'), flipBtn = $('flipBtn'), fileInput = $('fileInput');
  const resultEl = $('result'), confEl = $('conf'), barsEl = $('bars');

  let model = null, maxClasses = 0;
  let webcam = null, running = false, facing = 'environment';
  let rows = [];

  function setStatus(msg, err) {
    statusEl.textContent = msg;
    statusEl.classList.toggle('err', !!err);
  }

  function buildBars(labels) {
    barsEl.textContent = '';
    rows = labels.map(name => {
      const row = document.createElement('div');
      row.className = 'bar';
      const n = document.createElement('span'); n.className = 'name'; n.textContent = name;
      const t = document.createElement('div'); t.className = 'track';
      const f = document.createElement('div'); f.className = 'fill'; t.appendChild(f);
      const p = document.createElement('span'); p.className = 'pct'; p.textContent = '0%';
      row.append(n, t, p);
      barsEl.appendChild(row);
      return { row, f, p, name };
    });
  }

  function render(prediction) {
    let best = 0;
    prediction.forEach((p, i) => { if (p.probability > prediction[best].probability) best = i; });
    prediction.forEach((p, i) => {
      const r = rows[i]; if (!r) return;
      const pct = Math.round(p.probability * 100);
      r.f.style.width = pct + '%';
      r.p.textContent = pct + '%';
      r.row.classList.toggle('top', i === best);
    });
    const b = prediction[best];
    resultEl.textContent = b.className;
    confEl.textContent = '확률 ' + Math.round(b.probability * 100) + '%';
  }

  async function predict(source) {
    const prediction = await model.predict(source);
    render(prediction);
  }

  async function loop() {
    if (!running) return;
    webcam.update();
    await predict(webcam.canvas);
    requestAnimationFrame(loop);
  }

  async function stopCamera() {
    running = false;
    if (webcam) { try { await webcam.stop(); } catch (e) {} webcam = null; }
    camBtn.textContent = '카메라 시작';
    flipBtn.disabled = true;
  }

  async function startCamera() {
    if (!model) return;
    camBtn.disabled = true;
    setStatus('카메라를 켜는 중입니다...');
    try {
      await stopCamera();
      webcam = new tmImage.Webcam(400, 400, facing === 'user');
      await webcam.setup({ facingMode: facing });
      await webcam.play();
      view.textContent = '';
      view.appendChild(webcam.canvas);
      running = true;
      camBtn.textContent = '카메라 끄기';
      flipBtn.disabled = false;
      setStatus('도형을 화면 가운데에 크게 비춰 주세요.');
      requestAnimationFrame(loop);
    } catch (e) {
      webcam = null;
      setStatus('카메라를 사용할 수 없습니다. 권한을 확인하거나 사진을 선택해 주세요.', true);
    } finally {
      camBtn.disabled = false;
    }
  }

  camBtn.addEventListener('click', () => { running ? stopCamera().then(() => setStatus('카메라를 껐습니다.')) : startCamera(); });
  flipBtn.addEventListener('click', () => { facing = facing === 'user' ? 'environment' : 'user'; startCamera(); });

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file || !model) return;
    await stopCamera();
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = async () => {
      view.textContent = '';
      view.appendChild(img);
      try { await predict(img); setStatus('사진 분석을 마쳤습니다.'); }
      catch (e) { setStatus('사진을 분석하지 못했습니다.', true); }
    };
    img.onerror = () => setStatus('이미지를 열 수 없습니다.', true);
    img.src = url;
    fileInput.value = '';
  });

  async function init() {
    camBtn.disabled = true; fileInput.disabled = true;
    try {
      if (!window.tmImage) throw new Error('lib');
      model = await tmImage.load(MODEL_URL + 'model.json', MODEL_URL + 'metadata.json');
      maxClasses = model.getTotalClasses();
      buildBars(model.getClassLabels());
      setStatus('준비되었습니다. 카메라를 켜거나 사진을 선택해 주세요.');
      camBtn.disabled = false; fileInput.disabled = false;
    } catch (e) {
      setStatus('모델을 불러오지 못했습니다. 네트워크를 확인하고 새로고침해 주세요.', true);
    }
  }
  init();
})();
</script>
</body>
</html>
