<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>채팅 관리자 | YouthDeveloper</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#20232b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.top h1{font-size:25px;margin:0}.muted{color:#6d7482;font-size:13px}.panel{background:#fff;border:1px solid #e5e8ef;border-radius:17px;padding:20px;margin-top:18px;box-shadow:0 8px 28px #17233a08}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#f7f8fc;border-radius:12px;padding:17px}.stat strong{display:block;font-size:27px;margin-top:6px}.btn{border:0;border-radius:10px;background:#4e62db;color:white;padding:10px 14px;font-weight:700;cursor:pointer}.btn.alt{background:#edf0f6;color:#252936}.btn.danger{background:#c93643}.login{max-width:420px;margin:9vh auto}.login input{width:100%;padding:12px;border:1px solid #dce0e8;border-radius:10px;margin:7px 0 13px;font:inherit}.login .btn{width:100%}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #edf0f4;white-space:nowrap}th{color:#6d7482;font-size:12px}.error{color:#b42332;background:#fff0f1;padding:10px;border-radius:9px}.ok{color:#236e43}#users tr:hover{background:#fafbff}@media(max-width:600px){.wrap{padding:13px}.panel{padding:14px}.stats{grid-template-columns:1fr}.top h1{font-size:21px}}
</style></head><body><main class="wrap"><header class="top"><div><h1>채팅 관리자</h1><div class="muted">YouthDeveloper · 회원 및 채팅 운영</div></div><div><a href="./chat.html">채팅으로 돌아가기</a> <button id="logout" class="btn alt">로그아웃</button></div></header><div id="message" style="margin-top:14px" aria-live="polite"></div>
<section id="loginPanel" class="panel login"><h2>관리자 로그인</h2><p class="muted">기존 Cloudflare Worker 관리자 비밀번호를 사용합니다.</p><form id="loginForm"><label for="password">관리자 비밀번호</label><input id="password" type="password" autocomplete="current-password" required><button class="btn">로그인</button></form></section>
<section id="dashboard" class="hidden"><div class="stats panel"><div class="stat">가입 회원<strong id="usersCount">—</strong></div><div class="stat">대화방<strong id="conversationsCount">—</strong></div><div class="stat">저장 메시지<strong id="messagesCount">—</strong></div></div><section class="panel"><div class="row"><div><h2 style="margin:0">회원 관리</h2><p class="muted">닉네임, 가입일을 확인하고 악성 계정을 삭제할 수 있습니다.</p></div><button class="btn" id="refresh">새로고침</button></div><div class="tablewrap"><table><thead><tr><th>닉네임</th><th>가입일</th><th>회원 ID</th><th>작업</th></tr></thead><tbody id="users"><tr><td colspan="4">불러오는 중…</td></tr></tbody></table></div></section><section class="panel"><h2>운영 참고</h2><p class="muted">계정 삭제 시 해당 회원의 프로필과 대화 기록이 삭제됩니다. 삭제 작업은 되돌릴 수 없습니다. 관리자 비밀번호나 인증 토큰을 다른 사람과 공유하지 마세요.</p></section></section></main>
<script>
(()=>{'use strict';const API='https://web.youthdeveloper-github.workers.dev/api';const $=s=>document.querySelector(s);let token=sessionStorage.getItem('yd_chat_admin_token')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function say(s,bad=false){$('#message').innerHTML=s?'<div class="'+(bad?'error':'muted')+'">'+esc(s)+'</div>':'';}async function req(path,opts={}){const r=await fetch(API+path,{...opts,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'요청에 실패했습니다.');return d;}function show(on){$('#loginPanel').classList.toggle('hidden',on);$('#dashboard').classList.toggle('hidden',!on);$('#logout').classList.toggle('hidden',!on)}$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const d=await req('/admin/login',{method:'POST',body:JSON.stringify({password:$('#password').value})});token=d.token;sessionStorage.setItem('yd_chat_admin_token',token);$('#password').value='';show(true);await load();say('로그인되었습니다.');}catch(err){say(err.message,true)}};async function load(){const [o,u]=await Promise.all([req('/chat/admin/overview'),req('/chat/admin/users')]);$('#usersCount').textContent=o.users;$('#conversationsCount').textContent=o.conversations;$('#messagesCount').textContent=o.messages;$('#users').innerHTML=(u.users||[]).length?u.users.map(x=>'<tr><td><strong>'+esc(x.nickname)+'</strong></td><td>'+esc(x.createdAt?new Date(x.createdAt).toLocaleString('ko-KR'):'—')+'</td><td><code>'+esc(x.id)+'</code></td><td><button class="btn danger" data-delete="'+esc(x.id)+'" data-nick="'+esc(x.nickname)+'">회원 삭제</button></td></tr>').join(''):'<tr><td colspan="4">가입 회원이 없습니다.</td></tr>';$('#users').querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('닉네임 "'+b.dataset.nick+'" 회원과 해당 회원의 대화 기록을 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.'))return;try{await req('/chat/admin/users/'+encodeURIComponent(b.dataset.delete),{method:'DELETE'});say('회원 및 관련 대화 기록을 삭제했습니다.');await load()}catch(e){say(e.message,true)}})}$('#refresh').onclick=async()=>{try{await load();say('정보를 새로고침했습니다.')}catch(e){say(e.message,true)}};$('#logout').onclick=()=>{token='';sessionStorage.removeItem('yd_chat_admin_token');show(false);say('로그아웃되었습니다.')};async function start(){if(!token){show(false);return}try{await load();show(true)}catch{token='';sessionStorage.removeItem('yd_chat_admin_token');show(false)}}start()})();
</script></body></html>
