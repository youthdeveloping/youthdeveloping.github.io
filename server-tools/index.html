<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07090b"><title>서버 도구 | YouthDeveloper</title>
<style>
:root{color-scheme:dark;--bg:#07090b;--panel:#0c1013;--line:#222a2f;--muted:#85909a;--text:#e8edf2;--green:#45f6a0;--amber:#d8bb71}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif;min-height:100vh}main{max-width:1780px;margin:auto;padding:32px 30px 64px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}h1{font-size:clamp(32px,3vw,48px);letter-spacing:-1.5px;margin:0;font-weight:800}.private{border:1px solid #174b35;color:var(--green);border-radius:999px;padding:10px 16px;font:12px ui-monospace,monospace;letter-spacing:2px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.tool{display:flex;align-items:center;gap:24px;min-height:126px;padding:24px 27px;background:linear-gradient(135deg,#0d1115,#080a0c);border:1px solid var(--line);border-radius:22px;color:inherit;text-decoration:none;cursor:pointer;text-align:left;font:inherit;transition:border-color .18s,transform .18s,background .18s}.tool:hover{border-color:#246b4b;transform:translateY(-2px);background:#0d1312}.icon{display:grid;place-items:center;flex:0 0 66px;height:66px;border-radius:18px;background:#101b18;border:1px solid #183e2e;font-size:27px}.copy{min-width:0;flex:1}.name{font-size:23px;font-weight:700;letter-spacing:-.5px;margin-bottom:7px}.desc{color:var(--muted);font-size:16px;line-height:1.45}.status{flex-shrink:0;border:1px solid #20262b;border-radius:999px;padding:5px 13px;color:#7e8994;font-size:13px}.arrow{font-size:30px;color:var(--green);line-height:1}.foot{color:#59636e;font-size:13px;margin-top:24px}.hint{color:var(--muted);font-size:13px;line-height:1.6}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.open{display:flex}.dialog{width:min(780px,100%);max-height:88vh;overflow:auto;background:#0b0f12;border:1px solid #27312e;border-radius:22px;padding:24px}.dialoghead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.dialog h2{font-size:25px;margin:0}.close{border:1px solid var(--line);background:#11171a;color:#e8edf2;border-radius:10px;padding:8px 12px;cursor:pointer}.form{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.form input,.form textarea,.form select{flex:1;min-width:150px;background:#070a0c;border:1px solid #2a3338;color:var(--text);border-radius:11px;padding:12px;font:inherit}.form textarea{flex-basis:100%;min-height:90px;resize:vertical}.btn{border:1px solid #20563d;background:#10231a;color:var(--green);padding:11px 15px;border-radius:11px;font:inherit;cursor:pointer}.btn.secondary{border-color:#2a3338;background:#11171a;color:#c5ced7}.btn.danger{border-color:#663c3c;background:#271414;color:#ffaaaa}.items{display:grid;gap:9px;margin-top:15px}.item{padding:14px;border:1px solid #242d31;background:#0a0d0f;border-radius:12px;overflow-wrap:anywhere}.itemhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.muted{color:var(--muted);font-size:13px}.empty{color:#84909a;padding:20px;text-align:center;border:1px dashed #30393e;border-radius:12px}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{border:1px solid #26312d;border-radius:14px;padding:16px}.stat strong{display:block;font-size:26px;margin-top:8px}.green{color:var(--green)}.warning{color:var(--amber)}.notice{padding:12px 14px;border:1px solid #174b35;background:#0d1913;color:#a8e9c6;border-radius:12px;margin-bottom:18px;font-size:13px}.pill{font-size:12px;border:1px solid #30393e;border-radius:99px;padding:4px 8px;color:#9aa5ae}.login{position:fixed;inset:0;background:radial-gradient(ellipse at top,#102019 0,#07090b 60%);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.login.hidden{display:none}.loginbox{width:min(430px,100%);border:1px solid #23332c;background:#0b0f12;border-radius:24px;padding:28px;box-shadow:0 20px 80px #0008}.loginbox h2{font-size:28px;margin:0 0 8px}.loginbox p{color:var(--muted);line-height:1.6;font-size:14px}.loginbox input{width:100%;background:#070a0c;border:1px solid #2a3338;color:var(--text);border-radius:11px;padding:14px;font:inherit;margin:8px 0 12px}.loginbox .btn{width:100%}.error{color:#ffaaaa;font-size:13px;min-height:20px}.toolbar{display:flex;gap:9px;justify-content:flex-end;margin-bottom:14px}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tool{gap:16px;padding:20px}.icon{flex-basis:58px;height:58px}.name{font-size:20px}}@media(max-width:650px){main{padding:25px 16px 42px}.grid{grid-template-columns:1fr;gap:12px}.tool{min-height:106px;padding:17px;border-radius:17px}.top{margin-bottom:22px}.status{font-size:11px;padding:5px 9px}.desc{font-size:14px}.name{font-size:19px}.statgrid{grid-template-columns:1fr}.dialog{padding:18px}}
</style></head><body>
<div class="login" id="login"><form class="loginbox" id="loginForm"><div class="private">PRIVATE · AUTH REQUIRED</div><h2 style="margin-top:22px">서버 도구 로그인</h2><p>Cloudflare Worker의 관리자 인증을 통해 서버 도구에 접속합니다. 비밀번호는 이 페이지에 저장되지 않습니다.</p><label for="password">서버 관리자 비밀번호</label><input id="password" type="password" autocomplete="current-password" required placeholder="비밀번호 입력"><button class="btn" id="loginButton">인증하고 접속</button><div class="error" id="loginError" role="alert"></div></form></div>
<main><header class="top"><h1>서버 도구</h1><div style="display:flex;gap:10px;align-items:center"><span class="private">PRIVATE</span><button class="btn secondary" id="logout">로그아웃</button></div></header>
<div class="notice" id="connectionNotice">서버에 인증되었습니다. 데이터는 Cloudflare KV에 저장되며 인증된 세션에서 공유됩니다.</div>
<section class="grid" aria-label="서버 도구 목록">
<button class="tool" data-app="chat"><span class="icon">💬</span><span class="copy"><div class="name">채팅방</div><div class="desc">인증된 계정 간 공유 채팅</div></span><span class="status">서버 연결</span></button>
<button class="tool" data-app="ledger"><span class="icon">💰</span><span class="copy"><div class="name">용돈 기록장</div><div class="desc">수입 · 지출 기록과 잔액</div></span><span class="status">서버 연결</span></button>
<button class="tool" data-app="suggestions"><span class="icon">📨</span><span class="copy"><div class="name">건의함</div><div class="desc">의견 등록 및 처리 상태</div></span><span class="status">서버 연결</span></button>
<button class="tool" data-app="notices"><span class="icon">📰</span><span class="copy"><div class="name">서버 공지</div><div class="desc">공지 등록 · 수정 · 삭제</div></span><span class="status">서버 연결</span></button>
<button class="tool" data-app="status"><span class="icon">🟢</span><span class="copy"><div class="name">서버 상태</div><div class="desc">정상 · 점검 · 장애 관리</div></span><span class="status">서버 연결</span></button>
<button class="tool" data-app="stats"><span class="icon">📈</span><span class="copy"><div class="name">서버 통계</div><div class="desc">서버에 저장된 항목 통계</div></span><span class="status">서버 연결</span></button>
<button class="tool" data-app="device"><span class="icon">🕵️</span><span class="copy"><div class="name">내 접속 정보</div><div class="desc">브라우저 · OS · 화면 정보</div></span><span class="status">기기 정보</span></button>
<a class="tool" href="../anonymous/"><span class="icon">📝</span><span class="copy"><div class="name">익명 한마디</div><div class="desc">이름 없이 메시지 남기기</div></span><span class="arrow">›</span></a>
</section><p class="foot">YouthDeveloper · Server Tools · Cloudflare Worker + KV</p></main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><section class="dialog"><header class="dialoghead"><h2 id="dialogTitle">도구</h2><button class="close" id="close">닫기</button></header><div id="appContent"></div></section></div>
<script>
(function(){
const API='https://web.youthdeveloper-github.workers.dev';
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
let token=sessionStorage.getItem('yd_server_token')||'',current='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=v=>{try{return new Date(v).toLocaleString('ko-KR',{dateStyle:'short',timeStyle:'short'})}catch{return ''}};
const notice=(msg)=>{const n=$('#appContent');let el=n.querySelector('.apierror');if(!el){el=document.createElement('div');el.className='notice apierror';n.prepend(el)}el.textContent=msg};
async function api(path,method='GET',body){const headers={'Content-Type':'application/json'};if(token)headers.Authorization='Bearer '+token;let r;try{r=await fetch(API+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body)})}catch{throw Error('서버에 연결할 수 없습니다. Worker 주소와 네트워크를 확인해 주세요.')}let data={};try{data=await r.json()}catch{}if(r.status===401){logout(false);throw Error('인증이 만료되었습니다. 다시 로그인해 주세요.')}if(!r.ok)throw Error(data.error||('요청 실패 ('+r.status+')'));return data}
function showLogin(){ $('#login').classList.remove('hidden');$('#password').focus() }
function hideLogin(){ $('#login').classList.add('hidden') }
function logout(show=true){token='';sessionStorage.removeItem('yd_server_token');hideModal();showLogin();if(show)$('#loginError').textContent='로그아웃되었습니다.'}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('#loginButton');btn.disabled=true;btn.textContent='인증 중…';$('#loginError').textContent='';try{const r=await fetch(API+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'로그인에 실패했습니다.');token=d.token;sessionStorage.setItem('yd_server_token',token);$('#password').value='';hideLogin();$('#connectionNotice').textContent='서버 인증 완료 · Cloudflare KV 공유 저장소 연결';$('#connectionNotice').style.display='block';const requested=new URLSearchParams(location.search).get('app');if(requested&&['chat','ledger','suggestions','notices','status','stats','device'].includes(requested)){current=requested;$('#modal').classList.add('open');render().catch(err=>notice(err.message))}}catch(err){$('#loginError').textContent=err.message}finally{btn.disabled=false;btn.textContent='인증하고 접속'}});
$('#logout').onclick=()=>logout();function hideModal(){$('#modal').classList.remove('open');current=''}$('#close').onclick=hideModal;$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))hideModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')hideModal()});$$('[data-app]').forEach(b=>b.onclick=()=>{if(!token)return showLogin();current=b.dataset.app;$('#modal').classList.add('open');render().catch(e=>notice(e.message))});
const list=(items,empty,fn)=>items.length?'<div class="items">'+items.map(fn).join('')+'</div>':'<div class="empty">'+empty+'</div>';
const formVal=(form,name)=>String(new FormData(form).get(name)||'').trim();
async function render(){const titles={chat:'채팅방',ledger:'용돈 기록장',suggestions:'건의함',notices:'서버 공지',status:'서버 상태',stats:'서버 통계',device:'내 접속 정보'};$('#dialogTitle').textContent=titles[current]||'도구';const root=$('#appContent');root.innerHTML='<p class="muted">서버 데이터를 불러오는 중입니다…</p>';
if(current==='device'){const ua=navigator.userAgent;let browser=/Edg\//.test(ua)?'Microsoft Edge':/Chrome\//.test(ua)?'Google Chrome':/Firefox\//.test(ua)?'Mozilla Firefox':/Safari\//.test(ua)?'Safari':'알 수 없음';let os=/Windows NT 10/.test(ua)?'Windows 10/11':/Android/.test(ua)?'Android':/iPhone|iPad/.test(ua)?'iOS/iPadOS':/Mac OS X/.test(ua)?'macOS':/Linux/.test(ua)?'Linux':'알 수 없음';const rows=[['브라우저',browser],['운영체제',os],['화면 크기',screen.width+' × '+screen.height],['창 크기',innerWidth+' × '+innerHeight],['픽셀 비율',devicePixelRatio+'x'],['언어',navigator.language],['시간대',Intl.DateTimeFormat().resolvedOptions().timeZone],['네트워크',navigator.onLine?'온라인':'오프라인']];root.innerHTML='<p class="muted">기기 정보는 현재 브라우저에서만 확인하며 서버에 저장하지 않습니다.</p>'+list(rows,'',x=>'<div class="item itemhead"><span>'+esc(x[0])+'</span><strong>'+esc(x[1])+'</strong></div>');return}
if(current==='chat'){const r=await api('/api/tools/chat'),items=r.data||[];root.innerHTML='<p class="muted">인증된 서버 세션에서 공유되는 채팅 기록입니다.</p><form class="form" id="chatForm"><input name="name" maxlength="30" placeholder="닉네임" required><input name="message" maxlength="500" placeholder="메시지 입력" required><button class="btn">보내기</button></form>'+list(items.slice().reverse(),'아직 메시지가 없습니다.',x=>'<article class="item"><div class="itemhead"><strong>'+esc(x.name)+'</strong><span class="muted">'+date(x.createdAt)+'</span></div><p>'+esc(x.message)+'</p><button class="btn danger" data-del="'+x.id+'">삭제</button></article>');$('#chatForm').onsubmit=async e=>{e.preventDefault();const name=formVal(e.target,'name'),message=formVal(e.target,'message');try{await api('/api/tools/chat','POST',{name,message});await render()}catch(err){notice(err.message)}};$$('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('이 메시지를 삭제할까요?'))return;try{await api('/api/tools/chat/'+encodeURIComponent(b.dataset.del),'DELETE');await render()}catch(err){notice(err.message)}});return}
if(current==='ledger'){const r=await api('/api/tools/ledger'),items=r.data||[],balance=items.reduce((s,x)=>s+(x.type==='in'?x.amount:-x.amount),0),inc=items.filter(x=>x.type==='in').reduce((s,x)=>s+x.amount,0),out=items.filter(x=>x.type==='out').reduce((s,x)=>s+x.amount,0);root.innerHTML='<div class="statgrid"><div class="stat">잔액<strong>'+balance.toLocaleString()+'원</strong></div><div class="stat">총 수입<strong>'+inc.toLocaleString()+'원</strong></div><div class="stat">총 지출<strong>'+out.toLocaleString()+'원</strong></div></div><form class="form" id="ledgerForm"><select name="type"><option value="in">수입</option><option value="out">지출</option></select><input name="amount" type="number" min="1" max="100000000" placeholder="금액(원)" required><input name="memo" maxlength="100" placeholder="내용" required><button class="btn">기록 추가</button></form>'+list(items.slice().reverse(),'기록이 없습니다.',x=>'<article class="item"><div class="itemhead"><strong>'+esc(x.memo)+'</strong><strong class="'+(x.type==='in'?'green':'warning')+'">'+(x.type==='in'?'+':'−')+x.amount.toLocaleString()+'원</strong></div><div class="muted">'+date(x.createdAt)+'</div><button class="btn danger" data-del="'+x.id+'">삭제</button></article>');$('#ledgerForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/tools/ledger','POST',{type:new FormData(e.target).get('type'),amount:Number(new FormData(e.target).get('amount')),memo:formVal(e.target,'memo')});await render()}catch(err){notice(err.message)}};$$('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('이 기록을 삭제할까요?'))try{await api('/api/tools/ledger/'+b.dataset.del,'DELETE');await render()}catch(err){notice(err.message)}});return}
if(current==='suggestions'){const r=await api('/api/tools/suggestions'),items=r.data||[];root.innerHTML='<form class="form" id="suggestForm"><input name="title" maxlength="100" placeholder="건의 제목" required><textarea name="body" maxlength="3000" placeholder="건의 내용" required></textarea><button class="btn">건의 등록</button></form>'+list(items.slice().reverse(),'등록된 건의가 없습니다.',x=>'<article class="item"><div class="itemhead"><strong>'+esc(x.title)+'</strong><span class="pill">'+esc(x.state)+'</span></div><p>'+esc(x.body)+'</p><div class="muted">'+date(x.createdAt)+'</div><select data-state="'+x.id+'"><option '+(x.state==='접수'?'selected':'')+'>접수</option><option '+(x.state==='검토 중'?'selected':'')+'>검토 중</option><option '+(x.state==='완료'?'selected':'')+'>완료</option></select> <button class="btn danger" data-del="'+x.id+'">삭제</button></article>');$('#suggestForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/tools/suggestions','POST',{title:formVal(e.target,'title'),body:formVal(e.target,'body')});await render()}catch(err){notice(err.message)}};$$('[data-state]').forEach(s=>s.onchange=async()=>{try{await api('/api/tools/suggestions/'+s.dataset.state,'PUT',{state:s.value});await render()}catch(err){notice(err.message)}});$$('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('이 건의를 삭제할까요?'))try{await api('/api/tools/suggestions/'+b.dataset.del,'DELETE');await render()}catch(err){notice(err.message)}});return}
if(current==='notices'){const r=await api('/api/tools/notices'),items=r.data||[];root.innerHTML='<form class="form" id="noticeForm"><input name="title" maxlength="120" placeholder="공지 제목" required><textarea name="body" maxlength="5000" placeholder="공지 내용" required></textarea><button class="btn">공지 게시</button></form>'+list(items.slice().reverse(),'등록된 공지가 없습니다.',x=>'<article class="item"><div class="itemhead"><strong>'+esc(x.title)+'</strong><span class="muted">'+date(x.createdAt)+'</span></div><p>'+esc(x.body).replace(/\n/g,'<br>')+'</p><button class="btn secondary" data-edit="'+x.id+'">수정</button> <button class="btn danger" data-del="'+x.id+'">삭제</button></article>');$('#noticeForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/tools/notices','POST',{title:formVal(e.target,'title'),body:formVal(e.target,'body')});await render()}catch(err){notice(err.message)}};$$('[data-edit]').forEach(b=>b.onclick=async()=>{const x=items.find(i=>i.id===b.dataset.edit);const title=prompt('공지 제목',x.title);if(title===null)return;const body=prompt('공지 내용',x.body);if(body===null)return;try{await api('/api/tools/notices/'+x.id,'PUT',{title,body});await render()}catch(err){notice(err.message)}});$$('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('이 공지를 삭제할까요?'))try{await api('/api/tools/notices/'+b.dataset.del,'DELETE');await render()}catch(err){notice(err.message)}});return}
if(current==='status'){const r=await api('/api/tools/status'),s=r.data||{state:'정상',message:'모든 기능이 정상 작동 중입니다.'};root.innerHTML='<div class="item"><span class="pill">현재 서버 상태</span><h2 class="'+(s.state==='정상'?'green':s.state==='점검 중'?'warning':'')+'">'+esc(s.state)+'</h2><p>'+esc(s.message)+'</p><div class="muted">마지막 변경: '+date(s.updatedAt)+'</div></div><form class="form" id="statusForm"><select name="state"><option '+(s.state==='정상'?'selected':'')+'>정상</option><option '+(s.state==='점검 중'?'selected':'')+'>점검 중</option><option '+(s.state==='장애'?'selected':'')+'>장애</option></select><textarea name="message" maxlength="1000" required>'+esc(s.message)+'</textarea><button class="btn">상태 저장</button></form>';$('#statusForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/tools/status','PUT',{state:new FormData(e.target).get('state'),message:formVal(e.target,'message')});await render()}catch(err){notice(err.message)}};return}
if(current==='stats'){const r=await api('/api/tools/stats'),s=r.stats||{};root.innerHTML='<p class="muted">Cloudflare KV에 저장된 서버 데이터의 실시간 항목 수입니다.</p><div class="statgrid"><div class="stat">채팅 메시지<strong>'+Number(s.chat||0)+'</strong></div><div class="stat">수입·지출 기록<strong>'+Number(s.ledger||0)+'</strong></div><div class="stat">건의<strong>'+Number(s.suggestions||0)+'</strong></div><div class="stat">공지<strong>'+Number(s.notices||0)+'</strong></div><div class="stat">저장소<strong style="font-size:18px">Cloudflare KV</strong></div><div class="stat">갱신 시간<strong style="font-size:15px">'+date(r.generatedAt)+'</strong></div></div><div class="form"><button class="btn secondary" id="refreshStats">새로고침</button></div>';$('#refreshStats').onclick=()=>render();return}
