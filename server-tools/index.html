<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07090b"><title>서버 도구 | YouthDeveloper</title>
<style>
:root{color-scheme:dark;--bg:#07090b;--panel:#0b0e11;--line:#20262b;--muted:#77818d;--text:#e8edf2;--green:#45f6a0;--amber:#d8bb71}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif;min-height:100vh}main{max-width:1780px;margin:auto;padding:32px 30px 64px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}h1{font-size:clamp(32px,3vw,48px);letter-spacing:-1.5px;margin:0;font-weight:800}.private{border:1px solid #174b35;color:var(--green);border-radius:999px;padding:10px 16px;font:12px ui-monospace,monospace;letter-spacing:2px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.tool{display:flex;align-items:center;gap:24px;min-height:126px;padding:24px 27px;background:linear-gradient(135deg,#0d1115,#080a0c);border:1px solid var(--line);border-radius:22px;color:inherit;text-decoration:none;cursor:pointer;text-align:left;font:inherit;transition:border-color .18s,transform .18s,background .18s}.tool:hover{border-color:#246b4b;transform:translateY(-2px);background:#0d1312}.icon{display:grid;place-items:center;flex:0 0 66px;height:66px;border-radius:18px;background:#101b18;border:1px solid #183e2e;font-size:27px}.copy{min-width:0;flex:1}.name{font-size:23px;font-weight:700;letter-spacing:-.5px;margin-bottom:7px}.desc{color:var(--muted);font-size:16px;line-height:1.45}.status{flex-shrink:0;border:1px solid #20262b;border-radius:999px;padding:5px 13px;color:#7e8994;font-size:13px}.arrow{font-size:30px;color:var(--green);line-height:1}.foot{color:#59636e;font-size:13px;margin-top:24px}.hint{margin:0 0 18px;color:#89939e;font-size:13px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.open{display:flex}.dialog{width:min(760px,100%);max-height:88vh;overflow:auto;background:#0b0f12;border:1px solid #27312e;border-radius:22px;padding:24px}.dialoghead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.dialog h2{font-size:25px;margin:0}.close{border:1px solid var(--line);background:#11171a;color:#e8edf2;border-radius:10px;padding:8px 12px;cursor:pointer}.form{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.form input,.form textarea,.form select{flex:1;min-width:150px;background:#070a0c;border:1px solid #2a3338;color:var(--text);border-radius:11px;padding:12px;font:inherit}.form textarea{flex-basis:100%;min-height:90px;resize:vertical}.btn{border:1px solid #20563d;background:#10231a;color:var(--green);padding:11px 15px;border-radius:11px;font:inherit;cursor:pointer}.btn.secondary{border-color:#2a3338;background:#11171a;color:#c5ced7}.btn.danger{border-color:#663c3c;background:#271414;color:#ffaaaa}.items{display:grid;gap:9px;margin-top:15px}.item{padding:14px;border:1px solid #242d31;background:#0a0d0f;border-radius:12px;overflow-wrap:anywhere}.itemhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.muted{color:var(--muted);font-size:13px}.empty{color:#84909a;padding:20px;text-align:center;border:1px dashed #30393e;border-radius:12px}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{border:1px solid #26312d;border-radius:14px;padding:16px}.stat strong{display:block;font-size:26px;margin-top:8px}.green{color:var(--green)}.warning{color:var(--amber)}.notice{padding:12px 14px;border:1px solid #3e3420;background:#17130b;color:#d7c18e;border-radius:12px;margin-bottom:18px;font-size:13px}.pill{font-size:12px;border:1px solid #30393e;border-radius:99px;padding:4px 8px;color:#9aa5ae}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tool{gap:16px;padding:20px}.icon{flex-basis:58px;height:58px}.name{font-size:20px}}@media(max-width:650px){main{padding:25px 16px 42px}.grid{grid-template-columns:1fr;gap:12px}.tool{min-height:106px;padding:17px;border-radius:17px}.top{margin-bottom:22px}.status{font-size:11px;padding:5px 9px}.desc{font-size:14px}.name{font-size:19px}.statgrid{grid-template-columns:1fr}}
</style></head><body><main><header class="top"><h1>서버 도구</h1><span class="private">PRIVATE</span></header><div class="notice">현재 데이터는 이 브라우저에 저장됩니다. 여러 계정 간 실시간 공유 및 안전한 관리자 권한은 서버 API 연결 후 활성화됩니다.</div><section class="grid" aria-label="서버 도구 목록">
<button class="tool" data-app="chat"><span class="icon">💬</span><span class="copy"><div class="name">채팅방</div><div class="desc">메시지 작성 및 대화 기록</div></span><span class="status">사용 가능</span></button>
<button class="tool" data-app="ledger"><span class="icon">💰</span><span class="copy"><div class="name">용돈 기록장</div><div class="desc">수입 · 지출 기록과 잔액</div></span><span class="status">사용 가능</span></button>
<button class="tool" data-app="suggestion"><span class="icon">📨</span><span class="copy"><div class="name">건의함</div><div class="desc">의견 작성 및 목록 확인</div></span><span class="status">사용 가능</span></button>
<button class="tool" data-app="notice"><span class="icon">📰</span><span class="copy"><div class="name">서버 공지</div><div class="desc">공지 작성 · 수정 · 삭제</div></span><span class="status">사용 가능</span></button>
<button class="tool" data-app="status"><span class="icon">🟢</span><span class="copy"><div class="name">서버 상태</div><div class="desc">정상 · 점검 · 장애 상태 관리</div></span><span class="status">사용 가능</span></button>
<button class="tool" data-app="stats"><span class="icon">📈</span><span class="copy"><div class="name">서버 통계</div><div class="desc">이 브라우저의 사용량 확인</div></span><span class="status">사용 가능</span></button>
<button class="tool" data-app="device"><span class="icon">🕵️</span><span class="copy"><div class="name">내 접속 정보</div><div class="desc">브라우저 · OS · 화면 정보</div></span><span class="status">사용 가능</span></button>
<a class="tool" href="../anonymous/"><span class="icon">📝</span><span class="copy"><div class="name">익명 한마디</div><div class="desc">이름 없이 메시지 남기기</div></span><span class="arrow">›</span></a>
</section><p class="foot">YouthDeveloper · Server Tools</p></main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><section class="dialog"><header class="dialoghead"><h2 id="dialogTitle">도구</h2><button class="close" id="close">닫기</button></header><div id="appContent"></div></section></div>
<script>
(function(){
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const read=(k,d=[])=>{try{const v=JSON.parse(localStorage.getItem('ydtools:'+k));return v===null?d:v}catch{return d}};
const write=(k,v)=>localStorage.setItem('ydtools:'+k,JSON.stringify(v));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=v=>new Date(v).toLocaleString('ko-KR',{dateStyle:'short',timeStyle:'short'});
let current='';function open(app){current=app;$('#modal').classList.add('open');render();if(app!=='device')write('opens',(read('opens',0)+1));}
function close(){$('#modal').classList.remove('open');current='';}
$('#close').onclick=close;$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});$$('[data-app]').forEach(b=>b.addEventListener('click',()=>open(b.dataset.app)));
function list(items,empty,renderItem){return items.length?'<div class="items">'+items.map(renderItem).join('')+'</div>':'<div class="empty">'+empty+'</div>'}
function render(){const titles={chat:'채팅방',ledger:'용돈 기록장',suggestion:'건의함',notice:'서버 공지',status:'서버 상태',stats:'서버 통계',device:'내 접속 정보'};$('#dialogTitle').textContent=titles[current]||'도구';const root=$('#appContent');
if(current==='chat'){let items=read('chat');root.innerHTML='<p class="muted">현재 브라우저에 저장되는 채팅 기록입니다. 서버 계정 간 공유는 아직 연결되지 않았습니다.</p><form class="form" id="chatForm"><input name="name" maxlength="30" placeholder="닉네임" required value="'+esc(read('nickname','사용자'))+'"><input name="message" maxlength="500" placeholder="메시지를 입력하세요" required><button class="btn">보내기</button></form>'+list(items,'아직 메시지가 없습니다.',x=>'<article class="item"><div class="itemhead"><strong>'+esc(x.name)+'</strong><span class="muted">'+date(x.at)+'</span></div><p>'+esc(x.message)+'</p><button class="btn danger" data-del-chat="'+esc(x.id)+'">삭제</button></article>');$('#chatForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),name=String(f.get('name')).trim(),message=String(f.get('message')).trim();if(!name||!message)return;write('nickname',name);items.push({id:crypto.randomUUID(),name,message,at:Date.now()});write('chat',items.slice(-300));render()};$$('[data-del-chat]').forEach(b=>b.onclick=()=>{write('chat',items.filter(x=>x.id!==b.dataset.delChat));render()});}
if(current==='ledger'){let items=read('ledger');const balance=items.reduce((s,x)=>s+(x.type==='in'?x.amount:-x.amount),0);root.innerHTML='<div class="statgrid"><div class="stat">현재 잔액<strong>'+balance.toLocaleString('ko-KR')+'원</strong></div><div class="stat">총 수입<strong>'+items.filter(x=>x.type==='in').reduce((s,x)=>s+x.amount,0).toLocaleString('ko-KR')+'원</strong></div><div class="stat">총 지출<strong>'+items.filter(x=>x.type==='out').reduce((s,x)=>s+x.amount,0).toLocaleString('ko-KR')+'원</strong></div></div><form class="form" id="ledgerForm"><select name="type"><option value="in">수입</option><option value="out">지출</option></select><input name="amount" type="number" min="1" max="100000000" placeholder="금액(원)" required><input name="memo" maxlength="100" placeholder="내용" required><button class="btn">기록 추가</button></form>'+list(items.slice().reverse(),'기록이 없습니다.',x=>'<article class="item"><div class="itemhead"><strong>'+esc(x.memo)+'</strong><strong class="'+(x.type==='in'?'green':'warning')+'">'+(x.type==='in'?'+':'−')+x.amount.toLocaleString()+'원</strong></div><div class="muted">'+date(x.at)+'</div><button class="btn danger" data-del-ledger="'+x.id+'">삭제</button></article>');$('#ledgerForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),amount=Number(f.get('amount')),memo=String(f.get('memo')).trim();if(!Number.isFinite(amount)||amount<=0||!memo)return;items.push({id:crypto.randomUUID(),type:f.get('type'),amount:Math.floor(amount),memo,at:Date.now()});write('ledger',items);render()};$$('[data-del-ledger]').forEach(b=>b.onclick=()=>{write('ledger',items.filter(x=>x.id!==b.dataset.delLedger));render()});}
if(current==='suggestion'){let items=read('suggestion');root.innerHTML='<p class="muted">건의 내용은 이 브라우저에 저장됩니다. 실제 관리자에게 전송되는 기능은 서버 연결 후 제공됩니다.</p><form class="form" id="suggestForm"><input name="title" maxlength="100" placeholder="건의 제목" required><textarea name="body" maxlength="3000" placeholder="건의 내용을 입력하세요" required></textarea><button class="btn">건의 등록</button></form>'+list(items.slice().reverse(),'등록된 건의가 없습니다.',x=>'<article class="item"><div class="itemhead"><strong>'+esc(x.title)+'</strong><span class="pill">'+esc(x.state||'접수')</span></div><p>'+esc(x.body)+'</p><div class="muted">'+date(x.at)+'</div><button class="btn secondary" data-toggle-sug="'+x.id+'">상태 변경</button> <button class="btn danger" data-del-sug="'+x.id+'">삭제</button></article>');$('#suggestForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);items.push({id:crypto.randomUUID(),title:String(f.get('title')).trim(),body:String(f.get('body')).trim(),state:'접수',at:Date.now()});write('suggestion',items);render()};$$('[data-toggle-sug]').forEach(b=>b.onclick=()=>{items=items.map(x=>x.id===b.dataset.toggleSug?{...x,state:x.state==='접수'?'검토 중':x.state==='검토 중'?'완료':'접수'}:x);write('suggestion',items);render()});$$('[data-del-sug]').forEach(b=>b.onclick=()=>{items=items.filter(x=>x.id!==b.dataset.delSug);write('suggestion',items);render()});}
if(current==='notice'){let items=read('notice');root.innerHTML='<p class="muted">공지 관리 미리보기입니다. 브라우저별로 저장되며 모든 방문자에게 배포되지는 않습니다.</p><form class="form" id="noticeForm"><input name="title" maxlength="120" placeholder="공지 제목" required><textarea name="body" maxlength="5000" placeholder="공지 내용" required></textarea><button class="btn">공지 게시</button></form>'+list(items.slice().reverse(),'등록된 공지가 없습니다.',x=>'<article class="item"><div class="itemhead"><strong>'+esc(x.title)+'</strong><span class="muted">'+date(x.at)+'</span></div><p>'+esc(x.body).replace(/\n/g,'<br>')+'</p><button class="btn secondary" data-edit-notice="'+x.id+'">수정</button> <button class="btn danger" data-del-notice="'+x.id+'">삭제</button></article>');$('#noticeForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);items.push({id:crypto.randomUUID(),title:String(f.get('title')).trim(),body:String(f.get('body')).trim(),at:Date.now()});write('notice',items);render()};$$('[data-del-notice]').forEach(b=>b.onclick=()=>{items=items.filter(x=>x.id!==b.dataset.delNotice);write('notice',items);render()});$$('[data-edit-notice]').forEach(b=>b.onclick=()=>{const x=items.find(v=>v.id===b.dataset.editNotice);if(!x)return;const title=prompt('공지 제목',x.title);if(title===null)return;const body=prompt('공지 내용',x.body);if(body===null)return;x.title=title.trim();x.body=body.trim();x.at=Date.now();write('notice',items);render()});}
if(current==='status'){let s=read('status',{state:'정상',message:'모든 기능이 정상 작동 중입니다.',at:Date.now()});root.innerHTML='<div class="item"><span class="pill">현재 상태</span><h2 class="'+(s.state==='정상'?'green':s.state==='점검 중'?'warning':'')+'">'+esc(s.state)+'</h2><p>'+esc(s.message)+'</p><div class="muted">마지막 변경: '+date(s.at)+'</div></div><form class="form" id="statusForm"><select name="state"><option>정상</option><option>점검 중</option><option>장애</option></select><textarea name="message" maxlength="1000" placeholder="상태 설명" required>'+esc(s.message)+'</textarea><button class="btn">상태 저장</button></form><p class="muted">이 상태는 현재 브라우저에만 저장됩니다.</p>';$('#statusForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);write('status',{state:f.get('state'),message:String(f.get('message')).trim(),at:Date.now()});render()};}
if(current==='stats'){const chat=read('chat'),ledger=read('ledger'),suggestions=read('suggestion'),notices=read('notice');root.innerHTML='<p class="muted">이 브라우저에 저장된 데이터의 집계입니다. 전체 서버 방문자 통계는 아닙니다.</p><div class="statgrid"><div class="stat">채팅 메시지<strong>'+chat.length+'</strong></div><div class="stat">수입·지출 기록<strong>'+ledger.length+'</strong></div><div class="stat">건의<strong>'+suggestions.length+'</strong></div><div class="stat">공지<strong>'+notices.length+'</strong></div><div class="stat">도구 열기<strong>'+read('opens',0)+'</strong></div><div class="stat">저장 공간<strong>'+Math.round(new Blob([JSON.stringify({chat,ledger,suggestions,notices})]).size/1024)+' KB</strong></div></div><div class="form"><button class="btn secondary" id="exportData">데이터 JSON 내보내기</button><button class="btn danger" id="clearData">이 브라우저 데이터 초기화</button></div>';$('#exportData').onclick=()=>{const data={chat,ledger,suggestions,notices,status:read('status'),exportedAt:new Date().toISOString()};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='youthdeveloper-server-tools.json';a.click();URL.revokeObjectURL(a.href)};$('#clearData').onclick=()=>{if(confirm('서버 도구의 이 브라우저 데이터만 모두 삭제할까요?')){Object.keys(localStorage).filter(k=>k.startsWith('ydtools:')).forEach(k=>localStorage.removeItem(k));render()}};}
if(current==='device'){const ua=navigator.userAgent;let browser='알 수 없음';if(/Edg\//.test(ua))browser='Microsoft Edge';else if(/Chrome\//.test(ua))browser='Google Chrome';else if(/Firefox\//.test(ua))browser='Mozilla Firefox';else if(/Safari\//.test(ua))browser='Safari';let os='알 수 없음';if(/Windows NT 10/.test(ua))os='Windows 10/11';else if(/Windows NT 6\.1/.test(ua))os='Windows 7';else if(/Android/.test(ua))os='Android';else if(/iPhone|iPad/.test(ua))os='iOS/iPadOS';else if(/Mac OS X/.test(ua))os='macOS';else if(/Linux/.test(ua))os='Linux';const rows=[['브라우저',browser],['운영체제',os],['화면 크기',screen.width+' × '+screen.height],['창 크기',innerWidth+' × '+innerHeight],['픽셀 비율',devicePixelRatio+'x'],['언어',navigator.language],['시간대',Intl.DateTimeFormat().resolvedOptions().timeZone],['네트워크',navigator.onLine?'온라인':'오프라인'],['쿠키',navigator.cookieEnabled?'활성화':'비활성화'],['메모리 정보',navigator.deviceMemory?navigator.deviceMemory+' GB':'브라우저 미지원']];root.innerHTML='<p class="muted">이 정보는 현재 기기에서 브라우저가 제공한 값이며 서버로 전송되지 않습니다.</p>'+list(rows,'',x=>'<div class="item itemhead"><span>'+esc(x[0])+'</span><strong>'+esc(x[1])+'</strong></div>')+'<div class="form"><button class="btn secondary" id="copyDevice">정보 복사</button></div>';$('#copyDevice').onclick=()=>navigator.clipboard?.writeText(rows.map(x=>x[0]+': '+x[1]).join('\n')).then(()=>alert('접속 정보가 복사되었습니다.')).catch(()=>alert('브라우저에서 복사를 허용하지 않았습니다.'));}
}
})();
</script></body></html>
