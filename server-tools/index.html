<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07090b">
<title>서버 도구 | YouthDeveloper</title>
<style>
:root{color-scheme:dark;--bg:#07090b;--panel:#0b0e11;--line:#20262b;--muted:#77818d;--text:#e8edf2;--green:#45f6a0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif;min-height:100vh}
main{max-width:1780px;margin:auto;padding:42px 28px 64px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}h1{font-size:clamp(28px,3vw,48px);letter-spacing:-1.5px;margin:0;font-weight:800}.private{border:1px solid #174b35;color:var(--green);border-radius:999px;padding:10px 16px;font:12px ui-monospace,monospace;letter-spacing:2px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.tool{position:relative;display:flex;align-items:center;gap:24px;min-height:126px;padding:24px 27px;background:linear-gradient(135deg,#0d1115,#080a0c);border:1px solid var(--line);border-radius:22px;color:inherit;text-decoration:none;transition:border-color .18s,transform .18s,background .18s}.tool.active{cursor:pointer}.tool.active:hover{border-color:#246b4b;transform:translateY(-2px);background:#0d1312}.icon{display:grid;place-items:center;flex:0 0 66px;height:66px;border-radius:18px;background:#101b18;border:1px solid #183e2e;font-size:27px}.copy{min-width:0;flex:1}.name{font-size:23px;font-weight:700;letter-spacing:-.5px;margin-bottom:7px}.desc{color:var(--muted);font-size:16px;line-height:1.45}.status{flex-shrink:0;border:1px solid #20262b;border-radius:999px;padding:5px 13px;color:#7e8994;font-size:13px}.arrow{font-size:30px;color:var(--green);font-weight:400;line-height:1}.tool:not(.active){opacity:.82}.foot{color:#59636e;font-size:13px;margin-top:24px}.notice{display:none;margin:0 0 20px;padding:13px 16px;border:1px solid #3e3420;background:#17130b;color:#d7c18e;border-radius:12px;font-size:14px}.notice.show{display:block}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tool{gap:16px;padding:20px}.icon{flex-basis:58px;height:58px}.name{font-size:20px}}
@media(max-width:650px){main{padding:25px 16px 42px}.grid{grid-template-columns:1fr;gap:12px}.tool{min-height:106px;padding:17px;border-radius:17px}.top{margin-bottom:22px}.status{font-size:11px;padding:5px 9px}.desc{font-size:14px}.name{font-size:19px}}
</style>
</head>
<body>
<main>
  <header class="top"><h1>서버 도구</h1><span class="private">PRIVATE</span></header>
  <div class="notice" id="notice" role="status"></div>
  <section class="grid" aria-label="서버 도구 목록">
    <a class="tool" href="#" data-ready="chat"><span class="icon" aria-hidden="true">💬</span><span class="copy"><div class="name">채팅방</div><div class="desc">서버 계정끼리 실시간 채팅</div></span><span class="status">준비 중</span></a>
    <a class="tool" href="#" data-ready="ledger"><span class="icon" aria-hidden="true">💰</span><span class="copy"><div class="name">용돈 기록장</div><div class="desc">수입 · 지출 기록</div></span><span class="status">준비 중</span></a>
    <a class="tool" href="#" data-ready="suggestion"><span class="icon" aria-hidden="true">📨</span><span class="copy"><div class="name">건의함</div><div class="desc">관리자에게 의견 보내기</div></span><span class="status">준비 중</span></a>
    <a class="tool" href="#" data-ready="notice"><span class="icon" aria-hidden="true">📰</span><span class="copy"><div class="name">서버 공지</div><div class="desc">관리자 공지 등록</div></span><span class="status">준비 중</span></a>
    <a class="tool" href="#" data-ready="status"><span class="icon" aria-hidden="true">🟢</span><span class="copy"><div class="name">서버 상태</div><div class="desc">정상 · 점검 · 장애 표시</div></span><span class="status">준비 중</span></a>
    <a class="tool" href="#" data-ready="stats"><span class="icon" aria-hidden="true">📈</span><span class="copy"><div class="name">서버 통계</div><div class="desc">접속자 · 사용량 확인</div></span><span class="status">준비 중</span></a>
    <a class="tool" href="#" data-ready="device"><span class="icon" aria-hidden="true">🕵️</span><span class="copy"><div class="name">내 접속 정보</div><div class="desc">브라우저 · OS · 화면 정보</div></span><span class="status">준비 중</span></a>
    <a class="tool active" href="../anonymous/" aria-label="익명 한마디 열기"><span class="icon" aria-hidden="true">📝</span><span class="copy"><div class="name">익명 한마디</div><div class="desc">이름 없이 메시지 남기기</div></span><span class="arrow" aria-hidden="true">›</span></a>
  </section>
  <p class="foot">YouthDeveloper · Server Tools</p>
</main>
<script>
document.querySelectorAll('[data-ready]').forEach(function(card){card.addEventListener('click',function(event){event.preventDefault();var notice=document.getElementById('notice');notice.textContent='이 기능은 아직 준비 중입니다. 공개 전에 서버 인증과 데이터 저장 기능을 연결해야 합니다.';notice.classList.add('show');});});
</script>
</body>
</html>
