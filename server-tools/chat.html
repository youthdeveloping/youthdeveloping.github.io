<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f6f8"><meta name="description" content="YouthDeveloper 개인 채팅">
<title>채팅 | YouthDeveloper</title>
<style>
:root{color-scheme:light;--bg:#f5f6f8;--panel:#fff;--line:#e7e9ee;--text:#191b20;--muted:#777d88;--blue:#fee500;--blueText:#191919;--accent:#4c67e8}
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}.app{max-width:1280px;margin:auto;padding:22px;min-height:100dvh}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{font-weight:850;font-size:21px;letter-spacing:-.7px;text-decoration:none;color:inherit}.brand span{color:var(--accent)}.top-right{display:flex;align-items:center;gap:10px}.subtle{color:var(--muted);font-size:13px}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:700;background:var(--blue);color:var(--blueText)}.btn.alt{background:#f0f1f5;color:#343740}.btn.small{padding:8px 10px;font-size:12px}.layout{display:grid;grid-template-columns:330px minmax(0,1fr);height:min(780px,calc(100dvh - 100px));min-height:560px;background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 12px 40px #202b4210}.left{display:flex;flex-direction:column;border-right:1px solid var(--line);min-width:0}.left-head{padding:20px;border-bottom:1px solid var(--line)}.left-head h1{margin:0 0 16px;font-size:22px}.search{display:flex;gap:7px}.search input,.composer input,.auth input{width:100%;border:1px solid var(--line);background:#f8f9fb;border-radius:11px;padding:12px;outline:none;min-width:0}.search input:focus,.composer input:focus,.auth input:focus{border-color:#9aa7ff;box-shadow:0 0 0 3px #4c67e817}.section-label{font-size:11px;letter-spacing:.09em;font-weight:800;color:var(--muted);padding:16px 18px 8px}.people{overflow:auto;flex:1}.person{display:flex;align-items:center;gap:12px;padding:13px 17px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid #f0f1f4;color:inherit}.person:hover,.person.active{background:#f4f6ff}.avatar{width:43px;height:43px;border-radius:16px;display:grid;place-items:center;background:#e9edff;color:#4558bd;font-weight:800;flex:none}.person-copy{min-width:0;flex:1}.person-name{font-weight:750;font-size:14px;margin-bottom:5px}.person-last{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{padding:24px 18px;color:var(--muted);font-size:13px;line-height:1.6}.right{display:flex;flex-direction:column;min-width:0;background:#fafbfc}.welcome{margin:auto;text-align:center;max-width:340px;padding:30px}.welcome-mark{font-size:44px;margin-bottom:16px}.welcome h2{margin:0 0 8px;font-size:23px}.welcome p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}.chat-head{padding:17px 22px;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--line)}.chat-head .person-name{font-size:16px}.messages{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:13px}.dayline{text-align:center;font-size:11px;color:var(--muted);padding:8px}.bubble-row{display:flex;gap:8px;align-items:flex-end;max-width:82%}.bubble-row.mine{align-self:flex-end;flex-direction:row-reverse}.bubble{padding:11px 14px;border-radius:5px 17px 17px 17px;background:#fff;border:1px solid var(--line);font-size:14px;line-height:1.55;overflow-wrap:anywhere;white-space:pre-wrap}.mine .bubble{background:var(--blue);border-color:var(--blue);border-radius:17px 5px 17px 17px}.bubble-meta{font-size:10px;color:var(--muted);max-width:80px}.composer{display:flex;gap:9px;padding:16px 20px;background:#fff;border-top:1px solid var(--line)}.composer input{background:#f6f7f9}.notice{margin:0 0 12px;padding:11px 13px;border-radius:10px;background:#eef2ff;color:#3648a2;font-size:13px}.notice.error{background:#fff0f0;color:#b3261e}.auth-wrap{position:fixed;inset:0;background:linear-gradient(135deg,#f4f6fb,#e9edff);display:grid;place-items:center;padding:20px;z-index:10}.auth{width:min(420px,100%);background:#fff;padding:30px;border:1px solid var(--line);border-radius:24px;box-shadow:0 22px 70px #202b421c}.auth-brand{font-size:12px;color:var(--accent);font-weight:850;letter-spacing:.12em}.auth h1{font-size:27px;letter-spacing:-1px;margin:12px 0 7px}.auth p{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 20px}.auth label{display:block;font-size:12px;font-weight:750;margin:13px 0 7px}.auth .btn{width:100%;margin-top:17px}.switch{border:0;background:none;color:var(--accent);font-weight:750;padding:12px 0 0}.hidden{display:none!important}.mobile-back{display:none}
@media(max-width:760px){.app{padding:10px}.top{margin-bottom:10px}.top .subtle{display:none}.layout{height:calc(100dvh - 66px);min-height:0;grid-template-columns:1fr;border-radius:16px}.left{border-right:0}.right{display:none}.layout.chat-open .left{display:none}.layout.chat-open .right{display:flex}.mobile-back{display:inline-flex}.chat-head{padding:12px}.messages{padding:15px}.composer{padding:10px}.bubble-row{max-width:92%}}
</style>
</head>
<body>
<div class="app">
<header class="top"><a class="brand" href="/">Youth<span>Developer</span> · 채팅</a><div class="top-right"><a class="subtle" href="./chat-admin.html">관리자</a><span id="myName" class="subtle"></span><button class="btn alt small" id="logout">로그아웃</button></div></header>
<div id="alert" aria-live="polite"></div>
<div class="layout" id="layout">
<aside class="left"><div class="left-head"><h1>채팅</h1><form class="search" id="searchForm"><input id="searchQuery" placeholder="닉네임 검색" maxlength="20" autocomplete="off" required><button class="btn">검색</button></form></div><div class="section-label" id="listLabel">최근 대화</div><div class="people" id="people"><div class="empty">로그인 후 대화를 시작하세요.</div></div></aside>
<main class="right"><div class="welcome" id="welcome"><div class="welcome-mark">💬</div><h2>대화를 시작해 보세요</h2><p>닉네임을 검색해 친구를 찾고 메시지를 보내실 수 있습니다.</p></div><div id="chatArea" class="hidden" style="display:flex;flex-direction:column;min-height:0;flex:1"><header class="chat-head"><button class="btn alt small mobile-back" id="back">‹</button><div class="avatar" id="chatAvatar">?</div><div><div class="person-name" id="chatName"></div><div class="subtle">1:1 개인 채팅</div></div></header><div class="messages" id="messages"></div><form class="composer" id="sendForm"><input id="messageInput" maxlength="2000" placeholder="메시지를 입력하세요" autocomplete="off" required><button class="btn">전송</button></form></div></main>
</div>
</div>
<div class="auth-wrap" id="authWrap"><form class="auth" id="authForm"><div class="auth-brand">YOUTHDEVELOPER CHAT</div><h1 id="authTitle">다시 만나서 반가워요</h1><p id="authDesc">닉네임으로 로그인하고 대화를 이어가세요.</p><div id="authError" class="notice error hidden"></div><label for="authNickname">닉네임</label><input id="authNickname" maxlength="20" minlength="2" placeholder="2~20자 닉네임" autocomplete="username" required><label for="authPassword">비밀번호</label><input id="authPassword" type="password" minlength="8" maxlength="128" placeholder="8자 이상" autocomplete="current-password" required><button class="btn" id="authSubmit">로그인</button><button class="switch" type="button" id="authSwitch">계정이 없으신가요? 회원가입</button><div class="subtle" style="margin-top:12px">비밀번호는 서버에서 해시 처리됩니다. 다른 사람과 공유하지 마세요.</div></form></div>
<script>
(()=>{'use strict';
const API='https://web.youthdeveloper-github.workers.dev/api/chat';
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token=localStorage.getItem('yd_chat_token')||'',me=null,current=null,mode='login',searchMode=false,lastMessageId='';
const authHeaders=()=>({'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})});
async function api(path,method='GET',body){let res;try{res=await fetch(API+path,{method,headers:authHeaders(),body:body===undefined?undefined:JSON.stringify(body)});}catch{throw Error('서버에 연결할 수 없습니다. 네트워크를 확인해 주세요.')}const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||'요청에 실패했습니다.');return data;}
function alertMsg(msg,error=false){$('#alert').innerHTML=msg?'<div class="notice '+(error?'error':'')+'">'+esc(msg)+'</div>':'';}
function showAuth(){ $('#authWrap').classList.remove('hidden');$('#authError').classList.add('hidden');}
function showApp(){ $('#authWrap').classList.add('hidden');$('#myName').textContent=me.nickname; }
function setMode(next){mode=next;$('#authTitle').textContent=mode==='login'?'다시 만나서 반가워요':'새 계정 만들기';$('#authDesc').textContent=mode==='login'?'닉네임으로 로그인하고 대화를 이어가세요.':'닉네임과 비밀번호를 정해 가입하세요. 닉네임은 다른 회원과 중복될 수 없습니다.';$('#authSubmit').textContent=mode==='login'?'로그인':'회원가입';$('#authSwitch').textContent=mode==='login'?'계정이 없으신가요? 회원가입':'이미 계정이 있으신가요? 로그인';$('#authPassword').autocomplete=mode==='login'?'current-password':'new-password';$('#authError').classList.add('hidden');}
$('#authSwitch').onclick=()=>setMode(mode==='login'?'register':'login');
$('#authForm').onsubmit=async e=>{e.preventDefault();const btn=$('#authSubmit');btn.disabled=true;$('#authError').classList.add('hidden');try{const data=await api('/'+mode,'POST',{nickname:$('#authNickname').value.trim(),password:$('#authPassword').value});token=data.token;me=data.user;localStorage.setItem('yd_chat_token',token);$('#authPassword').value='';showApp();await loadConversations();}catch(err){$('#authError').textContent=err.message;$('#authError').classList.remove('hidden');}finally{btn.disabled=false;}};
$('#logout').onclick=()=>{token='';me=null;current=null;localStorage.removeItem('yd_chat_token');$('#layout').classList.remove('chat-open');$('#chatArea').classList.add('hidden');$('#welcome').classList.remove('hidden');showAuth();};
function personRow(p,last='',active=false){return '<button class="person '+(active?'active':'')+'" data-user="'+esc(p.userId||p.id)+'"><span class="avatar">'+esc((p.nickname||'?').slice(0,1).toUpperCase())+'</span><span class="person-copy"><div class="person-name">'+esc(p.nickname)+'</div><div class="person-last">'+esc(last||'대화를 시작해 보세요')+'</div></span></button>';}
async function loadConversations(){const r=await api('/conversations');$('#listLabel').textContent='최근 대화';searchMode=false;const list=r.conversations||[];$('#people').innerHTML=list.length?list.map(c=>personRow(c,c.lastMessage,c.userId===current?.id)).join(''):'<div class="empty">아직 대화가 없습니다.<br>위에서 닉네임을 검색해 보세요.</div>';bindPeople();}
function bindPeople(){$('#people').querySelectorAll('[data-user]').forEach(b=>b.onclick=()=>openChat(b.dataset.user,b.querySelector('.person-name').textContent));}
$('#searchForm').onsubmit=async e=>{e.preventDefault();const q=$('#searchQuery').value.trim();if(!q)return;try{const r=await api('/users?q='+encodeURIComponent(q));searchMode=true;$('#listLabel').textContent='검색 결과';$('#people').innerHTML=(r.users||[]).length?r.users.map(p=>personRow(p,'닉네임 검색 결과',false)).join(''):'<div class="empty">일치하는 회원이 없습니다. 닉네임을 확인해 주세요.</div>';bindPeople();}catch(err){alertMsg(err.message,true);}};
async function openChat(id,nickname){current={id,nickname};$('#layout').classList.add('chat-open');$('#welcome').classList.add('hidden');$('#chatArea').classList.remove('hidden');$('#chatName').textContent=nickname;$('#chatAvatar').textContent=(nickname||'?').slice(0,1).toUpperCase();try{await loadMessages(true);if(!searchMode)await loadConversations();else{$('#people').querySelectorAll('[data-user]').forEach(b=>b.classList.toggle('active',b.dataset.user===id));}}catch(err){alertMsg(err.message,true);}}
async function loadMessages(scroll=false){if(!current)return;const r=await api('/messages?with='+encodeURIComponent(current.id));const msgs=r.messages||[];const latest=msgs.length?msgs[msgs.length-1].id:'';const changed=latest!==lastMessageId;lastMessageId=latest;$('#messages').innerHTML=msgs.length?msgs.map(m=>'<div class="bubble-row '+(m.senderId===me.id?'mine':'')+'"><div class="bubble">'+esc(m.message)+'</div><span class="bubble-meta">'+esc(new Date(m.createdAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}))+'</span></div>').join(''):'<div class="empty" style="text-align:center">아직 메시지가 없습니다.<br>첫 인사를 보내보세요.</div>';if(scroll||changed)$('#messages').scrollTop=$('#messages').scrollHeight;}
$('#sendForm').onsubmit=async e=>{e.preventDefault();if(!current)return;const input=$('#messageInput'),message=input.value.trim();if(!message)return;const btn=e.submitter;btn.disabled=true;try{await api('/messages','POST',{with:current.id,message});input.value='';await loadMessages(true);if(!searchMode)await loadConversations();}catch(err){alertMsg(err.message,true);}finally{btn.disabled=false;input.focus();}};
$('#back').onclick=()=>$('#layout').classList.remove('chat-open');
async function start(){if(!token){showAuth();return;}try{const r=await api('/me');me=r.user;showApp();await loadConversations();}catch{token='';localStorage.removeItem('yd_chat_token');showAuth();}}
start();setInterval(async()=>{if(token&&me&&current){try{await loadMessages(false);if(!searchMode)await loadConversations();}catch(e){if(/로그인|인증/.test(e.message))$('#logout').click();}}},4000);
})();
</script>
</body></html>
