<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>미스터리 문제 관리 | YouthDeveloper</title>
<style>
:root{color-scheme:dark;--bg:#070a0f;--panel:#111720;--line:#293443;--text:#eef3fa;--muted:#9ba8b8;--accent:#72e6c1;--red:#ff7d91}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,"Noto Sans KR",sans-serif}main{width:min(850px,calc(100% - 28px));margin:36px auto}h1{margin:0 0 8px}p{color:var(--muted);line-height:1.65}.panel,.item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}.field{display:block;margin:12px 0}.field span{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:#080c12;color:var(--text);font:inherit}.field textarea{min-height:90px;resize:vertical}.btn{border:1px solid #3d7568;border-radius:8px;padding:10px 13px;background:#15352f;color:var(--accent);cursor:pointer;font:inherit}.btn.secondary{border-color:var(--line);background:transparent;color:var(--muted)}.btn.danger{border-color:#78404b;background:#321820;color:var(--red)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row .grow{flex:1}.status{font-size:13px;color:var(--muted);white-space:pre-wrap}.status.err{color:var(--red)}.status.ok{color:var(--accent)}[hidden]{display:none!important}.item{display:flex;gap:12px;align-items:flex-start}.item .num{color:var(--accent);font-weight:800}.item .q{flex:1;white-space:pre-wrap;line-height:1.6}.item button{margin:2px}@media(max-width:550px){.item{flex-wrap:wrap}.item .q{flex-basis:75%}}
</style></head><body><main>
<div id="login" class="panel"><h1>관리자 로그인</h1><p>미스터리 추리 미션 문제 은행을 관리합니다.</p><form id="loginForm"><label class="field"><span>관리자 비밀번호</span><input id="password" type="password" autocomplete="current-password" required></label><button class="btn" type="submit">입장</button><span id="loginStatus" class="status"></span></form></div>
<div id="app" hidden><div class="row"><div class="grow"><h1>미스터리 문제 관리</h1><p>참가자 화면에는 아래 문제 중 하나가 무작위로 표시됩니다. 추가·수정·삭제 후 GitHub에 저장하세요.</p></div><a class="btn secondary" href="/admin/">관리자 홈</a></div>
<section class="panel"><h2>GitHub 저장소 연결</h2><label class="field"><span>GitHub 토큰 (저장소 Contents 읽기/쓰기 권한)</span><input id="token" type="password" autocomplete="off" placeholder="github_pat_…"></label><p>저장소: youthdeveloping/youthdeveloping.github.io · 파일: data/mystery_questions.json</p><div class="row"><button class="btn secondary" id="reload">GitHub에서 다시 불러오기</button><button class="btn" id="save">GitHub에 저장</button><span id="status" class="status"></span></div></section>
<section class="panel"><h2 id="formTitle">문제 추가</h2><form id="questionForm"><label class="field"><span>문제 내용</span><textarea id="question" maxlength="1000" required placeholder="참가자가 풀어야 할 질문을 입력하세요."></textarea></label><div class="row"><button class="btn" type="submit">목록에 추가</button><button class="btn secondary" id="cancelEdit" type="button" hidden>수정 취소</button></div></form></section>
<section><div class="row"><h2 class="grow">등록된 문제 <span id="count">0</span>개</h2></div><div id="list"></div></section></div></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),PATH='data/mystery_questions.json',REPO='youthdeveloping/youthdeveloping.github.io',PASS_HASH='0a43382445adf542c3df8cc1da6b90229c770f5087591d6348aa2d118cf89a1e';
let questions=[],editing=null,fileSha=null;
async function hash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function status(t,k=''){ $('status').textContent=t;$('status').className='status '+k}
function headers(){const t=$('token').value.trim();if(!t)throw Error('GitHub 토큰을 입력해 주세요.');return {'Accept':'application/vnd.github+json','Authorization':'Bearer '+t,'X-GitHub-Api-Version':'2022-11-28'}}
function decode(s){const b=atob(s.replace(/\s/g,''));return new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0)))}
function encode(s){const b=new TextEncoder().encode(s);let x='';for(let i=0;i<b.length;i+=0x8000)x+=String.fromCharCode(...b.subarray(i,i+0x8000));return btoa(x)}
async function load(){status('GitHub에서 불러오는 중…');try{const r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+PATH+'?ref=main',{headers:headers(),cache:'no-store'});if(!r.ok)throw Error('불러오기 실패 ('+r.status+'). 토큰 권한을 확인하세요.');const f=await r.json();fileSha=f.sha;const d=JSON.parse(decode(f.content));questions=Array.isArray(d.questions)?d.questions:[];render();status('문제 '+questions.length+'개를 불러왔습니다.','ok')}catch(e){status(e.message,'err')}}
async function save(){if(!questions.length&&!confirm('문제가 0개입니다. 빈 목록으로 저장할까요?'))return;try{status('GitHub에 저장 중…');const r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+PATH,{method:'PUT',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({message:'Manage mystery hunt questions',content:encode(JSON.stringify({questions},null,2)+'\n'),branch:'main',...(fileSha?{sha:fileSha}:{})})});const d=await r.json();if(!r.ok)throw Error('저장 실패 ('+r.status+'): '+(d.message||''));fileSha=d.content.sha;status('저장 완료. 사이트 반영까지 잠시 기다려 주세요.','ok')}catch(e){status(e.message,'err')}}
function render(){const box=$('list');box.textContent='';$('count').textContent=questions.length;questions.forEach((q,i)=>{const item=document.createElement('article');item.className='item';const n=document.createElement('span');n.className='num';n.textContent=String(i+1).padStart(2,'0');const t=document.createElement('div');t.className='q';t.textContent=q.question;const actions=document.createElement('div');actions.className='row';const edit=document.createElement('button');edit.className='btn secondary';edit.textContent='수정';edit.onclick=()=>{$('question').value=q.question;editing=i;$('formTitle').textContent='문제 수정';$('questionForm button[type=submit]').textContent='수정 적용';$('cancelEdit').hidden=false;$('question').focus()};const del=document.createElement('button');del.className='btn danger';del.textContent='삭제';del.onclick=()=>{if(confirm('이 문제를 목록에서 삭제할까요?')){questions.splice(i,1);render()}};actions.append(edit,del);item.append(n,t,actions);box.append(item)})}
$('loginForm').onsubmit=async e=>{e.preventDefault();if(await hash($('password').value)===PASS_HASH){$('login').hidden=true;$('app').hidden=false;load()}else{$('loginStatus').textContent='비밀번호가 올바르지 않습니다.';$('loginStatus').className='status err'}};
$('questionForm').onsubmit=e=>{e.preventDefault();const question=$('question').value.trim();if(!question)return;const q={id:editing===null?'q-'+Date.now().toString(36):questions[editing].id,question};if(editing===null)questions.push(q);else questions[editing]=q;editing=null;$('question').value='';$('formTitle').textContent='문제 추가';$('questionForm button[type=submit]').textContent='목록에 추가';$('cancelEdit').hidden=true;render();status('화면 초안이 변경되었습니다. GitHub에 저장해야 참가자에게 반영됩니다.')};
$('cancelEdit').onclick=()=>{editing=null;$('question').value='';$('formTitle').textContent='문제 추가';$('questionForm button[type=submit]').textContent='목록에 추가';$('cancelEdit').hidden=true};
$('reload').onclick=load;$('save').onclick=save;
})();
</script></body></html>
