<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>익명 한마디 관리 | YouthDeveloper</title><style>body{margin:0;background:#070a0e;color:#edf2f7;font:15px system-ui,sans-serif}.wrap{width:min(850px,calc(100% - 28px));margin:40px auto}h1{font-size:25px}p{color:#8793a0;line-height:1.6}input{width:100%;box-sizing:border-box;background:#0c1118;border:1px solid #24303a;border-radius:10px;padding:12px;color:white;margin:8px 0}button{background:#173a29;color:#caffdc;border:1px solid #2e694b;padding:10px 14px;border-radius:9px;cursor:pointer}.card{border:1px solid #24303a;background:#0c1118;padding:16px;border-radius:12px;margin:12px 0}.danger{border-color:#6e3039;background:#35161b;color:#ffd7dc}.meta{font-size:12px;color:#8793a0;margin:8px 0}.hidden{display:none}</style></head><body><main class="wrap"><a href="/services/anonymous.html" style="color:#62e8ff">← 익명 한마디</a><h1>익명 한마디 관리</h1><p>관리자 인증 후 미처리 신고를 확인하고 해당 메시지를 삭제할 수 있습니다. 관리자 토큰은 이 브라우저 세션에만 보관됩니다.</p><label>관리자 토큰</label><input id="token" type="password" autocomplete="current-password" placeholder="Cloudflare ADMIN_TOKEN"><button id="load">신고 목록 불러오기</button><div id="result"></div></main><script>
const API="https://youthdeveloper-anonymous.youthdeveloper-github.workers.dev/api/anonymous";
const result=document.querySelector("#result"),token=document.querySelector("#token");
document.querySelector("#load").textContent="메시지 및 신고 불러오기";
document.querySelector("#load").onclick=load;
async function api(path,opts={}){const r=await fetch(API+path,{...opts,headers:{...(opts.headers||{}),Authorization:"Bearer "+token.value}});let d;try{d=await r.json()}catch{throw Error("서버 응답을 읽지 못했습니다.")}if(!r.ok)throw Error(d.error||"요청 실패 ("+r.status+")");return d}
async function load(){
 result.textContent="메시지와 신고 목록을 불러오는 중…";
 try{
  const [m,r]=await Promise.all([api("/admin/messages"),api("/admin/reports")]);
  const messages=m.messages||[],reports=r.reports||[];
  result.innerHTML='<h2>전체 공개 메시지 ('+messages.length+')</h2>'+
   (messages.length?messages.map(x=>'<article class="card"><b>메시지 #'+x.id+'</b><p>'+esc(x.body)+'</p><div class="meta">'+esc(x.created_at||"")+'</div><button class="danger" data-delete="'+x.id+'">메시지 삭제</button></article>').join(""):'<p>공개된 메시지가 없습니다.</p>')+
   '<h2 style="margin-top:30px">미처리 신고 ('+reports.length+')</h2>'+
   (reports.length?reports.map(x=>'<article class="card"><b>신고 · 메시지 #'+x.message_id+'</b><p>'+esc(x.body||"(메시지 없음)")+'</p><div class="meta">사유: '+esc(x.reason)+' · '+esc(x.created_at||"")+'</div><button class="danger" data-delete="'+x.message_id+'">메시지 삭제 및 신고 처리</button></article>').join(""):'<p>미처리 신고가 없습니다.</p>');
 }catch(e){result.textContent=e.message||"오류가 발생했습니다."}
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
result.addEventListener("click",async e=>{const b=e.target.closest("[data-delete]");if(!b||!confirm("이 메시지를 삭제하시겠습니까?"))return;try{await api("/admin/messages/"+b.dataset.delete,{method:"DELETE"});await load()}catch(e){alert(e.message||"삭제 실패")}});
</script></body></html>
