<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>놀구로 퀴즈 관리 | YouthDeveloper</title>
<style>
:root{color-scheme:dark;--bg:#070b0e;--panel:#10171b;--line:#29363b;--text:#edf5f1;--muted:#9aa9a5;--green:#74e0ae;--red:#ff8290}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#16352b 0,transparent 35rem),var(--bg);color:var(--text);font:14px/1.6 Inter,Pretendard,"Noto Sans KR",sans-serif}.wrap{width:min(1000px,calc(100% - 30px));margin:auto}header{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}a{color:var(--green);text-decoration:none}.head{padding:32px 0 18px}h1{margin:0;font-size:clamp(25px,5vw,36px)}h2{margin:0 0 14px}.muted,.hint{color:var(--muted)}.panel{background:rgba(16,23,27,.94);border:1px solid var(--line);border-radius:15px;padding:20px;margin:14px 0}.tabs,.actions,.item-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #426c59;background:#173328;color:#b9f5d6;border-radius:8px;padding:10px 14px;cursor:pointer;font:inherit}.btn.alt{background:transparent;border-color:var(--line);color:var(--muted)}.btn.del{background:#32191e;border-color:#74404a;color:#ffabb4}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;color:var(--muted)}input,textarea,select{width:100%;border:1px solid var(--line);background:#080e11;color:var(--text);border-radius:8px;padding:11px;font:inherit}textarea{min-height:86px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.status{min-height:22px;color:var(--green);font-size:12px}.list{display:grid;gap:9px;margin-top:16px}.item{border:1px solid var(--line);background:#0b1114;border-radius:10px;padding:14px}.item strong{display:block;font-size:15px}.item p{white-space:pre-wrap;margin:6px 0;color:#c5d1cc}.item small{color:var(--muted)}.item-actions{margin-top:10px}.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 8px;font-size:11px;color:var(--green)}[hidden]{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}.panel{padding:15px}}
</style></head><body><div class="wrap"><header><a href="/admin/">YOUTHDEVELOPER / ADMIN</a><a href="/nolguro/events/board_game.html">보드게임 페이지 보기 ↗</a></header>
<section class="head"><h1>놀구로 퀴즈 관리</h1><p class="muted">직접 만든 문제를 등록·수정·삭제하면 보드게임 라운지 페이지에 공개됩니다.</p></section>
<div id="gate" class="panel" hidden>관리자 로그인이 필요합니다. <a href="/admin/">관리자 페이지에서 먼저 로그인해 주세요.</a></div>
<div id="manager" hidden>
<div class="tabs"><button class="btn" data-tab="mini">미니게임-퀴즈 더 만들기</button><button class="btn alt" data-tab="five">5초준다-퀴즈 더 만들기</button></div>
<section class="panel"><div class="pill" id="modeLabel">MINI GAME QUIZ</div><h2 id="formTitle" style="margin-top:10px">미니게임 퀴즈 추가</h2>
<form id="quizForm"><input id="editId" type="hidden"><label class="field"><label for="question">문제</label><textarea id="question" maxlength="500" required placeholder="예: 대한민국의 수도는 어디일까요?"></textarea></label>
<div class="grid"><label class="field"><label for="answer">정답 / 예시 답안</label><input id="answer" maxlength="300" required placeholder="예: 서울"></label><label class="field"><label for="difficulty">난이도</label><select id="difficulty"><option>쉬움</option><option selected>보통</option><option>어려움</option></select></label></div>
<label class="field"><label for="explanation">해설 / 진행 메모 (선택)</label><textarea id="explanation" maxlength="800" placeholder="정답 설명 또는 진행자가 참고할 내용"></textarea></label>
<div class="actions"><button class="btn" id="saveBtn">문제 저장</button><button class="btn alt" type="button" id="clearBtn">입력 초기화</button><span class="status" id="status" role="status"></span></div></form></section>
<section class="panel"><h2 id="listTitle">등록된 미니게임 퀴즈</h2><p class="muted">아래에 등록한 문제들이 공개 페이지에 표시됩니다. 수정 또는 삭제할 수 있습니다.</p><div class="list" id="items"></div></section>
</div></div>
<script>
(()=>{'use strict';
const API='https://web.youthdeveloper-github.workers.dev',KEY='yd_admin_session';
const FILES={mini:'data/nolguro-mini-quiz.json',five:'data/nolguro-five-seconds.json'};
const $=id=>document.getElementById(id);let mode='mini',items={mini:[],five:[]};
const token=()=>sessionStorage.getItem(KEY)||'';
async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{Authorization:'Bearer '+token(),...(opt.body?{'Content-Type':'application/json'}:{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'요청 실패 ('+r.status+')');return d;}
async function load(which){const path=FILES[which];const d=await api('/api/admin/github?path='+encodeURIComponent(path)+'&branch=main');const parsed=JSON.parse(d.content);items[which]=Array.isArray(parsed.items)?parsed.items:[];}
async function save(){const path=FILES[mode];$('saveBtn').disabled=true;status('GitHub에 저장 중...');try{const data={updated:new Date().toISOString(),items:items[mode]};await api('/api/admin/github',{method:'PUT',body:JSON.stringify({repo:'youthdeveloping/youthdeveloping.github.io',branch:'main',path,message:mode==='mini'?'Update NolGo mini-game quiz':'Update NolGo five-second quiz',content:JSON.stringify(data,null,2)+'\n'})});status('저장 완료 · 공개 페이지 반영까지 잠시 걸릴 수 있습니다.');render();}catch(e){status(e.message);}finally{$('saveBtn').disabled=false;}}
function status(s){$('status').textContent=s;}
function clear(){ $('quizForm').reset();$('editId').value='';$('difficulty').value='보통';$('formTitle').textContent=mode==='mini'?'미니게임 퀴즈 추가':'5초준다 문제 추가';$('saveBtn').textContent='문제 저장';}
function render(){const box=$('items');box.replaceChildren();$('modeLabel').textContent=mode==='mini'?'MINI GAME QUIZ':'5-SECOND QUIZ';$('formTitle').textContent=mode==='mini'?'미니게임 퀴즈 추가':'5초준다 문제 추가';$('listTitle').textContent=mode==='mini'?'등록된 미니게임 퀴즈':'등록된 5초준다 문제';if(!items[mode].length){const p=document.createElement('p');p.className='muted';p.textContent='아직 등록된 문제가 없습니다. 위에서 첫 문제를 추가해 주세요.';box.append(p);return;}items[mode].forEach(q=>{const card=document.createElement('article');card.className='item';const title=document.createElement('strong');title.textContent=q.question;const answer=document.createElement('p');answer.textContent='정답 / 예시: '+q.answer;const meta=document.createElement('small');meta.textContent=(q.difficulty||'보통')+(q.explanation?' · 해설 있음':'');card.append(title,answer,meta);if(q.explanation){const ex=document.createElement('p');ex.textContent=q.explanation;card.append(ex);}const actions=document.createElement('div');actions.className='item-actions';const edit=document.createElement('button');edit.className='btn alt';edit.type='button';edit.textContent='수정';edit.onclick=()=>{$('editId').value=q.id;$('question').value=q.question;$('answer').value=q.answer;$('difficulty').value=q.difficulty||'보통';$('explanation').value=q.explanation||'';$('formTitle').textContent='문제 수정';$('saveBtn').textContent='수정 내용 저장';window.scrollTo({top:0,behavior:'smooth'});};const del=document.createElement('button');del.className='btn del';del.type='button';del.textContent='삭제';del.onclick=async()=>{if(!confirm('이 문제를 삭제할까요?'))return;items[mode]=items[mode].filter(x=>x.id!==q.id);await save();};actions.append(edit,del);card.append(actions);box.append(card);});}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=async()=>{mode=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.className='btn '+(x===b?'':'alt'));clear();status('');try{await load(mode);render();}catch(e){status(e.message);}});
$('quizForm').onsubmit=async e=>{e.preventDefault();const id=$('editId').value||'q_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);const q={id,question:$('question').value.trim(),answer:$('answer').value.trim(),difficulty:$('difficulty').value,explanation:$('explanation').value.trim(),updatedAt:new Date().toISOString()};const i=items[mode].findIndex(x=>x.id===id);if(i<0)items[mode].unshift(q);else items[mode][i]=q;await save();clear();};
$('clearBtn').onclick=clear;
(async()=>{if(!token()){$('gate').hidden=false;return;}$('manager').hidden=false;try{await Promise.all([load('mini'),load('five')]);render();}catch(e){status(e.message);}})();
})();
</script></body></html>
