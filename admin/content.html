<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>공지·업데이트 관리 | YouthDeveloper</title><style>
:root{--bg:#05070a;--panel:#0c1016;--line:rgba(255,255,255,.1);--text:#edf2f7;--muted:#8994a1;--green:#61ff9a;--cyan:#62e8ff;--red:#ff667d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 Inter,system-ui,sans-serif}.wrap{width:min(960px,calc(100% - 32px));margin:auto}header{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}a{color:var(--green);text-decoration:none}.head{padding:30px 0 18px}h1{margin:0;font-size:30px}.muted{color:var(--muted)}.tabs{display:flex;gap:8px;margin:12px 0}.btn{padding:9px 13px;border:1px solid rgba(97,255,154,.3);border-radius:8px;background:#102017;color:var(--green);cursor:pointer}.btn.alt{border-color:var(--line);background:transparent;color:var(--muted)}.btn.del{color:var(--red);border-color:#77333d;background:#210d11}.panel{padding:20px;margin:12px 0;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.panel h2{margin:0 0 14px;font-size:19px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;color:var(--muted)}input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:#080b10;color:var(--text);font:inherit}textarea{min-height:100px;resize:vertical}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.status{font-size:12px;color:var(--cyan);min-height:20px}.list{display:grid;gap:9px;margin-top:18px}.item{padding:14px;border:1px solid var(--line);border-radius:9px;background:#090d12}.item strong{display:block}.item small{color:var(--muted)}.item p{white-space:pre-wrap;color:#c5ced7}.hidden{display:none!important}@media(max-width:600px){.panel{padding:15px}h1{font-size:25px}}
</style></head><body><div class="wrap"><header><a href="/admin/">YOUTHDEVELOPER / ADMIN</a><a href="/">메인 페이지</a></header><section class="head"><h1>공지 · 업데이트 관리</h1><p class="muted">공지는 Cloudflare에 저장되어 공개되고, 업데이트 기록은 GitHub에 저장됩니다.</p></section>
<div id="gate" class="panel">관리자 로그인이 필요합니다. <a href="/admin/">관리자 페이지에서 로그인해 주세요.</a></div>
<div id="manager" class="hidden"><div class="tabs"><button class="btn" data-tab="notices">공지 관리</button><button class="btn alt" data-tab="updates">업데이트 기록</button></div>
<section class="panel" id="noticePanel"><h2 id="noticeHeading">새 공지 작성</h2><form id="noticeForm"><input type="hidden" id="noticeId"><label class="field"><label for="noticeTitle">제목</label><input id="noticeTitle" maxlength="120" required></label><label class="field"><label for="noticeBody">내용</label><textarea id="noticeBody" maxlength="5000" required></textarea></label><div class="row"><button class="btn">공지 저장</button><button class="btn alt" type="button" id="noticeNew">새 공지</button><span class="status" id="noticeStatus"></span></div></form><div class="list" id="noticeList"></div></section>
<section class="panel hidden" id="updatePanel"><h2 id="updateHeading">업데이트 기록 추가</h2><form id="updateForm"><input type="hidden" id="updateId"><label class="field"><label for="updateDate">날짜</label><input id="updateDate" type="date" required></label><label class="field"><label for="updateCategory">분류</label><input id="updateCategory" maxlength="30" value="PORTAL" required></label><label class="field"><label for="updateTitle">제목</label><input id="updateTitle" maxlength="120" required></label><label class="field"><label for="updateBody">내용</label><textarea id="updateBody" maxlength="3000" required></textarea></label><div class="row"><button class="btn">GitHub에 저장</button><button class="btn alt" type="button" id="updateNew">새 기록</button><span class="status" id="updateStatus"></span></div></form><div class="list" id="updateList"></div></section></div></div>
<script>
(()=>{'use strict';const API='https://web.youthdeveloper-github.workers.dev',KEY='yd_admin_session',$=id=>document.getElementById(id);let notices=[],updates=[];const token=()=>sessionStorage.getItem(KEY)||'';
async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{Authorization:'Bearer '+token(),...(opt.body?{'Content-Type':'application/json'}:{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'요청 실패 '+r.status);return d;}
function status(id,msg){$(id).textContent=msg;}
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n;}
function rowActions(box,edit,del){const actions=el('div','row');const e=el('button','btn alt','수정');e.type='button';e.onclick=edit;const d=el('button','btn del','삭제');d.type='button';d.onclick=del;actions.append(e,d);box.append(actions);}
async function loadNotices(){const d=await api('/api/tools/notices');notices=d.data||[];notices.sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));const box=$('noticeList');box.replaceChildren();if(!notices.length){box.append(el('p','muted','등록된 공지가 없습니다.'));return;}notices.forEach(n=>{const a=el('article','item');a.append(el('strong','',n.title),el('small','',new Date(n.createdAt||Date.now()).toLocaleString('ko-KR')),el('p','',n.body));rowActions(a,()=>{$('noticeId').value=n.id;$('noticeTitle').value=n.title;$('noticeBody').value=n.body;$('noticeHeading').textContent='공지 수정';},async()=>{if(!confirm('이 공지를 삭제할까요?'))return;try{await api('/api/tools/notices/'+encodeURIComponent(n.id),{method:'DELETE'});await loadNotices();status('noticeStatus','삭제했습니다.');}catch(e){status('noticeStatus',e.message);}});box.append(a);});}
$('noticeForm').onsubmit=async e=>{e.preventDefault();const id=$('noticeId').value;try{await api('/api/tools/notices'+(id?'/'+encodeURIComponent(id):''),{method:id?'PUT':'POST',body:JSON.stringify({title:$('noticeTitle').value.trim(),body:$('noticeBody').value.trim()})});$('noticeForm').reset();$('noticeId').value='';$('noticeHeading').textContent='새 공지 작성';await loadNotices();status('noticeStatus','저장했습니다.');}catch(err){status('noticeStatus',err.message);}};
$('noticeNew').onclick=()=>{$('noticeForm').reset();$('noticeId').value='';$('noticeHeading').textContent='새 공지 작성';};
async function gh(method,content){const path='data/updates.json';const opt={method};if(method==='PUT')opt.body=JSON.stringify({repo:'youthdeveloping/youthdeveloping.github.io',branch:'main',path,message:'Update website changelog via admin',content});return api('/api/admin/github'+(method==='GET'?'?path='+encodeURIComponent(path)+'&branch=main':''),opt);}
async function loadUpdates(){const d=await gh('GET');updates=JSON.parse(d.content).items||[];renderUpdates();}
function renderUpdates(){const box=$('updateList');box.replaceChildren();updates.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).forEach(u=>{const a=el('article','item');a.append(el('strong','',u.title),el('small','',u.date+' · '+u.category),el('p','',u.body));rowActions(a,()=>{$('updateId').value=u.id;$('updateDate').value=u.date;$('updateCategory').value=u.category;$('updateTitle').value=u.title;$('updateBody').value=u.body;$('updateHeading').textContent='업데이트 수정';},async()=>{if(!confirm('이 기록을 삭제할까요?'))return;updates=updates.filter(x=>x.id!==u.id);await saveUpdates();});box.append(a);});if(!updates.length)box.append(el('p','muted','기록이 없습니다.'));}
async function saveUpdates(){status('updateStatus','GitHub에 저장 중...');try{await gh('PUT',JSON.stringify({updated:new Date().toISOString(),items:updates},null,2)+'\n');renderUpdates();status('updateStatus','GitHub에 저장했습니다.');}catch(e){status('updateStatus',e.message);}}
$('updateForm').onsubmit=async e=>{e.preventDefault();const id=$('updateId').value||'update_'+Date.now();const item={id,date:$('updateDate').value,category:$('updateCategory').value.trim(),title:$('updateTitle').value.trim(),body:$('updateBody').value.trim()};const i=updates.findIndex(x=>x.id===id);if(i<0)updates.push(item);else updates[i]=item;$('updateForm').reset();$('updateId').value='';$('updateDate').value=new Date().toISOString().slice(0,10);$('updateCategory').value='PORTAL';$('updateHeading').textContent='업데이트 기록 추가';await saveUpdates();};
$('updateNew').onclick=()=>{$('updateForm').reset();$('updateId').value='';$('updateDate').value=new Date().toISOString().slice(0,10);$('updateCategory').value='PORTAL';$('updateHeading').textContent='업데이트 기록 추가';};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>{x.className='btn '+(x===b?'':'alt');});$('noticePanel').classList.toggle('hidden',b.dataset.tab!=='notices');$('updatePanel').classList.toggle('hidden',b.dataset.tab!=='updates');});
$('updateDate').value=new Date().toISOString().slice(0,10);
if(token()){$('gate').classList.add('hidden');$('manager').classList.remove('hidden');Promise.all([loadNotices(),loadUpdates()]).catch(e=>{status('noticeStatus',e.message);if(/인증|로그인/.test(e.message)){$('manager').classList.add('hidden');$('gate').classList.remove('hidden');}});}
})();
</script></body></html>
