<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070a"><title>업데이트 기록 | YouthDeveloper</title><style>:root{--bg:#05070a;--panel:#0c1016;--line:rgba(255,255,255,.1);--text:#edf2f7;--muted:#8994a1;--green:#61ff9a;--cyan:#62e8ff;--mono:Consolas,monospace}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0%,#10202a,transparent 30rem),var(--bg);color:var(--text);font:14px/1.7 Inter,system-ui,sans-serif}.wrap{width:min(900px,calc(100% - 32px));margin:auto}header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font:12px var(--mono)}a{color:var(--green);text-decoration:none}.hero{padding:56px 0 30px}.eyebrow{color:var(--green);font:11px var(--mono);letter-spacing:.15em}h1{font-size:clamp(36px,7vw,58px);letter-spacing:-.06em;margin:12px 0}.muted{color:var(--muted)}.list{display:grid;gap:12px;padding-bottom:60px}.item{padding:22px;border:1px solid var(--line);background:var(--panel);border-radius:13px}.meta{color:var(--cyan);font:11px var(--mono)}.item h2{font-size:20px;margin:8px 0}.item p{white-space:pre-wrap;color:#c6ced7;margin:0}.empty{padding:36px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}</style></head><body><div class="wrap"><header><a href="/">YOUTHDEVELOPER / PORTAL</a><a href="/">← HOME</a></header><section class="hero"><div class="eyebrow">CHANGELOG</div><h1>업데이트 기록</h1><p class="muted">청소년개발자 프로젝트의 변경 사항과 새 기능을 기록합니다.</p></section><main class="list" id="updates"><div class="empty">불러오는 중입니다.</div></main></div><script>(async()=>{const box=document.getElementById('updates');try{const r=await fetch('/data/updates.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json(),items=(d.items||[]).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));box.replaceChildren();if(!items.length){const e=document.createElement('div');e.className='empty';e.textContent='아직 공개된 업데이트가 없습니다.';box.append(e);return;}items.forEach(x=>{const a=document.createElement('article');a.className='item';const m=document.createElement('div');m.className='meta';m.textContent=(x.date||'')+' / '+(x.category||'UPDATE');const h=document.createElement('h2');h.textContent=x.title||'업데이트';const p=document.createElement('p');p.textContent=x.body||'';a.append(m,h,p);box.append(a);});}catch{box.textContent='업데이트 기록을 불러오지 못했습니다.';}})();</script></body></html>
