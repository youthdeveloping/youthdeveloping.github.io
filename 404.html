<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b10"><title>링크 이동 중 | YouthDeveloper</title><style>body{margin:0;background:#080b10;color:#edf3fa;font:16px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}.box{max-width:540px;padding:28px}h1{font-size:32px}p{color:#9aa9b8;line-height:1.8}a{color:#62e8ff}</style></head><body><main class="box"><p>YOUTHDEVELOPER / LINK SERVICE</p><h1 id="title">링크를 확인하고 있습니다…</h1><p id="detail">잠시만 기다려 주세요.</p><p><a href="/">메인 페이지로 돌아가기</a></p></main><script>
(async()=>{const m=location.pathname.match(/^\/s\/([a-zA-Z0-9_-]+)\/?$/);if(!m){document.querySelector("#title").textContent="페이지를 찾을 수 없습니다.";document.querySelector("#detail").textContent="요청한 페이지가 없거나 주소가 잘못되었습니다.";return;}try{const r=await fetch("https://web.youthdeveloper-github.workers.dev/api/resolve/"+encodeURIComponent(m[1]));const d=await r.json();if(!r.ok||!d.url)throw new Error(d.error||"링크를 찾을 수 없습니다.");location.replace(d.url);}catch(e){document.querySelector("#title").textContent="링크를 열 수 없습니다.";document.querySelector("#detail").textContent=e.message+" — 주소를 확인하거나 만든 사람에게 문의해 주세요.";}})();
</script></body></html>
