<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aim Trainer · TJ Games</title>
<style>
:root{
  --bg:#11191d; --panel:#16222a; --line:#25363f; --ink:#e8eef0; --dim:#8ea0a8;
  --red:#ff5b4a; --amber:#ffc247; --ok:#5fd4a0;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  display:flex; flex-direction:column; min-height:100dvh;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
header{
  display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  padding:14px 18px;
}
.brand{display:flex; flex-direction:column; line-height:1.15}
.brand small{color:var(--dim); font-size:12px; letter-spacing:.02em}
.brand b{font-size:20px; font-weight:800}
.hud{display:flex; gap:20px}
.stat{display:flex; flex-direction:column; align-items:flex-end; min-width:64px}
.stat span{font-size:12px; color:var(--dim)}
.stat b{font-size:24px; font-variant-numeric:tabular-nums; font-weight:800}
.stat.miss b{color:var(--red)}
#arena{
  position:relative; flex:1; min-height:360px; margin:0 14px 14px;
  border:1px solid var(--line); border-radius:16px; overflow:hidden;
  background:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/48px 48px,
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/48px 48px,
    var(--panel);
  background-blend-mode:normal;
  cursor:crosshair; touch-action:manipulation; user-select:none; -webkit-user-select:none;
}
#arena.flash{animation:flash .22s}
@keyframes flash{0%{box-shadow:inset 0 0 0 4px var(--red)}100%{box-shadow:inset 0 0 0 4px transparent}}
.target{
  position:absolute; border-radius:50%; cursor:crosshair;
  background:radial-gradient(circle,#fff 0 14%,var(--red) 14% 38%,#fff 38% 60%,var(--red) 60% 100%);
  animation:pop .12s ease-out;
}
@keyframes pop{from{transform:scale(.5)}to{transform:scale(1)}}
.miss-tag{
  position:absolute; color:var(--red); font-weight:800; font-size:16px; pointer-events:none;
  transform:translate(-50%,-50%); animation:rise .6s ease-out forwards;
}
@keyframes rise{to{transform:translate(-50%,-150%); opacity:0}}
.overlay{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  background:rgba(17,25,29,.92); padding:16px; overflow:auto; cursor:default;
}
.overlay[hidden]{display:none}
.card{width:min(440px,100%); text-align:center}
.card h1{margin:0 0 8px; font-size:26px; letter-spacing:-.01em}
.card p{margin:0 0 20px; color:var(--dim); line-height:1.5}
.label{display:block; text-align:left; font-size:13px; color:var(--dim); margin-bottom:8px}
.chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}
.chip{
  flex:1; min-width:56px; padding:10px 0; border-radius:10px; border:1px solid var(--line);
  background:transparent; color:var(--ink); font:inherit; font-weight:700; cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.custom{display:flex; align-items:center; gap:10px; margin-bottom:22px}
.custom input{
  flex:1; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
  background:var(--bg); color:var(--ink); font:inherit; font-size:16px; text-align:center;
}
.custom span{color:var(--dim); font-size:13px; white-space:nowrap}
.btn{
  width:100%; padding:14px; border:0; border-radius:12px; transition:filter .15s; background:var(--red); color:#fff;
  font:inherit; font-size:18px; font-weight:800; cursor:pointer;
}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent; border:1px solid var(--line); color:var(--ink); margin-top:10px; font-size:15px; font-weight:600}
:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
#countdown{font-size:96px; font-weight:800; font-variant-numeric:tabular-nums}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:18px 0 20px}
.cell{background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:14px 10px}
.cell span{display:block; font-size:12px; color:var(--dim); margin-bottom:4px}
.cell b{font-size:26px; font-weight:800; font-variant-numeric:tabular-nums}
.cell.wide{grid-column:1/-1}
.cell.wide b{font-size:40px}
#recordNote{min-height:20px; font-size:14px; color:var(--amber); margin:-8px 0 14px}
@media (prefers-reduced-motion:reduce){.target,.miss-tag,#arena.flash{animation:none}}
@media (max-width:480px){.hud{gap:14px}.stat b{font-size:20px}}
</style>
</head>
<body>
<header>
  <div class="brand"><small>TJ Games</small><b>Aim Trainer</b></div>
  <div class="hud" aria-live="off">
    <div class="stat"><span>맞힌 개수</span><b id="hits">0 / 30</b></div>
    <div class="stat miss"><span>MISS</span><b id="miss">0</b></div>
    <div class="stat"><span>시간</span><b id="time">0.00s</b></div>
  </div>
</header>

<main id="arena">
  <div class="overlay" id="setup">
    <div class="card">
      <h1>타겟을 최대한 빠르게</h1>
      <p>나타나는 타겟을 바로 클릭하세요. 빈 공간을 누르면 MISS입니다.<br>Esc 키를 누르면 중단됩니다.</p>
      <span class="label">타겟 개수</span>
      <div class="chips" id="chips">
        <button class="chip" data-n="10" aria-pressed="false">10</button>
        <button class="chip" data-n="20" aria-pressed="false">20</button>
        <button class="chip" data-n="30" aria-pressed="true">30</button>
        <button class="chip" data-n="50" aria-pressed="false">50</button>
      </div>
      <div class="custom">
        <input id="countInput" type="number" min="1" max="100" value="30" inputmode="numeric" aria-label="타겟 개수 직접 입력">
        <span>직접 입력 (1–100)</span>
      </div>
      <button class="btn" id="startBtn">시작</button>
    </div>
  </div>

  <div class="overlay" id="countOverlay" hidden><div id="countdown">3</div></div>

  <div class="overlay" id="result" hidden>
    <div class="card">
      <h1>결과</h1>
      <div class="grid">
        <div class="cell wide"><span>총 시간</span><b id="rTotal">-</b></div>
        <div class="cell"><span>평균 클릭 시간</span><b id="rAvg">-</b></div>
        <div class="cell"><span>가장 빠른 클릭</span><b id="rBest">-</b></div>
        <div class="cell"><span>명중률</span><b id="rAcc">-</b></div>
        <div class="cell"><span>MISS</span><b id="rMiss">-</b></div>
      </div>
      <div id="recordNote"></div>
      <button class="btn" id="againBtn">다시 하기</button>
      <button class="btn ghost" id="settingBtn">타겟 개수 바꾸기</button>
    </div>
  </div>
</main>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const arena = $('arena'), setup = $('setup'), result = $('result'),
        countOverlay = $('countOverlay'), countdownEl = $('countdown'),
        hitsEl = $('hits'), missEl = $('miss'), timeEl = $('time'),
        input = $('countInput'), chips = [...document.querySelectorAll('.chip')];

  let total = 30, hits = 0, misses = 0, times = [];
  let state = 'idle', t0 = 0, tShown = 0, targetEl = null, last = null;
  let timerId = null, cdId = null;

  const clampCount = v => Math.min(100, Math.max(1, Math.round(Number(v)) || 30));
  const fmtSec = ms => (ms / 1000).toFixed(2) + 's';

  function updateHud(){
    hitsEl.textContent = hits + ' / ' + total;
    missEl.textContent = misses;
  }
  function syncChips(){
    chips.forEach(c => c.setAttribute('aria-pressed', String(Number(c.dataset.n) === total)));
  }
  function setTotal(v){
    total = clampCount(v);
    input.value = total;
    syncChips(); updateHud();
  }

  chips.forEach(c => c.addEventListener('click', () => setTotal(c.dataset.n)));
  input.addEventListener('input', () => {
    const v = Number(input.value);
    if (v >= 1 && v <= 100){ total = Math.round(v); syncChips(); updateHud(); }
  });
  input.addEventListener('change', () => setTotal(input.value));
  input.addEventListener('keydown', e => { if (e.key === 'Enter') startGame(); });

  function reset(){
    clearInterval(timerId); clearInterval(cdId);
    if (targetEl){ targetEl.remove(); targetEl = null; }
    hits = 0; misses = 0; times = []; last = null;
    timeEl.textContent = '0.00s';
    updateHud();
  }

  function startGame(){
    setTotal(input.value);
    reset();
    setup.hidden = true; result.hidden = true;
    state = 'countdown';
    let n = 3;
    countdownEl.textContent = n;
    countOverlay.hidden = false;
    cdId = setInterval(() => {
      n--;
      if (n > 0){ countdownEl.textContent = n; }
      else { clearInterval(cdId); countOverlay.hidden = true; begin(); }
    }, 700);
  }

  function begin(){
    state = 'playing';
    t0 = performance.now();
    timerId = setInterval(() => {
      timeEl.textContent = fmtSec(performance.now() - t0);
    }, 50);
    spawn();
  }

  function targetSize(){
    const r = arena.getBoundingClientRect();
    return Math.round(Math.max(40, Math.min(72, Math.min(r.width, r.height) * 0.12)));
  }

  function spawn(){
    if (targetEl) targetEl.remove();
    const r = arena.getBoundingClientRect();
    const s = targetSize(), m = s / 2 + 8;
    const minDist = Math.min(r.width, r.height) * 0.25;
    let x, y, tries = 0;
    do {
      x = m + Math.random() * (r.width - 2 * m);
      y = m + Math.random() * (r.height - 2 * m);
      tries++;
    } while (last && Math.hypot(x - last.x, y - last.y) < minDist && tries < 40);
    last = { x, y };

    const el = document.createElement('div');
    el.className = 'target';
    el.style.width = el.style.height = s + 'px';
    el.style.left = (x - s / 2) + 'px';
    el.style.top = (y - s / 2) + 'px';
    el.addEventListener('pointerdown', onHit);
    arena.appendChild(el);
    targetEl = el;
    tShown = performance.now();
  }

  function onHit(e){
    e.stopPropagation(); e.preventDefault();
    if (state !== 'playing') return;
    const now = performance.now();
    times.push(now - tShown);
    hits++;
    updateHud();
    if (hits >= total) finish(now);
    else spawn();
  }

  arena.addEventListener('pointerdown', e => {
    if (state !== 'playing') return;
    misses++;
    updateHud();
    const r = arena.getBoundingClientRect();
    const tag = document.createElement('div');
    tag.className = 'miss-tag';
    tag.textContent = 'MISS';
    tag.style.left = (e.clientX - r.left) + 'px';
    tag.style.top = (e.clientY - r.top) + 'px';
    arena.appendChild(tag);
    setTimeout(() => tag.remove(), 600);
    arena.classList.remove('flash'); void arena.offsetWidth; arena.classList.add('flash');
  });

  function finish(now){
    state = 'done';
    clearInterval(timerId);
    if (targetEl){ targetEl.remove(); targetEl = null; }
    const totalMs = now - t0;
    timeEl.textContent = fmtSec(totalMs);
    const avg = times.reduce((a, b) => a + b, 0) / times.length;
    const best = Math.min(...times);
    const acc = hits / (hits + misses) * 100;

    $('rTotal').textContent = fmtSec(totalMs);
    $('rAvg').textContent = Math.round(avg) + ' ms';
    $('rBest').textContent = Math.round(best) + ' ms';
    $('rAcc').textContent = acc.toFixed(1) + '%';
    $('rMiss').textContent = misses;

    // 개인 최고 기록 (타겟 개수별, 브라우저에 저장)
    const key = 'tj-aim-best-' + total;
    let note = '';
    try {
      const prev = parseFloat(localStorage.getItem(key));
      if (!prev || totalMs < prev){
        localStorage.setItem(key, String(totalMs));
        note = prev ? '새 최고 기록! (이전 ' + fmtSec(prev) + ')' : '첫 기록이 저장되었어요.';
      } else {
        note = total + '개 최고 기록: ' + fmtSec(prev);
      }
    } catch (err) {}
    $('recordNote').textContent = note;
    result.hidden = false;
    $('againBtn').focus();
  }

  function toSetup(){
    state = 'idle';
    reset();
    countOverlay.hidden = true; result.hidden = true; setup.hidden = false;
  }

  $('startBtn').addEventListener('click', startGame);
  $('againBtn').addEventListener('click', startGame);
  $('settingBtn').addEventListener('click', toSetup);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && (state === 'playing' || state === 'countdown')) toSetup();
  });

  setTotal(30);
})();
</script>
</body>
</html>
