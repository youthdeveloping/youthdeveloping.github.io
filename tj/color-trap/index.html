<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0c14">
<title>색깔 함정 | TJ Games</title>
<style>
:root{--bg:#0b0c14;--panel:#151728;--line:#262a45;--tx:#eceefb;--mute:#8b90b3;--a:#ff4d8d;--b:#ffb020;--good:#2ee59d;--bad:#ff4258}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;touch-action:manipulation;overscroll-behavior:none}
body{background:radial-gradient(900px 500px at 50% -10%,#241a3f 0,transparent 70%),var(--bg)}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.app{height:100dvh;max-width:560px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;position:relative}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex}
.brand{font-weight:900;letter-spacing:.04em;font-size:15px;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.top{display:flex;justify-content:space-between;align-items:center}
.top small{color:var(--mute);font-size:12px}
/* start & result */
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px;overflow:auto;padding:6px 0}
h1{font-size:clamp(40px,12vw,62px);font-weight:900;line-height:1.05;letter-spacing:-.02em}
h1 span{display:inline-block}
.sub{color:var(--mute);font-size:15px;line-height:1.6;max-width:360px}
.sub b{color:var(--tx)}
.best{display:flex;gap:8px;width:100%}
.best div,.rgrid div{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 6px}
.best i,.rgrid i{display:block;font-style:normal;font-size:11px;color:var(--mute);margin-bottom:4px}
.best b{font-size:20px;font-variant-numeric:tabular-nums}
.btn{width:100%;padding:17px;border-radius:16px;font-weight:900;font-size:19px;color:#14091a;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 8px 30px #ff4d8d40;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--panel);color:var(--tx);border:1px solid var(--line);box-shadow:none;font-size:16px;padding:14px}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%}
.mode{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 11px;text-align:left;transition:transform .1s}
.mode:active{transform:scale(.97)}
.mode b{display:block;font-size:15px;margin-bottom:2px}
.mode small{font-size:11.5px;color:var(--mute);line-height:1.3;display:block}
.mode.on{border-color:var(--b);background:#201d2e;box-shadow:inset 0 0 0 1px var(--b)}
/* hud */
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.hud div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 4px;text-align:center}
.hud i{display:block;font-style:normal;font-size:10.5px;color:var(--mute)}
.hud b{font-size:clamp(16px,5vw,21px);font-variant-numeric:tabular-nums}
#hTime.warn{color:var(--bad);animation:blink .5s infinite}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.bar>div{height:100%;width:100%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:9px}
#qbar{height:5px}
/* stage */
.stage{flex:1;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;position:relative;overflow:hidden;transition:background .15s,border-color .15s}
.stage.good{background:#12372f;border-color:var(--good)}
.stage.bad{background:#3a1520;border-color:var(--bad);animation:shake .35s}
.inst{font-weight:800;font-size:clamp(15px,4.4vw,19px);padding:9px 18px;border-radius:99px;background:#0b0c14;border:1px solid var(--line);text-align:center}
.inst.m{border-color:#7aa8ff}.inst.c{border-color:var(--b)}
.badge{min-height:22px;font-size:13px;font-weight:800;color:var(--b)}
#word{font-size:clamp(56px,20vw,112px);font-weight:900;line-height:1.1;letter-spacing:-.02em;text-shadow:0 0 30px currentColor;white-space:nowrap}
#word.pop{animation:pop .22s}
.pad{display:grid;gap:9px;grid-template-columns:repeat(3,1fr)}
.pad[data-n="4"]{grid-template-columns:repeat(2,1fr)}
.cbtn{height:clamp(54px,11dvh,78px);border-radius:16px;font-size:clamp(17px,5vw,22px);font-weight:900;box-shadow:inset 0 -4px 0 #0003;transition:transform .08s,filter .15s}
.cbtn:active{transform:scale(.93)}
.cbtn.rev{outline:4px solid #fff;animation:pop .3s}
.pad.lock .cbtn{filter:brightness(.8)}
.float{position:absolute;font-weight:900;pointer-events:none;animation:up .8s forwards;font-size:26px}
.fx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:5;font-weight:900;font-size:clamp(40px,13vw,72px);text-align:center;opacity:0;text-shadow:0 0 30px #000}
.fx.go{animation:fxa .9s}
.cd{position:absolute;inset:0;background:#0b0c14d9;display:none;align-items:center;justify-content:center;z-index:9;font-size:clamp(80px,28vw,150px);font-weight:900;border-radius:22px}
.cd.on{display:flex}.cd span{animation:pop .5s}
/* result */
.grade{font-size:clamp(90px,28vw,140px);font-weight:900;line-height:1;background:linear-gradient(135deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop .5s}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.rgrid b{font-size:clamp(17px,5vw,22px);font-variant-numeric:tabular-nums}
.rgrid .nr{border-color:var(--b);box-shadow:0 0 18px #ffb02040}
.rec{font-size:clamp(22px,7vw,30px);font-weight:900;color:var(--b);animation:pulse .8s infinite alternate;display:none}
.conf{position:fixed;top:-30px;font-size:22px;pointer-events:none;animation:fall 2.4s linear forwards;z-index:20}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}45%{transform:translateX(9px)}70%{transform:translateX(-6px)}}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
@keyframes fxa{0%{opacity:0;transform:scale(.5)}20%{opacity:1;transform:scale(1.15)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.3)}}
@keyframes blink{50%{opacity:.4}}
@keyframes pulse{to{transform:scale(1.07)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (max-height:620px){.stage{gap:6px}.hud div{padding:4px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">TJ GAMES</div><small>색깔 함정 · Color Trap</small></div>

  <section class="screen on" id="sStart">
    <div class="center">
      <h1>색깔 <span style="background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent">함정</span></h1>
      <p class="sub">위에 나오는 <b>지시</b>를 먼저 읽으세요.<br><b>글자의 의미</b>인지 <b>실제 글자색</b>인지에 따라 정답이 달라집니다. 60초 동안 최대한 빠르게!</p>
      <div class="modes" id="modes"></div>
      <div class="best">
        <div><i>최고 점수</i><b id="bScore">0</b></div>
        <div><i>최고 콤보</i><b id="bCombo">0</b></div>
        <div><i>최고 정확도</i><b id="bAcc">0%</b></div>
      </div>
      <button class="btn" id="startBtn">게임 시작</button>
      <p class="sub" style="font-size:12.5px">키보드 1~6 으로도 선택할 수 있어요</p>
    </div>
  </section>

  <section class="screen" id="sGame">
    <div class="hud">
      <div><i>점수</i><b id="hScore">0</b></div>
      <div><i>콤보</i><b id="hCombo">0</b></div>
      <div><i>남은 시간</i><b id="hTime">60.0</b></div>
      <div><i>정답</i><b id="hOk">0</b></div>
    </div>
    <div class="bar"><div id="tbar"></div></div>
    <div class="stage" id="stage">
      <div class="inst" id="inst">&nbsp;</div>
      <div class="badge" id="badge"></div>
      <div id="word"></div>
      <div class="bar" style="width:70%"><div id="qbar"></div></div>
      <div class="fx" id="fx"></div>
      <div class="cd" id="cd"><span id="cdt">3</span></div>
    </div>
    <div class="pad" id="pad" data-n="4"></div>
  </section>

  <section class="screen" id="sEnd">
    <div class="center">
      <div class="sub" id="rMode"></div>
      <div class="rec" id="rec">🎉 NEW RECORD!</div>
      <div class="grade" id="rGrade">S</div>
      <div class="rgrid">
        <div id="cScore"><i>점수</i><b id="rScore"></b></div>
        <div><i>정답 수</i><b id="rOk"></b></div>
        <div><i>오답 수</i><b id="rMiss"></b></div>
        <div id="cAcc"><i>정확도</i><b id="rAcc"></b></div>
        <div><i>평균 응답시간</i><b id="rAvg"></b></div>
        <div id="cCombo"><i>최고 콤보</i><b id="rCombo"></b></div>
      </div>
      <button class="btn" id="againBtn">다시하기</button>
      <button class="btn ghost" id="homeBtn">처음으로</button>
    </div>
  </section>
</div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var KEY='tjgames_colortrap_v1', TOTAL=60, PENALTY=3;
var NORMAL=[{n:'빨강',c:'#ff3d4d'},{n:'파랑',c:'#3b82ff'},{n:'초록',c:'#22c55e'},{n:'노랑',c:'#ffd60a'},{n:'보라',c:'#b062ff'},{n:'주황',c:'#ff8a1f'}];
var HARD=[{n:'빨강',c:'#e5383b'},{n:'분홍',c:'#ff6fa8'},{n:'주황',c:'#ff8a1f'},{n:'파랑',c:'#2f6bff'},{n:'하늘',c:'#4cc9f0'},{n:'남색',c:'#4a4fd6'}];
var SPECIAL={speed:{ic:'⚡',t:'스피드 문제! 2초 안에!',m:1.5},shuffle:{ic:'🔄',t:'버튼이 계속 섞입니다!',m:1.5},hard:{ic:'💀',t:'비슷한 색 주의!',m:2}};

var MODES={
  mix:{n:'🎲 혼합',d:'의미·색 지시 랜덤, 특수 문제는 가끔'},
  meaning:{n:'📖 글자의 의미',d:'항상 글자가 뜻하는 색 고르기'},
  color:{n:'🎨 실제 글자색',d:'항상 칠해진 글자색 고르기'},
  speed:{n:'⚡ 스피드',d:'매 문제 2초 안에 답하기'},
  shuffle:{n:'🔄 셔플',d:'버튼 위치가 계속 섞임'},
  hard:{n:'💀 하드',d:'매우 비슷한 색 6가지'}
};
var cur='mix';
var S={}, token=0, shuffleTimer=null, fbTimer=null;

function rec(){try{var r=JSON.parse(localStorage.getItem(KEY+'_'+cur));if(r&&typeof r==='object')return {score:+r.score||0,combo:+r.combo||0,acc:+r.acc||0}}catch(e){}return {score:0,combo:0,acc:0}}
function saveRec(r){try{localStorage.setItem(KEY+'_'+cur,JSON.stringify(r))}catch(e){}}
function show(id){['sStart','sGame','sEnd'].forEach(function(s){$(s).classList.toggle('on',s===id)})}
function showBest(){var r=rec();$('bScore').textContent=r.score.toLocaleString();$('bCombo').textContent=r.combo;$('bAcc').textContent=r.acc.toFixed(1)+'%'}
function rnd(n){return Math.floor(Math.random()*n)}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
function lum(h){var r=parseInt(h.substr(1,2),16),g=parseInt(h.substr(3,2),16),b=parseInt(h.substr(5,2),16);return (0.299*r+0.587*g+0.114*b)}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function retrig(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}

function reset(){
  S={mode:cur,running:false,lock:true,tLeft:TOTAL,score:0,combo:0,maxCombo:0,ok:0,miss:0,rts:[],nQ:0,since:0,Q:null,qStart:0,last:0};
  $('hScore').textContent='0';$('hCombo').textContent='0';$('hOk').textContent='0';$('hTime').textContent='60.0';
  $('tbar').style.width='100%';$('qbar').style.width='100%';$('word').textContent='';$('inst').innerHTML='&nbsp;';$('badge').textContent='';
  $('stage').className='stage';
}

async function start(){
  var my=++token;
  clearTimeout(fbTimer);clearInterval(shuffleTimer);
  reset();show('sGame');$('pad').innerHTML='';
  var cd=$('cd');cd.classList.add('on');
  var seq=['3','2','1','GO!'];
  for(var i=0;i<seq.length;i++){
    $('cdt').textContent=seq[i];retrig($('cdt'),'x');$('cdt').style.animation='none';void $('cdt').offsetWidth;$('cdt').style.animation='';
    $('cdt').style.color=seq[i]==='GO!'?'#2ee59d':'#fff';
    await sleep(seq[i]==='GO!'?550:800);
    if(my!==token)return;
  }
  cd.classList.remove('on');
  S.running=true;S.last=performance.now();
  nextQ();requestAnimationFrame(tick);
}

function nextQ(){
  if(!S.running)return;
  var p=Math.min(1,(TOTAL-S.tLeft)/TOTAL);
  S.nQ++;S.since++;
  var M=S.mode,type=null;
  if(M==='speed'||M==='shuffle'||M==='hard')type=M;
  else if(M==='mix'&&S.nQ>=5&&S.since>=6&&Math.random()<0.15){type=['speed','shuffle','hard'][rnd(3)];S.since=0}
  var pal,list,limit=4.2-2.4*p;
  var nb=p<0.25?4:(p<0.55?5:6);
  if(type==='hard'){pal=HARD;list=[0,1,2,3,4,5];limit+=1.2}
  else{pal=NORMAL;list=[0,1,2,3,4,5];if(nb<6){list=shuf(list).slice(0,nb).sort(function(a,b){return a-b})}}
  if(type==='speed')limit=2;
  limit=Math.max(1.6,limit);
  var w=list[rnd(list.length)],ink;
  do{ink=list[rnd(list.length)]}while(ink===w);
  var mode=M==='meaning'||M==='color'?M:(Math.random()<0.5?'meaning':'color');
  var Q={type:type,pal:pal,list:list,w:w,ink:ink,mode:mode,ans:mode==='meaning'?w:ink,limit:limit,mult:type?SPECIAL[type].m:1};
  S.Q=Q;
  var inst=$('inst');
  inst.textContent=mode==='meaning'?'📖 글자의 의미를 선택하세요':'🎨 실제 글자색을 선택하세요';
  inst.className='inst '+(mode==='meaning'?'m':'c');
  $('badge').textContent=type?SPECIAL[type].ic+' '+SPECIAL[type].t:'';
  var wd=$('word');wd.textContent=pal[w].n;wd.style.color=pal[ink].c;retrig(wd,'pop');
  buildPad(Q);
  clearInterval(shuffleTimer);
  if(type==='shuffle'){shuffleTimer=setInterval(function(){if(!S.lock)reorder()},900)}
  S.lock=false;S.qStart=performance.now();
  $('pad').classList.remove('lock');
}

function buildPad(Q){
  var pad=$('pad');pad.innerHTML='';pad.dataset.n=Q.list.length;
  var order=Q.type==='shuffle'?shuf(Q.list):Q.list;
  order.forEach(function(k){
    var b=document.createElement('button');
    b.className='cbtn';b.dataset.k=k;b.textContent=Q.pal[k].n;
    b.style.background=Q.pal[k].c;b.style.color=lum(Q.pal[k].c)>150?'#111':'#fff';
    pad.appendChild(b);
  });
}
function reorder(){
  var pad=$('pad'),bs=shuf([].slice.call(pad.children));
  bs.forEach(function(b){pad.appendChild(b)});
}

function answer(k,btn){
  if(!S.running||S.lock||!S.Q)return;
  S.lock=true;$('pad').classList.add('lock');clearInterval(shuffleTimer);
  var rt=(performance.now()-S.qStart)/1000;
  if(k===S.Q.ans){good(rt,btn)}else{bad(rt,btn,false)}
}

function good(rt){
  var Q=S.Q;S.ok++;S.combo++;S.rts.push(rt);
  if(S.combo>S.maxCombo)S.maxCombo=S.combo;
  var sp=Math.max(0,1-rt/Q.limit);
  var pts=Math.round((100+Math.round(100*sp)+Math.min(S.combo,30)*5)*Q.mult);
  S.score+=pts;
  flash('good');floatTxt('+'+pts,'#2ee59d');
  if(S.combo%10===0)comboFx(S.combo);
  updHud();
  fbTimer=setTimeout(nextQ,200);
}
function bad(rt,btn,timeout){
  var Q=S.Q;S.miss++;S.combo=0;S.tLeft-=PENALTY;
  if(!timeout)S.rts.push(rt);
  flash('bad');floatTxt(timeout?'TIME OUT -3s':'MISS -3s','#ff4258');
  var c=document.querySelector('.cbtn[data-k="'+Q.ans+'"]');if(c)c.classList.add('rev');
  if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}
  updHud();
  fbTimer=setTimeout(nextQ,520);
}
function flash(c){var s=$('stage');s.className='stage';void s.offsetWidth;s.classList.add(c);setTimeout(function(){s.className='stage'},c==='bad'?420:180)}
function floatTxt(t,col){
  var e=document.createElement('div');e.className='float';e.textContent=t;e.style.color=col;
  e.style.left=(20+Math.random()*45)+'%';e.style.top='22%';
  $('stage').appendChild(e);setTimeout(function(){e.remove()},800);
}
function comboFx(n){
  var f=$('fx');f.innerHTML='🔥 '+n+' COMBO!';f.style.color=n>=30?'#ff4d8d':(n>=20?'#ffb020':'#fff');
  f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
}
function updHud(){
  $('hScore').textContent=S.score.toLocaleString();
  $('hCombo').textContent=S.combo;$('hOk').textContent=S.ok;
}

function tick(now){
  if(!S.running)return;
  var dt=Math.min(0.1,(now-S.last)/1000);S.last=now;
  S.tLeft-=dt;
  if(S.tLeft<=0){S.tLeft=0;$('hTime').textContent='0.0';$('tbar').style.width='0%';return finish()}
  var t=$('hTime');t.textContent=S.tLeft.toFixed(1);t.classList.toggle('warn',S.tLeft<10);
  $('tbar').style.width=(S.tLeft/TOTAL*100)+'%';
  if(!S.lock&&S.Q){
    var rem=S.Q.limit-(now-S.qStart)/1000;
    $('qbar').style.width=Math.max(0,rem/S.Q.limit*100)+'%';
    if(rem<=0){S.lock=true;$('pad').classList.add('lock');clearInterval(shuffleTimer);bad(S.Q.limit,null,true)}
  }
  requestAnimationFrame(tick);
}

function grade(score,acc){
  if(score>=6500&&acc>=92)return 'S';
  if(score>=5000&&acc>=85)return 'A';
  if(score>=3500&&acc>=75)return 'B';
  if(score>=2200)return 'C';
  if(score>=1000)return 'D';
  return 'F';
}

function finish(){
  S.running=false;clearInterval(shuffleTimer);clearTimeout(fbTimer);
  var tot=S.ok+S.miss,acc=tot?S.ok/tot*100:0;
  var avg=S.rts.length?S.rts.reduce(function(a,b){return a+b},0)/S.rts.length:0;
  var prev=rec(),nw={score:S.score>prev.score,combo:S.maxCombo>prev.combo,acc:tot>0&&acc>prev.acc};
  if(nw.score||nw.combo||nw.acc){
    saveRec({score:Math.max(prev.score,S.score),combo:Math.max(prev.combo,S.maxCombo),acc:Math.max(prev.acc,tot>0?acc:0)});
  }
  var g=grade(S.score,acc);
  $('rGrade').textContent=g;
  $('rScore').textContent=S.score.toLocaleString();$('rOk').textContent=S.ok;$('rMiss').textContent=S.miss;
  $('rAcc').textContent=acc.toFixed(1)+'%';$('rAvg').textContent=avg?avg.toFixed(2)+'초':'-';$('rCombo').textContent=S.maxCombo;
  $('cScore').classList.toggle('nr',nw.score);$('cCombo').classList.toggle('nr',nw.combo);$('cAcc').classList.toggle('nr',nw.acc);
  var any=nw.score||nw.combo||nw.acc;
  $('rec').style.display=any?'block':'none';
  $('rMode').textContent=MODES[cur].n+' 모드';
  showBest();show('sEnd');
  if(any)confetti();
}
function confetti(){
  var e=['🎉','✨','⭐','🎊','🔥'];
  for(var i=0;i<26;i++){(function(i){setTimeout(function(){
    var c=document.createElement('div');c.className='conf';c.textContent=e[rnd(e.length)];
    c.style.left=Math.random()*100+'vw';c.style.animationDuration=(1.8+Math.random()*1.6)+'s';
    document.body.appendChild(c);setTimeout(function(){c.remove()},3600);
  },i*60)})(i)}
}

/* events */
$('pad').addEventListener('pointerdown',function(e){
  var b=e.target.closest('.cbtn');if(!b)return;
  e.preventDefault();answer(+b.dataset.k,b);
});
document.addEventListener('keydown',function(e){
  if(S.running&&/^[1-6]$/.test(e.key)){var b=$('pad').children[+e.key-1];if(b)answer(+b.dataset.k,b)}
  else if((e.key==='Enter'||e.key===' ')&&$('sEnd').classList.contains('on')){e.preventDefault();start()}
  else if(e.key==='Enter'&&$('sStart').classList.contains('on')){start()}
});
$('startBtn').addEventListener('click',start);
$('againBtn').addEventListener('click',start);
$('homeBtn').addEventListener('click',function(){token++;show('sStart');showBest()});
/* 확대/선택 방지 */
['gesturestart','gesturechange','gestureend','dblclick','contextmenu','selectstart','dragstart'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault()},{passive:false})});
var lastTouch=0;
document.addEventListener('touchend',function(e){var n=Date.now();if(n-lastTouch<350)e.preventDefault();lastTouch=n},{passive:false});
document.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener('visibilitychange',function(){if(S.running)S.last=performance.now()});

function renderModes(){
  var box=$('modes');box.innerHTML='';
  Object.keys(MODES).forEach(function(k){
    var b=document.createElement('button');b.className='mode'+(k===cur?' on':'');
    b.innerHTML='<b>'+MODES[k].n+'</b><small>'+MODES[k].d+'</small>';
    b.addEventListener('click',function(){cur=k;renderModes();showBest()});
    box.appendChild(b);
  });
}
renderModes();reset();showBest();
})();
</script>
</body>
</html>
