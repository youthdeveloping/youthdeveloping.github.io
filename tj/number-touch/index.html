<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>1부터 순서대로! | TJ Games</title>
<style>
:root{--bg:#0d0f1a;--panel:#171a2b;--line:#2a2f4a;--txt:#eef0ff;--sub:#8b91b8;--a:#ffcc33;--b:#4de1ff;--bad:#ff4d6d;--ok:#5dff9d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;touch-action:manipulation;overflow:hidden}
body{background:radial-gradient(circle at 50% -10%,#232850 0,var(--bg) 60%)}
#app{height:100%;max-width:560px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;min-height:0}
.screen.on{display:flex}
.brand{text-align:center;color:var(--sub);font-weight:700;letter-spacing:.1em;font-size:13px;margin-top:6px}
h1{margin:6px 0 4px;text-align:center;font-size:clamp(30px,9vw,44px);font-weight:900;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.desc{text-align:center;color:var(--sub);margin:0 0 18px;font-size:14px}
.menu{display:flex;flex-direction:column;gap:10px;margin:auto 0}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:16px;padding:16px 18px;font:inherit;font-weight:800;font-size:18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:transform .1s,border-color .15s}
.btn:active{transform:scale(.97)}
.btn:hover{border-color:var(--b)}
.btn small{font-weight:600;color:var(--sub);font-size:13px;text-align:right}
.btn.main{background:linear-gradient(90deg,var(--a),#ff9f1c);color:#1a1300;border:0;justify-content:center}
.hud{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding:6px 2px}
.hud div{display:flex;flex-direction:column}
.hud span{font-size:12px;color:var(--sub);font-weight:700}
.hud b{font-size:22px;font-variant-numeric:tabular-nums}
.target{text-align:center;margin:2px 0 6px}
.target span{font-size:13px;color:var(--sub);font-weight:700}
.target b{display:block;font-size:clamp(44px,13vw,70px);line-height:1;color:var(--a);text-shadow:0 0 24px rgba(255,204,51,.45)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--b),var(--a));transition:width .15s}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#grid{display:grid;gap:6px;width:min(100%,calc(100vh - 290px),520px);aspect-ratio:1/1}
.cell{position:relative;border:1px solid var(--line);border-radius:12px;background:linear-gradient(160deg,#242949,#1a1e36);color:var(--txt);font:inherit;font-weight:900;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:var(--fs,26px);transition:transform .08s}
.cell:active{transform:scale(.93)}
.cell.done{pointer-events:none;border-color:transparent;background:transparent;color:transparent;animation:pop .35s ease-out forwards}
.cell.shake{animation:shake .35s;border-color:var(--bad);background:#3a1c2c}
@keyframes pop{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,204,51,.9);background:#ffcc33;color:#1a1300}60%{transform:scale(1.3);opacity:.8}100%{transform:scale(.2);opacity:0;box-shadow:0 0 0 24px rgba(255,204,51,0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
#combo{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-weight:900;font-size:clamp(26px,8vw,40px);color:var(--b);text-shadow:0 0 18px rgba(77,225,255,.7);opacity:0;pointer-events:none;white-space:nowrap;z-index:5}
#combo.show{animation:cb .8s ease-out}
@keyframes cb{0%{opacity:0;transform:translateX(-50%) scale(.5)}20%{opacity:1;transform:translateX(-50%) scale(1.2)}100%{opacity:0;transform:translateX(-50%) translateY(-24px) scale(1)}}
#miss{position:absolute;inset:0;pointer-events:none;border-radius:14px;box-shadow:inset 0 0 0 0 rgba(255,77,106,0);transition:box-shadow .2s}
#miss.on{box-shadow:inset 0 0 0 4px rgba(255,77,106,.8)}
#count{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(13,15,26,.88);z-index:20;font-size:clamp(90px,34vw,200px);font-weight:900;color:var(--a)}
#count.on{display:flex}
#count span{animation:cd .9s ease-out}
@keyframes cd{0%{transform:scale(2);opacity:0}30%{transform:scale(1);opacity:1}100%{transform:scale(.8);opacity:.2}}
.grade{font-size:clamp(90px,28vw,140px);font-weight:900;text-align:center;line-height:1;margin:6px 0 0}
.record{text-align:center;color:var(--a);font-weight:900;font-size:20px;min-height:28px;margin:6px 0}
.big{text-align:center;font-size:clamp(34px,10vw,48px);font-weight:900;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat span{display:block;color:var(--sub);font-size:12px;font-weight:700}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;margin-top:auto}
.row .btn{flex:1;justify-content:center}

body{background:linear-gradient(135deg,#0d0f1a,#1c1046,#0a2a4a,#2a0f3a,#0d0f1a);background-size:400% 400%;animation:bg 16s ease infinite}
@keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
h1{background:linear-gradient(90deg,#ffcc33,#ff5fa2,#4de1ff,#ffcc33);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;animation:shine 4s linear infinite;filter:drop-shadow(0 0 14px rgba(255,160,80,.35))}
@keyframes shine{to{background-position:250% 0}}
.btn{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));backdrop-filter:blur(6px)}
.btn:hover{box-shadow:0 0 20px rgba(77,225,255,.3)}
.btn.main{box-shadow:0 0 26px rgba(255,159,28,.45)}
#grid{padding:8px;border-radius:22px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);box-shadow:0 0 50px rgba(77,225,255,.12),inset 0 0 30px rgba(180,100,255,.08)}
.cell{background:linear-gradient(160deg,hsl(var(--h,220) 65% 28%),hsl(var(--h,220) 60% 14%));border:1px solid hsl(var(--h,220) 95% 62%/.6);box-shadow:0 0 12px hsl(var(--h,220) 95% 55%/.3),inset 0 1px 0 rgba(255,255,255,.18);text-shadow:0 0 10px hsl(var(--h,220) 100% 70%/.8)}
.cell.shake{background:#4a1a2c;box-shadow:0 0 18px rgba(255,77,109,.7)}
.target b.bump{animation:bump .25s ease-out}
@keyframes bump{0%{transform:scale(1.5)}100%{transform:scale(1)}}
.bar{box-shadow:0 0 12px rgba(77,225,255,.2)}
.bar i{box-shadow:0 0 12px rgba(255,204,51,.7)}
.pt{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:15;box-shadow:0 0 8px currentColor;animation:pt .6s ease-out forwards}
@keyframes pt{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.grade{animation:gp 1.6s ease-in-out infinite}
@keyframes gp{50%{transform:scale(1.08)}}
.stat{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));backdrop-filter:blur(6px)}
@media (prefers-reduced-motion:reduce){body,h1,.grade{animation:none}}
</style>
</head>
<body>
<div id="app">
  <section id="menu" class="screen on">
    <div class="brand">TJ GAMES</div>
    <h1>1부터 순서대로!</h1>
    <p class="desc">숫자를 순서대로 가장 빨리 터치하세요</p>
    <div class="menu" id="levels"></div>
  </section>

  <section id="game" class="screen">
    <div class="hud">
      <div><span>TIME</span><b id="time">0.000</b></div>
      <div style="align-items:center"><span>PROGRESS</span><b id="prog">0 / 0</b></div>
      <div style="align-items:flex-end"><span>COMBO</span><b id="cmb">0</b></div>
    </div>
    <div class="bar"><i id="barfill"></i></div>
    <div class="target"><span>NEXT</span><b id="next">1</b></div>
    <div id="wrap">
      <div id="combo"></div>
      <div id="grid"></div>
      <div id="miss"></div>
    </div>
  </section>

  <section id="result" class="screen">
    <div class="brand">RESULT · <span id="rlv"></span></div>
    <div class="grade" id="grade">S</div>
    <div class="record" id="rec"></div>
    <div class="big" id="rtime">0.000초</div>
    <div class="desc" id="rnote" style="margin:4px 0 0"></div>
    <div class="stats">
      <div class="stat"><span>평균 클릭 시간</span><b id="ravg">-</b></div>
      <div class="stat"><span>가장 빠른 클릭</span><b id="rbest">-</b></div>
      <div class="stat"><span>MISS</span><b id="rmiss">0</b></div>
      <div class="stat"><span>최고 콤보</span><b id="rcombo">0</b></div>
      <div class="stat" style="grid-column:span 2"><span>난이도 최고 기록</span><b id="rpb">-</b></div>
    </div>
    <div class="row">
      <button class="btn main" id="again">다시하기</button>
      <button class="btn" id="change">난이도 변경</button>
    </div>
  </section>
</div>
<div id="count"><span id="cnum">3</span></div>

<script>
(function(){
  var LEVELS={
    EASY:{n:4,label:"EASY",desc:"1~16 · 4×4",g:[8,11,15,20,28]},
    NORMAL:{n:5,label:"NORMAL",desc:"1~25 · 5×5",g:[15,20,27,36,50]},
    HARD:{n:6,label:"HARD",desc:"1~36 · 6×6",g:[28,38,50,65,90]},
    INSANE:{n:7,label:"INSANE",desc:"1~49 · 7×7",g:[45,60,80,105,140]}
  };
  var GR=["S","A","B","C","D"],GC={S:"#ffcc33",A:"#5dff9d",B:"#4de1ff",C:"#b69cff",D:"#ff9f6b",F:"#ff4d6d"};
  var $=function(id){return document.getElementById(id)};
  var S={lv:null,total:0,next:1,state:"menu",start:0,last:0,miss:0,combo:0,maxCombo:0,clicks:[],raf:0,timers:[],lastTapTime:0};

  function show(id){["menu","game","result"].forEach(function(s){$(s).classList.toggle("on",s===id)})}
  function key(lv){return"tjgames_seq_best_"+lv}
  function getBest(lv){try{var v=parseFloat(localStorage.getItem(key(lv)));return isNaN(v)?null:v}catch(e){return null}}
  function setBest(lv,v){try{localStorage.setItem(key(lv),String(v))}catch(e){}}
  function fmt(ms){return(ms/1000).toFixed(3)}
  function clearTimers(){S.timers.forEach(clearTimeout);S.timers=[];cancelAnimationFrame(S.raf)}

  function buildMenu(){
    var box=$("levels");box.innerHTML="";
    Object.keys(LEVELS).forEach(function(k){
      var L=LEVELS[k],b=getBest(k),el=document.createElement("button");
      el.className="btn";
      el.innerHTML="<span>"+L.label+"</span><small>"+L.desc+"<br>BEST "+(b===null?"-":fmt(b)+"초")+"</small>";
      el.addEventListener("click",function(){begin(k)});
      box.appendChild(el);
    });
  }

  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

  function begin(k){
    clearTimers();
    var L=LEVELS[k];
    S.lv=k;S.total=L.n*L.n;S.next=1;S.miss=0;S.combo=0;S.maxCombo=0;S.clicks=[];S.state="count";
    var nums=[];for(var i=1;i<=S.total;i++)nums.push(i);
    shuffle(nums);
    var grid=$("grid");grid.innerHTML="";
    grid.style.gridTemplateColumns="repeat("+L.n+",1fr)";
    grid.style.gridTemplateRows="repeat("+L.n+",1fr)";
    grid.style.setProperty("--fs",(L.n===4?"9":L.n===5?"8":L.n===6?"6.6":"5.6")+"vmin");
    nums.forEach(function(n){
      var c=document.createElement("button");
      c.className="cell";c.textContent=n;c.style.setProperty("--h",(n*47)%360);c.dataset.n=n;
      c.addEventListener("pointerdown",function(e){e.preventDefault();tap(c,n)});
      c.addEventListener("click",function(e){e.preventDefault()});
      grid.appendChild(c);
    });
    $("time").textContent="0.000";$("cmb").textContent="0";$("next").textContent="1";
    $("prog").textContent="0 / "+S.total;$("barfill").style.width="0";
    show("game");
    countdown();
  }

  function countdown(){
    var seq=["3","2","1","GO!"],i=0,box=$("count"),num=$("cnum");
    box.classList.add("on");
    (function step(){
      num.style.animation="none";void num.offsetWidth;num.style.animation="";
      num.textContent=seq[i];
      num.style.color=seq[i]==="GO!"?"#5dff9d":"";
      i++;
      if(i<seq.length){S.timers.push(setTimeout(step,800))}
      else{S.timers.push(setTimeout(function(){
        box.classList.remove("on");
        S.state="play";S.start=S.last=performance.now();
        tick();
      },600))}
    })();
  }

  function tick(){
    if(S.state!=="play")return;
    $("time").textContent=fmt(performance.now()-S.start);
    S.raf=requestAnimationFrame(tick);
  }

  function tap(c,n){
    if(S.state!=="play"||c.classList.contains("done"))return;
    var now=performance.now();
    if(n===S.next){
      S.clicks.push(now-S.last);S.last=now;
      burst(c);
      c.classList.add("done");
      S.combo++;if(S.combo>S.maxCombo)S.maxCombo=S.combo;
      $("cmb").textContent=S.combo;
      if(S.combo%5===0)flash(S.combo+" COMBO!");
      S.next++;
      var d=S.next-1;
      $("prog").textContent=d+" / "+S.total;
      $("barfill").style.width=(d/S.total*100)+"%";
      if(S.next>S.total){finish(now-S.start)}
      else{var nx=$("next");nx.textContent=S.next;nx.classList.remove("bump");void nx.offsetWidth;nx.classList.add("bump")}
    }else{
      S.miss++;S.combo=0;$("cmb").textContent="0";
      c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");
      var m=$("miss");m.classList.add("on");
      S.timers.push(setTimeout(function(){m.classList.remove("on")},200));
      flashMiss();
    }
  }

  function burst(c){
    var r=c.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,h=c.style.getPropertyValue("--h");
    for(var i=0;i<10;i++){
      var p=document.createElement("i"),a=Math.PI*2*i/10+Math.random()*.5,d=30+Math.random()*40;
      p.className="pt";p.style.left=x-4+"px";p.style.top=y-4+"px";
      p.style.background="hsl("+((+h+i*20)%360)+" 100% 62%)";
      p.style.setProperty("--dx",Math.cos(a)*d+"px");p.style.setProperty("--dy",Math.sin(a)*d+"px");
      document.body.appendChild(p);
      setTimeout(function(q){q.remove()},650,p);
    }
  }
  function flash(t){var el=$("combo");el.style.color="";el.textContent=t;el.classList.remove("show");void el.offsetWidth;el.classList.add("show")}
  function flashMiss(){var el=$("combo");el.style.color="#ff4d6d";el.textContent="MISS!";el.classList.remove("show");void el.offsetWidth;el.classList.add("show")}

  function finish(total){
    S.state="end";cancelAnimationFrame(S.raf);
    $("time").textContent=fmt(total);
    $("next").textContent="✔";
    S.timers.push(setTimeout(function(){showResult(total)},600));
  }

  function gradeOf(total){
    var t=(total+S.miss*1000)/1000,g=LEVELS[S.lv].g;
    for(var i=0;i<g.length;i++){if(t<=g[i])return GR[i]}
    return"F";
  }

  function showResult(total){
    var L=LEVELS[S.lv],prev=getBest(S.lv),isNew=prev===null||total<prev;
    if(isNew)setBest(S.lv,total);
    var gr=gradeOf(total),ge=$("grade");
    ge.textContent=gr;ge.style.color=GC[gr];ge.style.textShadow="0 0 40px "+GC[gr]+"88";
    $("rlv").textContent=L.label;
    $("rec").textContent=isNew?"🎉 NEW RECORD!":"";
    $("rtime").textContent=fmt(total)+"초";
    $("rnote").textContent="등급 판정 "+fmt(total+S.miss*1000)+"초 (MISS 1회당 +1초)";
    var avg=total/S.total,best=Math.min.apply(null,S.clicks);
    $("ravg").textContent=fmt(avg)+"초";
    $("rbest").textContent=fmt(best)+"초";
    $("rmiss").textContent=S.miss+"회";
    $("rcombo").textContent=S.maxCombo;
    $("rpb").textContent=fmt(isNew?total:prev)+"초";
    show("result");
  }

  $("again").addEventListener("click",function(){begin(S.lv)});
  $("change").addEventListener("click",function(){clearTimers();S.state="menu";buildMenu();show("menu")});

  // 플레이 방해 동작 차단
  ["contextmenu","selectstart","dragstart","gesturestart"].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault()})});
  document.addEventListener("touchend",function(e){var n=Date.now();if(n-S.lastTapTime<350&&e.target.closest&&e.target.closest("#game"))e.preventDefault();S.lastTapTime=n},{passive:false});
  document.addEventListener("touchmove",function(e){if(e.touches.length>1)e.preventDefault()},{passive:false});

  buildMenu();
})();
</script>
</body>
</html>
