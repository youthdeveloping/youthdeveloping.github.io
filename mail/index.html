<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouthDeveloper Mail</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <div class="brand"><span class="logo">Y</span><span>YouthDeveloper Mail</span></div>
    <div class="top-actions"><button id="refreshBtn" class="icon-btn" title="새로고침">↻</button><button id="logoutBtn" class="ghost">로그아웃</button></div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <button id="composeBtn" class="compose">＋ 메일 쓰기</button>
      <nav id="folderNav">
        <button data-folder="inbox" class="nav-item active">받은메일 <b id="inboxCount"></b></button>
        <button data-folder="sent" class="nav-item">보낸메일</button>
        <button data-folder="trash" class="nav-item">휴지통</button>
      </nav>
      <div class="account-card"><div class="avatar" id="avatar">Y</div><div><strong id="accountName">사용자</strong><small id="accountEmail"></small></div></div>
    </aside>

    <section class="content">
      <div id="loginView" class="login-view">
        <div class="login-card">
          <div class="brand big"><span class="logo">Y</span><span>YouthDeveloper Mail</span></div>
          <p class="muted">YouthDeveloper 메일에 로그인하세요.</p>
          <form id="loginForm">
            <label>아이디<input id="loginId" autocomplete="username" required placeholder="아이디"></label>
            <label>비밀번호<input id="loginPw" type="password" autocomplete="current-password" required placeholder="비밀번호"></label>
            <button class="primary" type="submit">로그인</button>
          </form>
          <p id="loginMsg" class="message"></p>
          <div class="demo-note">현재는 화면과 데이터 흐름을 먼저 연결한 단계입니다. 실제 메일 서버가 연결되면 같은 화면에서 실계정으로 동작합니다.</div>
        </div>
      </div>

      <div id="mailView" class="mail-view hidden">
        <div class="toolbar">
          <div class="search"><span>⌕</span><input id="searchInput" placeholder="메일 검색"></div>
          <h1 id="folderTitle">받은메일</h1>
        </div>
        <div id="list" class="mail-list"></div>
        <div id="empty" class="empty hidden">메일이 없습니다.</div>
      </div>
    </section>
  </main>
</div>

<dialog id="composeDialog">
  <form method="dialog" id="composeForm" class="compose-card">
    <div class="dialog-head"><h2>메일 쓰기</h2><button value="cancel" class="icon-btn">×</button></div>
    <label>받는 사람<input id="toInput" type="email" required placeholder="recipient@example.com"></label>
    <label>제목<input id="subjectInput" required placeholder="제목"></label>
    <label>내용<textarea id="bodyInput" required rows="12" placeholder="내용을 입력하세요."></textarea></label>
    <div id="sendMsg" class="message"></div>
    <div class="dialog-actions"><button value="cancel" class="ghost">취소</button><button id="sendBtn" value="default" class="primary">보내기</button></div>
  </form>
</dialog>

<dialog id="readDialog">
  <article class="read-card">
    <div class="dialog-head"><div><div id="readFrom" class="muted"></div><h2 id="readSubject"></h2></div><button class="icon-btn" onclick="readDialog.close()">×</button></div>
    <div id="readMeta" class="read-meta"></div>
    <div id="readBody" class="read-body"></div>
    <div class="dialog-actions"><button id="deleteReadBtn" class="danger">휴지통으로</button><button class="ghost" onclick="readDialog.close()">닫기</button></div>
  </article>
</dialog>
<script src="./app.js"></script>
</body>
</html>
