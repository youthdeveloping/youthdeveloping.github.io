<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111318"><title>PdfCraft — YouthCraft</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111318;color:#eef1f6;font:13px/1.5 Inter,"Segoe UI","Noto Sans KR",sans-serif}button{border:1px solid #3d4554;background:#242a35;color:#eef1f6;border-radius:6px;padding:8px 11px;cursor:pointer}button:hover{border-color:#70e8bd}button.primary{background:#70e8bd;color:#0b1713;border-color:#70e8bd;font-weight:800}button:disabled{opacity:.4;cursor:not-allowed}header{height:50px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#191d26;border-bottom:1px solid #343b49}.brand{font-weight:900;font-size:16px}.brand span{color:#70e8bd}.head{margin-left:auto;display:flex;gap:6px;align-items:center}.head a{color:#9da8b9;text-decoration:none;margin-left:8px}.toolbar{height:46px;display:flex;gap:7px;align-items:center;padding:6px 10px;background:#1d222c;border-bottom:1px solid #343b49;overflow:auto;white-space:nowrap}.layout{height:calc(100% - 120px);display:grid;grid-template-columns:260px minmax(0,1fr)}aside{padding:12px;background:#191d26;border-right:1px solid #343b49;overflow:auto}.label{font-size:10px;color:#aab5c6;letter-spacing:.15em;margin:4px 0 10px}.pages{display:grid;gap:6px}.page{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid #343b49;border-radius:6px;background:#202631;cursor:grab}.page.active{border-color:#70e8bd;background:#1d302b}.page b{font-size:11px}.page span{font-size:10px;color:#9da8b9}.viewer{display:flex;flex-direction:column;min-width:0;min-height:0}.viewhead{height:35px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#202631;border-bottom:1px solid #343b49;color:#aeb8c8;font-size:11px}.viewhead strong{color:#eef1f6}.preview{flex:1;min-height:0;background:#252a34}.preview iframe{width:100%;height:100%;border:0;background:white}.status{height:24px;padding:4px 10px;background:#191d26;border-top:1px solid #343b49;color:#a3adbd;font-size:10px}.empty{height:100%;display:grid;place-items:center;color:#9da8b9;text-align:center;padding:30px}.info{font-size:11px;color:#9da8b9;line-height:1.7;margin-top:12px}.stat{padding:9px;border:1px solid #343b49;border-radius:6px;margin:10px 0;color:#c4ccd8;font-size:11px}.hidden{display:none!important}@media(max-width:700px){.layout{grid-template-columns:140px minmax(0,1fr)}aside{padding:7px}.toolbar{height:42px}.head a{display:none}.head button{font-size:10px;padding:6px}.page{padding:5px;gap:4px}.page span{display:none}}
</style><script src="/device-layout.js" defer></script><link rel="stylesheet" href="/youthcraft/photoshop-ui.css">
</head><body>
<header><a class="brand" href="/youthcraft/" style="color:inherit;text-decoration:none">Youth<span>Craft</span> / PdfCraft</a><div class="head"><span id="docName">PDF 문서를 열어 주세요</span><button id="open" class="primary">PDF 열기</button><a href="/youthcraft/">모든 도구</a></div></header>
<div class="toolbar"><button id="add">PDF 추가 / 병합</button><button id="rotateLeft" disabled>↶ 90°</button><button id="rotateRight" disabled>↷ 90°</button><button id="delete" disabled>페이지 삭제</button><button id="split" disabled>선택 페이지 분리</button><button id="export" class="primary" disabled>PDF 저장</button><button id="print" disabled>인쇄</button></div>
<div class="layout"><aside><div class="label">DOCUMENT PAGES</div><div class="stat" id="stats">문서가 없습니다.</div><div class="pages" id="pages"></div><p class="info">페이지 목록을 끌어 순서를 바꿀 수 있습니다. 여러 PDF를 추가하면 현재 문서 뒤에 합쳐집니다. 페이지 회전·삭제·분리 후 새 PDF로 저장할 수 있습니다.</p><p class="info">원본 PDF는 브라우저에서만 처리합니다. 암호화·DRM이 적용된 문서는 열리지 않을 수 있습니다.</p></aside>
<main class="viewer"><div class="viewhead"><strong id="viewTitle">미리보기</strong><span id="pageInfo">페이지 선택 대기</span><span style="margin-left:auto">PDF VIEWER</span></div><div class="preview" id="preview"><div class="empty">PDF 파일을 열어 주세요.</div></div><div class="status" id="status">로컬 PDF 작업 공간 · 파일은 서버로 전송되지 않습니다.</div></main></div>
<input id="files" type="file" accept="application/pdf,.pdf" multiple hidden>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),PDF=window.PDFLib;
let doc=null,selected=0,fileName='document.pdf',url=null,dragIndex=-1;
function say(s){$('status').textContent=s}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1200)}
function buttons(on){['rotateLeft','rotateRight','delete','split','export','print'].forEach(k=>$(k).disabled=!on)}
function renderPages(){const pages=$('pages');pages.replaceChildren();if(!doc){$('stats').textContent='문서가 없습니다.';buttons(false);return}const list=doc.getPages();$('stats').textContent=list.length+' 페이지 · 선택 '+(selected+1)+' 페이지';list.forEach((p,i)=>{const row=document.createElement('div');row.className='page'+(i===selected?' active':'');row.draggable=true;const b=document.createElement('b');b.textContent='PAGE '+String(i+1).padStart(2,'0');const s=document.createElement('span');s.textContent='회전 '+p.getRotation().angle+'°';row.append(b,s);row.onclick=()=>selectPage(i);row.ondragstart=e=>{dragIndex=i;e.dataTransfer.setData('text/plain',String(i))};row.ondragover=e=>e.preventDefault();row.ondrop=async e=>{e.preventDefault();const from=dragIndex,to=i;if(from<0||from===to)return;try{const copied=await doc.copyPages(doc,[from]);doc.removePage(from);doc.insertPage(to,copied[0]);selected=to;await refresh()}catch(err){say('페이지 순서를 바꾸지 못했습니다: '+err.message)}};pages.append(row)});buttons(true);$('pageInfo').textContent='총 '+list.length+' 페이지 · '+(selected+1)+' 페이지 선택'}
async function refresh(){renderPages();await preview()}
async function preview(){if(!doc)return;try{const bytes=await doc.save();const blob=new Blob([bytes],{type:'application/pdf'});if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);$('preview').replaceChildren();const frame=document.createElement('iframe');frame.src=url+'#page='+(selected+1)+'&toolbar=1';frame.title='PDF 문서 미리보기';$('preview').append(frame);$('docName').textContent=fileName;$('viewTitle').textContent=fileName}catch(e){say('미리보기를 만들지 못했습니다: '+e.message)}}
function selectPage(i){selected=i;renderPages();$('pageInfo').textContent='총 '+doc.getPageCount()+' 페이지 · '+(i+1)+' 페이지 선택';preview()}
async function loadFiles(files,merge){if(!PDF){say('PDF 처리 모듈을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');return}const list=[...files].filter(f=>f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf'));if(!list.length)return;try{for(const f of list){const bytes=await f.arrayBuffer();const incoming=await PDF.PDFDocument.load(bytes);if(!doc||!merge){doc=incoming;fileName=f.name}else{const copied=await doc.copyPages(incoming,incoming.getPageIndices());copied.forEach(p=>doc.addPage(p));fileName='merged-document.pdf'}}selected=0;await refresh();say(list.length+'개 PDF를 불러왔습니다.')}catch(e){say('PDF를 열지 못했습니다: '+e.message)}}
$('open').onclick=()=>$('files').click();$('add').onclick=()=>$('files').click();$('files').onchange=e=>{loadFiles(e.target.files,!!doc);e.target.value=''};
$('rotateLeft').onclick=async()=>{if(!doc)return;const p=doc.getPages()[selected];p.setRotation(PDF.degrees((p.getRotation().angle+270)%360));await refresh();say('선택한 페이지를 왼쪽으로 회전했습니다.')};
$('rotateRight').onclick=async()=>{if(!doc)return;const p=doc.getPages()[selected];p.setRotation(PDF.degrees((p.getRotation().angle+90)%360));await refresh();say('선택한 페이지를 오른쪽으로 회전했습니다.')};
$('delete').onclick=async()=>{if(!doc)return;if(doc.getPageCount()===1){say('마지막 페이지는 삭제할 수 없습니다.');return}if(!confirm('선택한 페이지를 삭제하시겠습니까?'))return;doc.removePage(selected);selected=Math.min(selected,doc.getPageCount()-1);await refresh();say('페이지를 삭제했습니다.')};
$('split').onclick=async()=>{if(!doc)return;try{const out=await PDF.PDFDocument.create(),copied=await out.copyPages(doc,[selected]);copied.forEach(p=>out.addPage(p));download(new Blob([await out.save()],{type:'application/pdf'}),'pdfcraft-page-'+(selected+1)+'.pdf');say('선택한 페이지를 별도 PDF로 저장했습니다.')}catch(e){say('페이지 분리에 실패했습니다: '+e.message)}};
$('export').onclick=async()=>{if(!doc)return;try{download(new Blob([await doc.save()],{type:'application/pdf'}),fileName.replace(/\.pdf$/i,'')+'-edited.pdf');say('편집한 PDF를 저장했습니다.')}catch(e){say('PDF 저장에 실패했습니다: '+e.message)}};
$('print').onclick=()=>{const f=$('preview').querySelector('iframe');if(f)f.contentWindow.print()};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();$('export').click()}if(e.key==='Delete'&&doc&&document.activeElement.tagName!=='INPUT')$('delete').click()});
})();</script></body></html>
