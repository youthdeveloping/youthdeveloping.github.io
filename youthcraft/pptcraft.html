<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111114"><title>PPTCraft — YouthCraft</title><style>
:root{color-scheme:dark;--bg:#111114;--panel:#1b1b21;--line:#363640;--text:#f5f5f7;--muted:#a5a5b0;--accent:#79e4bd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,Arial,"Noto Sans KR",sans-serif}.top{height:48px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;color:var(--muted);font-size:11px;letter-spacing:.1em}.top a{color:var(--accent);text-decoration:none}.app{display:grid;grid-template-columns:240px minmax(0,1fr) 260px;min-height:calc(100vh - 48px)}aside{background:#17171c;padding:18px;border-right:1px solid var(--line)}aside.right{border-right:0;border-left:1px solid var(--line)}h1{font-size:22px;margin:0 0 4px}h2{font-size:12px;color:#bdbdc6;letter-spacing:.12em;margin:18px 0 9px}.muted{color:var(--muted);font-size:12px}button,select,input,textarea{font:inherit;color:inherit;background:#222229;border:1px solid #454550;border-radius:6px;padding:8px}button{cursor:pointer}button:hover{border-color:var(--accent);color:var(--accent)}.wide{width:100%;margin:4px 0}.main{padding:22px;min-width:0}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.workarea{background:#202027;border:1px solid var(--line);border-radius:10px;padding:18px;min-height:500px;display:flex;align-items:center;justify-content:center;overflow:auto}.status{font-size:11px;color:var(--muted);margin-top:10px}.field{display:grid;gap:5px;margin:10px 0;font-size:12px;color:#c7c7cf}.field input,.field select,.field textarea{width:100%}.accent{background:var(--accent);color:#111;border-color:var(--accent);font-weight:800}.slide{width:min(100%,800px);aspect-ratio:16/9;background:#fff;color:#20202a;padding:7%;box-shadow:0 12px 45px #0008;position:relative;display:flex;flex-direction:column;justify-content:center;overflow:hidden}.slide h3{font-size:clamp(22px,4vw,44px);margin:0 0 16px}.slide p{font-size:clamp(13px,2vw,21px);white-space:pre-wrap}.slide .num{position:absolute;right:20px;bottom:15px;font-size:12px;color:#777}.slides{display:flex;flex-direction:column;gap:8px}.thumb{padding:10px;text-align:left;font-size:12px}.thumb.active{border-color:var(--accent);color:var(--accent)}.editor{width:min(100%,850px);min-height:650px;background:#fff;color:#222;padding:48px;outline:none;border-radius:4px;line-height:1.8}.editor:focus{outline:2px solid var(--accent)}@media(max-width:900px){.app{grid-template-columns:190px minmax(0,1fr)}aside.right{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.main{padding:14px}}@media(max-width:620px){.app{display:flex;flex-direction:column}aside{border-right:0;border-bottom:1px solid var(--line)}.workarea{min-height:400px}.editor{padding:25px;min-height:500px}}

/* Full-screen desktop workspace: panels scroll independently, not the page. */
@media(min-width:901px){
 html,body{height:100%;overflow:hidden}
 .app{height:calc(100dvh - 48px);min-height:0;overflow:hidden}
 .app>aside{min-height:0;overflow-y:auto;overscroll-behavior:contain}
 .main{display:flex;flex-direction:column;min-height:0;overflow:hidden}
 .toolbar{flex:none}
 .workarea{flex:1;min-height:0;overflow:auto}
 .status{flex:none}
}

/* YouthDeveloper server-console visual system */
:root{--bg:#0b1018;--panel:#111a27;--line:#26364a;--text:#e7eef8;--muted:#8496ad;--accent:#55d6be;--accent2:#7aa7ff}
body{background:radial-gradient(ellipse at 50% -30%,#1c3045 0%,#0b1018 58%);color:var(--text);font-family:Inter,"Pretendard","Noto Sans KR",sans-serif}
.top{height:54px;background:#0d1521;border-bottom:1px solid #26394e;padding:0 22px;letter-spacing:.04em}
.top:before{content:"YD /";color:var(--accent);font-weight:900;margin-right:10px}
.top span{font-size:12px;color:#d9e7f7;font-weight:800}
.top a{padding:7px 11px;border:1px solid #30445c;border-radius:7px;background:#142234}
.app{grid-template-columns:230px minmax(0,1fr) 270px;background:#0c1420}
aside{background:linear-gradient(180deg,#111d2b,#0e1723);padding:17px;border-color:#27394d}
aside.right{background:#101a28}
h1{font-size:20px;letter-spacing:-.03em}
h2{font-size:10px;color:#6f91ad;letter-spacing:.16em;border-bottom:1px solid #26394d;padding-bottom:9px}
.muted,.status{color:#8499b1}
button,select,input,textarea{background:#162438;border:1px solid #30445b;border-radius:7px;color:#e5effa}
button{transition:background .15s,border-color .15s,transform .15s}
button:hover{background:#1d3449;border-color:var(--accent);color:#8ff2df}
.wide{min-height:36px}
.accent{background:linear-gradient(135deg,#55d6be,#62b9d5);border:0;color:#07151a}
.main{padding:15px 18px 10px;gap:10px}
.toolbar{background:#111d2b;border:1px solid #263b52;border-radius:10px;padding:9px;gap:6px;margin:0;box-shadow:0 8px 24px #0003}
.toolbar button{font-size:12px;padding:7px 10px}
.workarea{background-color:#111c2a;background-image:linear-gradient(#1b2a3a55 1px,transparent 1px),linear-gradient(90deg,#1b2a3a55 1px,transparent 1px);background-size:24px 24px;border:1px solid #2b4058;border-radius:10px;padding:28px}
.slide{border-radius:3px;box-shadow:0 22px 65px #0009;border:1px solid #d6dce5}
.status{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.02em}
.thumb{background:#152438;border-color:#2b4058}
.thumb.active{background:#183b43;border-color:var(--accent);color:#9cf5e5;box-shadow:inset 3px 0 var(--accent)}
.field{color:#a9bdd2}
.field input,.field select,.field textarea{background:#0c1725}
@media(min-width:901px){.app{height:calc(100dvh - 54px)}}
@media(max-width:900px){.app{grid-template-columns:190px minmax(0,1fr)}}

</style></head><body><div class="top"><span>YOUTHCRAFT / PRESENTATION SERVER · WORKSPACE</span><a href="/youthcraft/">← ALL CRAFTS</a></div>
<div class="app"><aside><h1 style="color:#f0a16c">PPTCraft</h1><div class="muted">Presentation Studio</div><h2>SLIDES</h2><div id="slideList" class="slides"></div><button class="wide accent" id="add">＋ 새 슬라이드</button><h2>THEME</h2><select id="theme" class="wide"><option value="#ffffff">Clean White</option><option value="#101827">Midnight</option><option value="#f5eee4">Warm Paper</option><option value="#e8f4ef">Fresh Mint</option></select></aside>
<main class="main"><div class="toolbar"><button id="titleLayout">Title slide</button><button id="contentLayout">Content slide</button><button id="duplicate">복제</button><button id="remove">삭제</button><button id="up">↑</button><button id="down">↓</button><button id="export" class="accent">PPTX 내보내기</button></div><div class="workarea"><div class="slide" id="preview"><h3>새 프레젠테이션</h3><p>오른쪽에서 제목과 내용을 입력하세요.</p><span class="num">01</span></div></div><div class="status" id="status">● PPT ENGINE · LOCAL WORKSPACE · 브라우저에서 편집됩니다. 내보내기는 PPTXGenJS 라이브러리를 사용합니다.</div></main>
<aside class="right"><h2>SLIDE CONTENT</h2><label class="field">제목<input id="heading" value="새 프레젠테이션"></label><label class="field">본문<textarea id="body" rows="8">오른쪽에서 제목과 내용을 입력하세요.</textarea></label><label class="field">제목 크기<input id="fontSize" type="range" min="20" max="54" value="38"></label><label class="field">강조 색상<input id="color" type="color" value="#f0a16c"></label><label class="field">발표자 노트<textarea id="notes" rows="4" placeholder="발표자 노트"></textarea></label><button class="wide" id="save">프로젝트 JSON 저장</button><label class="field">프로젝트 불러오기<input type="file" id="load" accept=".json,application/json"></label></aside></div>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script><script>
(()=>{let slides=[{title:"새 프레젠테이션",body:"오른쪽에서 제목과 내용을 입력하세요.",notes:"",bg:"#ffffff",size:38,color:"#f0a16c"}],at=0;const $=id=>document.getElementById(id);function draw(){let s=slides[at];$("slideList").innerHTML=slides.map((x,i)=>'<button class="wide thumb '+(i===at?'active':'')+'" data-i="'+i+'">'+String(i+1).padStart(2,"0")+'　'+esc(x.title||"제목 없음")+'</button>').join("");$("slideList").querySelectorAll("button").forEach(b=>b.onclick=()=>{sync();at=+b.dataset.i;draw()});$("heading").value=s.title;$("body").value=s.body;$("notes").value=s.notes;$("fontSize").value=s.size;$("color").value=s.color;$("theme").value=s.bg;$("preview").style.background=s.bg;$("preview").style.color=s.bg==="#101827"?"#fff":"#20202a";$("preview").innerHTML='<h3 style="font-size:'+s.size+'px;color:'+s.color+'">'+esc(s.title)+'</h3><p>'+esc(s.body).replace(/\n/g,"<br>")+'</p><span class="num">'+String(at+1).padStart(2,"0")+'</span>'}function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function sync(){let s=slides[at];s.title=$("heading").value;s.body=$("body").value;s.notes=$("notes").value;s.size=+$("fontSize").value;s.color=$("color").value;s.bg=$("theme").value}["heading","body","notes","fontSize","color","theme"].forEach(id=>$(id).addEventListener("input",()=>{sync();drawPreview()}));function drawPreview(){let s=slides[at];$("preview").style.background=s.bg;$("preview").style.color=s.bg==="#101827"?"#fff":"#20202a";$("preview").innerHTML='<h3 style="font-size:'+s.size+'px;color:'+s.color+'">'+esc(s.title)+'</h3><p>'+esc(s.body).replace(/\n/g,"<br>")+'</p><span class="num">'+String(at+1).padStart(2,"0")+'</span>'} $("add").onclick=()=>{sync();slides.push({title:"새 슬라이드",body:"핵심 내용을 입력하세요.",notes:"",bg:"#ffffff",size:34,color:"#f0a16c"});at=slides.length-1;draw()};$("remove").onclick=()=>{if(slides.length===1)return;slides.splice(at,1);at=Math.max(0,at-1);draw()};$("duplicate").onclick=()=>{sync();slides.splice(at+1,0,{...slides[at]});at++;draw()};$("up").onclick=()=>{if(at){sync();[slides[at-1],slides[at]]=[slides[at],slides[at-1]];at--;draw()}};$("down").onclick=()=>{if(at<slides.length-1){sync();[slides[at+1],slides[at]]=[slides[at],slides[at+1]];at++;draw()}};$("titleLayout").onclick=()=>{$("heading").value="발표 제목";$("body").value="부제목 또는 발표자";sync();drawPreview()};$("contentLayout").onclick=()=>{$("heading").value="핵심 주제";$("body").value="• 첫 번째 핵심 내용\n• 두 번째 핵심 내용\n• 정리 및 다음 단계";sync();drawPreview()};$("save").onclick=()=>{sync();let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({slides},null,2)],{type:"application/json"}));a.download="pptcraft-project.json";a.click();URL.revokeObjectURL(a.href)};$("load").onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.slides)||!d.slides.length)throw 0;slides=d.slides;at=0;draw()}catch{alert("올바른 PPTCraft 프로젝트 파일이 아닙니다.")}};$("export").onclick=async()=>{sync();if(!window.PptxGenJS){$("status").textContent="PPTX 내보내기 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.";return}try{let pptx=new PptxGenJS();pptx.layout="LAYOUT_WIDE";pptx.author="YouthDeveloper";pptx.subject="YouthCraft PPTCraft";slides.forEach(s=>{let sl=pptx.addSlide();sl.background={color:s.bg.replace("#","")};sl.addText(s.title,{x:.8,y:1.2,w:11.7,h:1.1,fontFace:"Aptos",fontSize:s.size,bold:true,color:s.color.replace("#",""),breakLine:false,fit:"shrink"});sl.addText(s.body,{x:.9,y:2.6,w:11.4,h:3.7,fontFace:"Aptos",fontSize:22,color:s.bg==="#101827"?"FFFFFF":"252530",breakLine:false,fit:"shrink",bullet:false});if(s.notes)sl.addNotes(s.notes)});await pptx.writeFile({fileName:"YouthCraft-Presentation.pptx"});$("status").textContent="PPTX 파일을 만들었습니다."}catch(e){$("status").textContent="내보내기 실패: "+e.message}};draw()})();
</script></body></html>
