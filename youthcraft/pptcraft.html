<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101722"><title>PPTCraft — YouthDeveloper</title>
<style>
:root{color-scheme:dark;--bg:#101722;--bar:#172333;--panel:#1b293a;--panel2:#223247;--line:#30445b;--text:#eaf1f8;--muted:#94a8bd;--accent:#55d6be;--orange:#f0a16c}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{font:13px/1.45 Inter,"Segoe UI","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{background:#26384d;color:var(--text);border:1px solid #3a5069;border-radius:4px;padding:7px 10px;cursor:pointer}button:hover{border-color:var(--accent);background:#30465d}button.active,.primary{background:var(--accent);color:#09201d;border-color:var(--accent);font-weight:700}.top{height:34px;background:#0c131d;border-bottom:1px solid #26394e;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:12px}.brand{font-weight:800;letter-spacing:.04em}.brand b{color:var(--orange)}.top a{color:var(--muted);text-decoration:none}.tabs{height:35px;display:flex;align-items:stretch;background:#142031;border-bottom:1px solid var(--line);padding-left:12px;gap:3px}.tabs button{border:0;border-radius:0;background:transparent;padding:0 15px;color:#bac9d8}.tabs button.active{color:var(--accent);border-bottom:2px solid var(--accent);background:#1c2c40}.ribbon{height:88px;display:flex;align-items:stretch;gap:0;padding:7px 10px;background:#192638;border-bottom:1px solid var(--line);overflow-x:auto}.rgroup{display:flex;align-items:center;gap:5px;padding:0 12px;border-right:1px solid #35485e;flex:none}.rgroup:last-child{border:0}.rgroup .stack{display:grid;gap:4px}.rgroup button{min-width:45px;min-height:29px}.rgroup label{font-size:10px;color:var(--muted);display:grid;gap:3px}.rgroup input,.rgroup select{width:90px;background:#101a28;color:var(--text);border:1px solid #3a5069;padding:5px;border-radius:4px}.shell{height:calc(100dvh - 157px);display:grid;grid-template-columns:220px minmax(0,1fr) 245px;min-height:0}.left,.right{background:#142031;overflow:auto;min-height:0;padding:12px;border-right:1px solid var(--line)}.right{border-right:0;border-left:1px solid var(--line)}.panel-title{font-size:10px;letter-spacing:.13em;color:#8ba4bc;font-weight:800;margin:3px 0 10px}.slide-list{display:grid;gap:9px}.thumb{padding:6px;background:#1d2c3e;text-align:left}.thumb.active{border:1px solid var(--accent);box-shadow:inset 3px 0 var(--accent)}.mini{aspect-ratio:16/9;background:white;color:#222;padding:8px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}.mini strong{font-size:10px}.mini span{font-size:7px;white-space:pre-wrap}.thumb small{display:block;color:#9bb0c5;padding-top:5px}.addslide{width:100%;margin:10px 0}.center{display:flex;flex-direction:column;min-width:0;min-height:0;background:#0e1723}.centerbar{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--line);color:var(--muted);font-size:11px}.canvas-area{flex:1;min-height:0;display:grid;place-items:center;overflow:auto;padding:24px;background-color:#111d2b;background-image:linear-gradient(#23364a66 1px,transparent 1px),linear-gradient(90deg,#23364a66 1px,transparent 1px);background-size:24px 24px}.slide{width:min(100%,1100px);aspect-ratio:16/9;background:#fff;color:#202735;box-shadow:0 20px 60px #0009;position:relative;padding:7%;display:flex;flex-direction:column;justify-content:center;overflow:hidden}.slide [contenteditable]{outline:1px dashed transparent;white-space:pre-wrap}.slide [contenteditable]:focus{outline-color:#5c9cf5}.slide-title{font-size:clamp(25px,3.4vw,54px);font-weight:750;line-height:1.15;margin-bottom:22px}.slide-body{font-size:clamp(15px,1.7vw,27px);line-height:1.55}.slide-number{position:absolute;right:22px;bottom:16px;color:#7a8491;font-size:12px}.notes{height:82px;resize:none;width:100%;background:#152235;color:var(--text);border:0;border-top:1px solid var(--line);padding:10px 14px}.field{display:grid;gap:5px;margin:12px 0;color:#a9bdd2;font-size:11px}.field input,.field textarea,.field select{width:100%;background:#0d1826;border:1px solid #354b63;color:var(--text);border-radius:4px;padding:8px}.field textarea{resize:vertical}.status{height:22px;background:#0b131e;border-top:1px solid var(--line);padding:3px 10px;color:#8ca5bb;font-size:10px}
@media(max-width:900px){.shell{grid-template-columns:170px minmax(0,1fr)}.right{display:none}.ribbon{height:82px}.shell{height:calc(100dvh - 151px)}}@media(max-width:600px){.shell{grid-template-columns:104px minmax(0,1fr)}.left{padding:7px}.canvas-area{padding:8px}.rgroup{padding:0 7px}.tabs button{padding:0 9px}.slide-title{font-size:clamp(20px,5vw,34px)}.slide-body{font-size:clamp(12px,3vw,18px)}}
</style></head><body>
<header class="top"><div class="brand"><b>YC</b> / PPTCraft　 <span style="color:#8da3b9;font-weight:400">Presentation Studio</span></div><a href="/youthcraft/">← YouthCraft 홈</a></header>
<nav class="tabs"><button class="active" data-tab="home">홈</button><button data-tab="insert">삽입</button><button data-tab="design">디자인</button><button data-tab="view">보기</button><button data-tab="export">파일</button></nav>
<section class="ribbon" id="ribbon">
<div class="rgroup"><div class="stack"><button id="newSlide">＋ 새 슬라이드</button><button id="duplicate">슬라이드 복제</button></div><div class="stack"><button id="delete">삭제</button><button id="moveUp">위로 이동</button><button id="moveDown">아래로 이동</button></div></div>
<div class="rgroup"><label>글꼴 크기<input id="fontSize" type="number" min="12" max="96" value="38"></label><label>강조 색상<input id="accent" type="color" value="#f0a16c"></label><label>배경<select id="background"><option value="#ffffff">흰색</option><option value="#101827">미드나이트</option><option value="#f5eee4">웜 페이퍼</option><option value="#e8f4ef">민트</option></select></label></div>
<div class="rgroup"><button id="titleLayout">제목 레이아웃</button><button id="contentLayout">내용 레이아웃</button><button id="addText">텍스트 상자</button></div>
<div class="rgroup"><button id="saveJson">프로젝트 저장</button><button id="loadJson">프로젝트 열기</button><button class="primary" id="exportPptx">PPTX 내보내기</button><input id="file" type="file" accept="application/json" hidden></div></section>
<div class="shell"><aside class="left"><div class="panel-title">SLIDE NAVIGATOR</div><div id="slideList" class="slide-list"></div><button class="addslide" id="addSide">＋ 슬라이드 추가</button></aside>
<main class="center"><div class="centerbar"><span id="slideCount">슬라이드 1 / 1</span><span>16:9　·　편집 모드</span></div><div class="canvas-area"><article class="slide" id="slide"><div id="title" class="slide-title" contenteditable="true" spellcheck="true"></div><div id="body" class="slide-body" contenteditable="true" spellcheck="true"></div><span class="slide-number" id="number">01</span></article></div><textarea class="notes" id="notes" placeholder="발표자 노트 입력"></textarea></main>
<aside class="right"><div class="panel-title">FORMAT / 선택한 슬라이드</div><label class="field">슬라이드 제목<input id="titleInput"></label><label class="field">본문 내용<textarea id="bodyInput" rows="7"></textarea></label><label class="field">배경색<input id="bgInput" type="color" value="#ffffff"></label><label class="field">제목 색상<input id="titleColor" type="color" value="#f0a16c"></label><label class="field">제목 크기<input id="sizeInput" type="range" min="20" max="72" value="38"></label><div class="panel-title" style="margin-top:25px">PRESENTATION</div><p style="font-size:11px;color:#8299b0;line-height:1.7">슬라이드 안의 제목과 본문을 직접 클릭해 편집할 수도 있습니다. 프로젝트는 JSON으로 저장하고 PPTX로 내보낼 수 있습니다.</p></aside></div><div class="status" id="status">● LOCAL WORKSPACE　　변경 사항은 브라우저에서 처리됩니다.</div>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script><script>
(()=>{const $=id=>document.getElementById(id);let slides=[{title:"제목을 입력하세요",body:"부제목 또는 내용을 입력하세요.",notes:"",bg:"#ffffff",color:"#f0a16c",size:38}],at=0;const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));function sync(){let s=slides[at];s.title=$("titleInput").value;s.body=$("bodyInput").value;s.notes=$("notes").value;s.bg=$("bgInput").value;s.color=$("titleColor").value;s.size=+$("sizeInput").value;}function draw(){let s=slides[at];$("titleInput").value=s.title;$("bodyInput").value=s.body;$("notes").value=s.notes;$("bgInput").value=s.bg;$("background").value=s.bg;$("accent").value=s.color;$("titleColor").value=s.color;$("sizeInput").value=s.size;$("fontSize").value=s.size;$("title").textContent=s.title;$("body").textContent=s.body;$("slide").style.background=s.bg;$("slide").style.color=s.bg==="#101827"?"#f4f7fb":"#202735";$("title").style.color=s.color;$("title").style.fontSize="clamp(25px,"+(s.size/12)+"vw,"+s.size+"px)";$("number").textContent=String(at+1).padStart(2,"0");$("slideCount").textContent="슬라이드 "+(at+1)+" / "+slides.length;$("slideList").innerHTML=slides.map((x,i)=>'<button class="thumb '+(i===at?"active":"")+'" data-i="'+i+'"><div class="mini"><strong>'+esc(x.title)+'</strong><span>'+esc(x.body.slice(0,100))+'</span></div><small>'+String(i+1).padStart(2,"0")+'　'+esc(x.title.slice(0,22))+'</small></button>').join("");$("slideList").querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{sync();at=+b.dataset.i;draw()});}function updateFromInputs(){sync();$("title").textContent=slides[at].title;$("body").textContent=slides[at].body;$("slide").style.background=slides[at].bg;$("title").style.color=slides[at].color;$("title").style.fontSize=slides[at].size+"px";$("number").textContent=String(at+1).padStart(2,"0");$("slideList").querySelectorAll("small").forEach((n,i)=>n.textContent=String(i+1).padStart(2,"0")+"　"+slides[i].title.slice(0,22));}
["titleInput","bodyInput","notes","bgInput","titleColor","sizeInput"].forEach(id=>$(id).addEventListener("input",updateFromInputs));$("title").addEventListener("input",()=>{$("titleInput").value=$("title").textContent;updateFromInputs()});$("body").addEventListener("input",()=>{$("bodyInput").value=$("body").textContent;updateFromInputs()});$("background").onchange=e=>{$("bgInput").value=e.target.value;updateFromInputs()};$("accent").onchange=e=>{$("titleColor").value=e.target.value;updateFromInputs()};$("fontSize").onchange=e=>{$("sizeInput").value=e.target.value;updateFromInputs()};function add(){sync();slides.push({title:"새 슬라이드",body:"핵심 내용을 입력하세요.",notes:"",bg:"#ffffff",color:"#f0a16c",size:34});at=slides.length-1;draw()}$("newSlide").onclick=$("addSide").onclick=add;$("duplicate").onclick=()=>{sync();slides.splice(at+1,0,{...slides[at]});at++;draw()};$("delete").onclick=()=>{if(slides.length<2)return;slides.splice(at,1);at=Math.max(0,at-1);draw()};$("moveUp").onclick=()=>{if(at>0){sync();[slides[at-1],slides[at]]=[slides[at],slides[at-1]];at--;draw()}};$("moveDown").onclick=()=>{if(at<slides.length-1){sync();[slides[at+1],slides[at]]=[slides[at],slides[at+1]];at++;draw()}};$("titleLayout").onclick=()=>{$("titleInput").value="발표 제목";$("bodyInput").value="부제목을 입력하세요";updateFromInputs()};$("contentLayout").onclick=()=>{$("titleInput").value="핵심 주제";$("bodyInput").value="첫 번째 핵심 내용\n두 번째 핵심 내용\n정리 및 다음 단계";updateFromInputs()};$("addText").onclick=()=>{$("bodyInput").value+="\n새 텍스트";updateFromInputs();$("body").focus()};$("saveJson").onclick=()=>{sync();download(JSON.stringify({version:1,slides},null,2),"pptcraft-project.json","application/json")};function download(data,name,type){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$("loadJson").onclick=()=>$("file").click();$("file").onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.slides)||!d.slides.length)throw Error();slides=d.slides;at=0;draw()}catch{$("status").textContent="프로젝트 파일을 읽지 못했습니다."}};$("exportPptx").onclick=async()=>{sync();if(!window.PptxGenJS){$("status").textContent="PPTX 라이브러리 로딩 실패 — 인터넷 연결을 확인하세요.";return}try{let p=new PptxGenJS();p.layout="LAYOUT_WIDE";p.author="YouthDeveloper";slides.forEach(s=>{let sl=p.addSlide();sl.background={color:s.bg.slice(1)};sl.addText(s.title,{x:.8,y:1.15,w:11.5,h:1.2,fontSize:s.size,bold:true,color:s.color.slice(1),fit:"shrink"});sl.addText(s.body,{x:.9,y:2.7,w:11.2,h:3.6,fontSize:22,color:s.bg==="#101827"?"FFFFFF":"202735",breakLine:false,fit:"shrink"});if(s.notes)sl.addNotes(s.notes)});await p.writeFile({fileName:"YouthCraft-Presentation.pptx"});$("status").textContent="PPTX 내보내기가 완료되었습니다."}catch(e){$("status").textContent="내보내기 오류: "+e.message}};document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));$("status").textContent=b.dataset.tab.toUpperCase()+" ribbon selected"});draw()})();
</script></body></html>
