<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e9edf2"><title>PPTCraft — YouthDeveloper</title>
<style>
:root{--ui:#f4f5f7;--panel:#fff;--line:#d7dce2;--ink:#252a31;--muted:#66717d;--accent:#d84b2b;--blue:#2878c8}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font:13px "Segoe UI","Malgun Gothic","Noto Sans KR",sans-serif;color:var(--ink);background:#e8edf2}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #4a91dc;outline-offset:1px}
#titlebar{height:34px;background:#f0f2f5;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid #d9dee4}#appmark{font-weight:800;color:#d64b2c;font-size:17px}#docname{min-width:130px;color:#424a54}#saveState{color:#6b7783;font-size:11px}#titlebar .spacer{flex:1}#titlebar button{border:1px solid transparent;background:transparent;padding:5px 9px;border-radius:4px}#titlebar button:hover{background:#e4e8ed}#titlebar .share{background:#c94327;color:white}

#ribbon{height:126px;background:#fff;border-bottom:1px solid #cdd3da;display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;padding:6px 8px;gap:0;scrollbar-width:thin}.rg{position:relative;display:flex;align-items:stretch;gap:5px;padding:2px 9px 17px;border-right:1px solid #e0e3e7;flex:none}.groupbody{display:flex;flex-direction:row;align-items:stretch;gap:5px;min-width:max-content}.groupbody>.rb{flex:none}.groupbody>.rstack{align-self:center}.rg:last-child{border:0}.rgname{position:absolute;bottom:2px;left:0;right:0;text-align:center;color:#7c8792;font-size:10px}.rb{min-width:48px;height:75px;padding:5px 6px;border:1px solid transparent;border-radius:4px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.rb:hover,.rb.active{background:#f2f5f8;border-color:#cbd5df}.rb .ico{font-size:23px;line-height:26px;color:#4b657e}.rb small{font-size:10px;white-space:nowrap}.rb.large{min-width:60px}.rb.large .ico{font-size:29px}.rstack{display:flex;flex-direction:column;gap:3px}.rstack button{min-width:85px;height:30px;border:1px solid #d7dce2;background:#fafbfc;border-radius:3px;text-align:left;padding:0 8px;font-size:11px}.rstack button:hover{background:#eef3f8;border-color:#9eafbf}.rctl{display:flex;flex-direction:column;gap:4px;font-size:10px;color:#68737e;min-width:72px}.rctl input,.rctl select{height:27px;min-width:65px;border:1px solid #cbd2d9;border-radius:3px;background:#fff;padding:3px 5px;color:#303942}.rctl input[type=color]{height:29px;padding:2px;width:44px}
#workspace{height:calc(100dvh - 195px);display:grid;grid-template-columns:220px minmax(300px,1fr) 230px;min-height:0}#left,#right{background:#f6f7f9;overflow:auto;padding:12px;border-right:1px solid #d2d8df}#right{border-right:0;border-left:1px solid #d2d8df}.panehead{font-size:11px;font-weight:700;color:#56616c;margin:2px 0 12px;letter-spacing:.06em}.slide-list{display:grid;gap:9px}.thumb{padding:6px;background:#fff;border:1px solid #cbd2da;border-radius:4px;text-align:left}.thumb.active{border:2px solid #d44a2c;padding:5px}.mini{aspect-ratio:16/9;background:#fff;color:#222;border:1px solid #e3e5e8;padding:8px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}.mini b{font-size:9px}.mini span{font-size:7px;white-space:pre-wrap}.thumb-label{font-size:10px;color:#59636e;padding-top:5px}.addslide{width:100%;margin-top:10px;padding:8px;border:1px dashed #aeb8c2;border-radius:4px;background:#fff}.addslide:hover{border-color:#d44a2c}
#center{min-width:0;min-height:0;display:flex;flex-direction:column;background:#e9edf2}.workbar{height:30px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:#6b7681;font-size:10px;background:#f0f2f5;border-bottom:1px solid #d7dce2}.stage{flex:1;min-height:0;overflow:auto;display:grid;place-items:center;padding:28px;background:#e7ebf0}.slide{width:min(100%,1200px);aspect-ratio:16/9;position:relative;background:#fff;color:#202a34;box-shadow:0 2px 9px #2432442a;padding:7.2%;display:flex;flex-direction:column;justify-content:center;overflow:hidden}.slideTitle,.slideBody{outline:1px dashed transparent;white-space:pre-wrap;overflow-wrap:anywhere;min-width:20px;direction:ltr;unicode-bidi:isolate;text-align:left;writing-mode:horizontal-tb;display:block;word-break:normal;line-break:normal}.slideTitle[contenteditable=true],.slideBody[contenteditable=true]{caret-color:#1b66b1;user-select:text}.slideImages{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px;margin-top:12px;pointer-events:none}.slideImages img{display:block;max-width:min(65%,520px);max-height:210px;object-fit:contain}.slideTitle{font-size:clamp(24px,3.2vw,54px);font-weight:700;line-height:1.18;margin:0 0 22px}.slideBody{font-size:clamp(14px,1.7vw,27px);line-height:1.5;min-height:1.5em}.slideTitle:focus,.slideBody:focus{outline:1px solid #7aa9dc;background:#ffffff20}.slideNo{position:absolute;right:22px;bottom:14px;color:#87919b;font-size:11px}.notes{height:65px;flex:none;resize:vertical;min-height:45px;max-height:150px;border:0;border-top:1px solid #d1d7de;background:#f8f9fb;padding:9px 12px;color:#39434d}.status{height:23px;flex:none;background:#f3f5f7;border-top:1px solid #d1d7de;padding:4px 10px;color:#6b7782;font-size:10px}
.prop{display:grid;gap:5px;margin:11px 0;font-size:10px;color:#68737e}.prop input,.prop textarea,.prop select{width:100%;border:1px solid #cbd2d9;border-radius:3px;background:#fff;padding:7px;color:#27313b}.prop textarea{resize:vertical}.prop input[type=color]{height:30px;padding:2px}.hint{font-size:10px;line-height:1.6;color:#7b8792}
#modal{position:fixed;inset:0;background:#0008;z-index:20;display:none;place-items:center;padding:20px}#modal.open{display:grid}.dialog{width:min(850px,95vw);max-height:90vh;overflow:auto;background:#fff;border-radius:8px;box-shadow:0 18px 60px #0005;padding:18px}.dialoghead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.dialog button{border:1px solid #ccd3da;background:#f5f6f8;padding:7px 11px;border-radius:4px}.dialoggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px}.themeCard{border:1px solid #cbd2da;border-radius:5px;padding:7px;background:#fafafa;text-align:left}.themePreview{height:65px;margin-bottom:6px;display:flex;align-items:center;justify-content:center;font-weight:bold}
#show{position:fixed;inset:0;background:#080b10;z-index:50;display:none;place-items:center;color:white}#show.open{display:grid}#showSlide{width:min(92vw,150vh);aspect-ratio:16/9;background:#fff;color:#222;padding:7%;display:flex;flex-direction:column;justify-content:center}#showSlide h1{font-size:5vw;margin:0 0 3vh}#showSlide p{font-size:2.2vw;white-space:pre-wrap}#showHelp{position:fixed;bottom:12px;color:#bbb;font-size:12px}
@media(max-width:1050px){#workspace{grid-template-columns:150px minmax(0,1fr)}#right{display:none}}@media(max-width:650px){#workspace{grid-template-columns:95px minmax(0,1fr)}#left{padding:6px}.stage{padding:8px}.rb{min-width:43px}.rg{padding-left:5px;padding-right:5px}.slide{padding:6%}.slideTitle{font-size:clamp(18px,5vw,32px)}.slideBody{font-size:clamp(12px,3vw,18px)}}
</style><script src="/device-layout.js" defer></script>
</head><body>
<header id="titlebar"><span id="appmark">P</span><span id="docname">프레젠테이션 1</span><span id="saveState">자동 저장 준비</span><span class="spacer"></span><button id="undoTop" title="실행 취소">↶</button><button id="redoTop" title="다시 실행">↷</button><button id="saveTop">저장</button><button class="share" id="exportTop">내보내기</button></header>

<section id="ribbon"></section>
<div id="workspace"><aside id="left"><div class="panehead">슬라이드 탐색</div><div id="thumbs" class="slide-list"></div><button class="addslide" id="addSlide">＋ 새 슬라이드</button></aside>
<main id="center"><div class="workbar"><span id="slideCount">슬라이드 1 / 1</span><span>와이드스크린 (16:9)</span><span id="zoomLabel">100%</span></div><div class="stage"><article class="slide" id="slide"><h1 id="slideTitle" class="slideTitle" contenteditable="true" dir="ltr" spellcheck="true">제목을 입력하려면 클릭하십시오.</h1><div id="slideBody" class="slideBody" contenteditable="true" dir="ltr" spellcheck="true">부제목을 입력하십시오.</div><div id="slideImages" class="slideImages" aria-label="삽입된 이미지"></div><span class="slideNo" id="slideNo">1</span></article></div><textarea class="notes" id="notes" placeholder="여기에 슬라이드 노트의 내용을 입력하십시오"></textarea><div class="status" id="status">슬라이드 편집 준비 완료 · 텍스트를 클릭하여 입력하세요.</div></main>
<aside id="right"><div class="panehead">서식 / 슬라이드 속성</div><label class="prop">슬라이드 제목<input id="titleField"></label><label class="prop">본문<textarea id="bodyField" rows="5"></textarea></label><label class="prop">배경 색상<input id="bgField" type="color"></label><label class="prop">제목 색상<input id="colorField" type="color"></label><label class="prop">제목 크기<input id="sizeField" type="range" min="20" max="72"></label><label class="prop">본문 크기<input id="bodySizeField" type="range" min="12" max="40"></label><div class="panehead">슬라이드 정보</div><p class="hint">텍스트는 슬라이드에서 직접 입력하거나 오른쪽 속성에서 수정할 수 있습니다. 한국어 입력 중 커서가 튀거나 글자가 뒤집히지 않도록 편집 중인 요소를 다시 그리지 않습니다.</p></aside></div>
<input id="projectFile" type="file" accept=".json,application/json" hidden><input id="imageFile" type="file" accept="image/*" hidden>
<div id="modal"><div class="dialog"><div class="dialoghead"><b id="dialogTitle">디자인</b><button id="closeDialog">닫기</button></div><div id="dialogContent"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),ribbon=$('ribbon'),tabs=[...document.querySelectorAll('#tabs button')];
const themes={office:{bg:'#ffffff',title:'#202a34',body:'#28323d',accent:'#d64b2c',font:'Aptos'},dark:{bg:'#172432',title:'#f5f7fa',body:'#dce5ed',accent:'#63d7bd',font:'Aptos'},warm:{bg:'#f5efe5',title:'#654a35',body:'#4d4036',accent:'#b87845',font:'Georgia'},mint:{bg:'#e9f5ef',title:'#245d4e',body:'#2d5147',accent:'#3c9b7c',font:'Aptos'},blue:{bg:'#edf3fa',title:'#1c4168',body:'#314e6c',accent:'#387dc2',font:'Aptos'}};
let slides=[fresh()],idx=0,history=[],future=[],activeTab='home',dirty=false,autosaveTimer=null,editSession=false,editSessionTimer=null,savedRange=null,isComposing=false,transition='없음',animation='나타내기',showIndex=0;
function fresh(){return {title:'제목을 입력하려면 클릭하십시오.',body:'부제목을 입력하십시오.',notes:'',bg:'#ffffff',titleColor:'#202a34',bodyColor:'#28323d',titleSize:42,bodySize:24,theme:'office',images:[],shape:null}}
function current(){return slides[idx]}
function clone(v){return JSON.parse(JSON.stringify(v))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setStatus(s){$('status').textContent=s}
function markDirty(){dirty=true;$('saveState').textContent='● 저장되지 않은 변경 사항';clearTimeout(autosaveTimer);autosaveTimer=setTimeout(()=>{try{localStorage.setItem('pptcraft.autosave.v3',JSON.stringify({slides,idx}));$('saveState').textContent='● 자동 저장됨'}catch(e){$('saveState').textContent='● 자동 저장 공간 부족'}},350)}
function checkpoint(){history.push(clone(slides));if(history.length>80)history.shift();future=[]}
function syncFieldsToModel(){let s=current();s.title=$('titleField').value;s.body=$('bodyField').value;s.notes=$('notes').value;s.bg=$('bgField').value;s.titleColor=$('colorField').value;s.titleSize=+$('sizeField').value;s.bodySize=+$('bodySizeField').value}
function updatePreviewFromModel(){let s=current();$('slide').style.background=s.bg;$('slide').style.color=s.bodyColor;$('slideTitle').style.color=s.titleColor;$('slideTitle').style.fontSize='clamp(20px,3.2vw,'+s.titleSize+'px)';$('slideBody').style.color=s.bodyColor;$('slideBody').style.fontSize='clamp(12px,1.7vw,'+s.bodySize+'px)';$('slideNo').textContent=idx+1}
function updateThumbs(){ $('thumbs').innerHTML='';slides.forEach((s,i)=>{let b=document.createElement('button');b.className='thumb'+(i===idx?' active':'');b.innerHTML='<div class="mini" style="background:'+esc(s.bg)+';color:'+esc(s.titleColor)+'"><b>'+esc(s.title)+'</b><span>'+esc(s.body.slice(0,90))+'</span></div><div class="thumb-label">'+(i+1)+'. '+esc(s.title.slice(0,24))+'</div>';b.onclick=()=>{if(i===idx)return;syncFieldsToModel();idx=i;render();setStatus('슬라이드 '+(idx+1)+' 선택됨')};$('thumbs').append(b)});$('slideCount').textContent='슬라이드 '+(idx+1)+' / '+slides.length}
function render(){let s=current();$('titleField').value=s.title;$('bodyField').value=s.body;$('notes').value=s.notes;$('bgField').value=s.bg;$('colorField').value=s.titleColor;$('sizeField').value=s.titleSize;$('bodySizeField').value=s.bodySize;$('slideTitle').textContent=s.title;$('slideBody').textContent=s.body;$('slideImages').replaceChildren();(s.images||[]).forEach((src,i)=>{let im=document.createElement('img');im.src=src;im.alt='삽입 이미지 '+(i+1);$('slideImages').append(im)});updatePreviewFromModel();updateThumbs();markDirty()}
function onDirectEdit(which){let s=current(),el=which==='title'?$ ('slideTitle'):$('slideBody');const value=(el.innerText||'').replace(/\r/g,'');s[which]=value;const field=which==='title'?'titleField':'bodyField';$(field).value=value;updateThumbs();markDirty()}
[$('slideTitle'),$('slideBody')].forEach(el=>{el.addEventListener('focus',()=>{editSession=false});el.addEventListener('beforeinput',()=>{if(!editSession){checkpoint();editSession=true}});el.addEventListener('input',()=>{if(!isComposing)onDirectEdit(el===$('slideTitle')?'title':'body')});el.addEventListener('compositionstart',()=>{isComposing=true});el.addEventListener('compositionend',()=>{isComposing=false;onDirectEdit(el===$('slideTitle')?'title':'body')});el.addEventListener('blur',()=>{editSession=false})});
document.addEventListener('selectionchange',()=>{const sel=getSelection();if(!sel||!sel.rangeCount)return;const node=sel.anchorNode?.nodeType===1?sel.anchorNode:sel.anchorNode?.parentElement;if(node&&($('slideTitle').contains(node)||$('slideBody').contains(node)))savedRange=sel.getRangeAt(0).cloneRange()});
$('slideTitle').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('slideBody').focus()}});$('slideBody').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.ctrlKey){e.preventDefault();addSlide()}});[$('slideTitle'),$('slideBody')].forEach(el=>{el.addEventListener('paste',e=>{e.preventDefault();const text=(e.clipboardData||window.clipboardData).getData('text/plain');document.execCommand('insertText',false,text)});el.addEventListener('drop',e=>{if(e.dataTransfer?.files?.length){e.preventDefault();setStatus('그림은 삽입 탭의 그림 메뉴를 이용해 주세요.')}})});
['titleField','bodyField'].forEach(id=>$(id).addEventListener('input',()=>{let key=id==='titleField'?'title':'body';current()[key]=$(id).value;let el=key==='title'?$ ('slideTitle'):$('slideBody');if(document.activeElement!==el)el.textContent=current()[key];updateThumbs();markDirty()}));
['bgField','colorField','sizeField','bodySizeField','notes'].forEach(id=>$(id).addEventListener('input',()=>{syncFieldsToModel();updatePreviewFromModel();markDirty()}));
function addSlide(){syncFieldsToModel();checkpoint();slides.splice(idx+1,0,fresh());idx++;render();$('slideTitle').focus();setStatus('새 슬라이드를 추가했습니다.')}
$('addSlide').onclick=addSlide;
function undo(){if(!history.length)return;future.push(clone(slides));slides=history.pop();idx=Math.min(idx,slides.length-1);render();setStatus('실행 취소')}
function redo(){if(!future.length)return;history.push(clone(slides));slides=future.pop();idx=Math.min(idx,slides.length-1);render();setStatus('다시 실행')}
$('undoTop').onclick=undo;$('redoTop').onclick=redo;
function group(name,items){let g=document.createElement('div');g.className='rg';let body=document.createElement('div');body.className='groupbody';items.forEach(item=>{if(item.kind==='control'){let l=document.createElement('label');l.className='rctl';l.textContent=item.label;let input=document.createElement(item.tag||'input');input.type=item.type||'text';if(item.value!==undefined)input.value=item.value;if(item.options){input=document.createElement('select');item.options.forEach(o=>{let op=document.createElement('option');op.value=o[0];op.textContent=o[1];input.append(op)});input.value=item.value||item.options[0][0]}input.onchange=()=>item.action(input.value);l.append(input);body.append(l)}else if(item.kind==='stack'){let st=document.createElement('div');st.className='rstack';item.items.forEach(x=>{let b=document.createElement('button');b.textContent=x.label;b.onclick=x.action;st.append(b)});body.append(st)}else{let b=document.createElement('button');b.className='rb'+(item.large?' large':'');b.innerHTML='<span class="ico">'+(item.icon||'▣')+'</span><small>'+item.label+'</small>';b.onclick=item.action;if(item.id)b.id=item.id;body.append(b)}});g.append(body);let cap=document.createElement('span');cap.className='rgname';cap.textContent=name;g.append(cap);ribbon.append(g)}
function command(label,icon,action,large=false){return {label,icon,action,large}}
function stack(...items){return {kind:'stack',items:items.map(([label,action])=>({label,action}))}}
function control(label,value,action,options){return {kind:'control',label,value,action,options,tag:options?'select':'input'}}
function applyTextStyle(cmd,val){let sel=getSelection(),target=null;if(savedRange){const n=savedRange.commonAncestorContainer;target=$('slideTitle').contains(n)?$('slideTitle'):$('slideBody').contains(n)?$('slideBody'):null}if(!target&&document.activeElement?.isContentEditable)target=document.activeElement;if(!target)target=$('slideBody');target.focus();if(savedRange&&target.contains(savedRange.commonAncestorContainer)){sel.removeAllRanges();sel.addRange(savedRange)}document.execCommand(cmd,false,val);current().title=$('slideTitle').innerText;current().body=$('slideBody').innerText;$('titleField').value=current().title;$('bodyField').value=current().body;markDirty()}
function insertImage(){ $('imageFile').click()}
$('imageFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let url=await new Promise((ok,no)=>{let fr=new FileReader();fr.onload=()=>ok(fr.result);fr.onerror=()=>no(fr.error);fr.readAsDataURL(f)});checkpoint();current().images.push(url);render();setStatus('그림을 삽입했습니다.')}catch(err){setStatus('이미지를 불러오지 못했습니다: '+err.message)}finally{e.target.value=''}}
function openDialog(title,html,bind){$('dialogTitle').textContent=title;$('dialogContent').innerHTML=html;$('modal').classList.add('open');if(bind)bind()}
$('closeDialog').onclick=()=>$('modal').classList.remove('open');$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('open')});
