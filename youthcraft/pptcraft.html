<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111923"><title>PPTCraft | YouthDeveloper</title>
<style>
:root{color-scheme:dark;--bg:#101720;--chrome:#172330;--ribbon:#1b2937;--panel:#182532;--line:#334657;--text:#e9f0f5;--muted:#9aabba;--accent:#56d6bd;--blue:#75a9ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font:13px "Segoe UI","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.titlebar{height:34px;background:#0c131b;display:flex;align-items:center;padding:0 12px;gap:14px;border-bottom:1px solid #263543}.logo{font-weight:800;letter-spacing:.04em}.logo i{font-style:normal;color:var(--accent)}.docname{color:#c1ccd6}.savehint{color:#78909f;font-size:11px}.title-actions{margin-left:auto;display:flex;gap:7px}.title-actions button{border:1px solid #3a4a58;background:#1c2a37;border-radius:4px;padding:4px 10px}.title-actions .share{background:#176e60;border-color:#248b78}

.ribbon{height:106px;background:linear-gradient(#1c2a38,#192633);border-bottom:1px solid #3b4c5c;display:flex;align-items:stretch;padding:5px 8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}.group{display:flex;align-items:stretch;gap:4px;padding:2px 10px;border-right:1px solid #3a4b59;flex:none;position:relative}.group:last-child{border:0}.groupname{position:absolute;bottom:1px;left:0;right:0;text-align:center;color:#8396a7;font-size:10px;letter-spacing:.04em}.groupbody{display:flex;align-items:center;gap:4px;padding-bottom:13px}.tool{min-width:46px;height:68px;border:1px solid transparent;border-radius:4px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:4px 7px;color:#dce5eb}.tool:hover,.tool.on{background:#2a3d4e;border-color:#526b7d}.tool .ico{font-size:23px;line-height:25px;color:#b7d6df}.tool small{font-size:10px;white-space:nowrap}.tool.big{min-width:62px}.tool.big .ico{font-size:29px}.stack{display:flex;flex-direction:column;gap:4px}.stack button{height:29px;padding:0 9px;border:1px solid #405465;border-radius:4px;background:#263746;color:#dce5eb;white-space:nowrap}.stack button:hover{border-color:var(--accent)}.control{display:flex;flex-direction:column;gap:4px;color:#9eafbd;font-size:10px;min-width:75px}.control select,.control input{height:27px;background:#101a24;color:#e6edf3;border:1px solid #405365;border-radius:3px;padding:3px 6px;min-width:70px}.control input[type=color]{padding:2px;width:42px}
.app{height:calc(100dvh - 175px);display:grid;grid-template-columns:205px minmax(0,1fr) 225px;min-height:0}.sidebar,.inspector{background:#15222e;min-height:0;overflow:auto;padding:11px;border-right:1px solid #304352}.inspector{border-right:0;border-left:1px solid #304352}.section-label{font-size:10px;font-weight:700;letter-spacing:.13em;color:#88a0b2;margin:3px 0 11px}.thumbs{display:grid;gap:9px}.thumb{width:100%;border:1px solid #3b4e5e;background:#1d2c39;padding:6px;text-align:left;border-radius:4px}.thumb.active{border-color:var(--accent);box-shadow:inset 3px 0 var(--accent)}.preview{aspect-ratio:16/9;background:white;color:#27313b;padding:9px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}.preview b{font-size:10px}.preview span{font-size:7px;white-space:pre-wrap}.thumb-caption{font-size:10px;color:#9fb0bd;padding:5px 2px 0}.add{width:100%;margin-top:9px;border:1px dashed #526b7e;background:transparent;border-radius:4px;padding:8px;color:#c1d0da}.work{display:flex;flex-direction:column;min-width:0;min-height:0;background:#0d151e}.workbar{height:31px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:#92a5b5;font-size:10px;border-bottom:1px solid #293b49}.stage{flex:1;min-height:0;display:grid;place-items:center;overflow:auto;padding:24px;background-color:#111c27;background-image:linear-gradient(#26374655 1px,transparent 1px),linear-gradient(90deg,#26374655 1px,transparent 1px);background-size:22px 22px}.slide{width:min(100%,1100px);aspect-ratio:16/9;background:#fff;color:#202a34;position:relative;box-shadow:0 16px 48px #0009;padding:7%;display:flex;flex-direction:column;justify-content:center;overflow:hidden}.editable{outline:1px dashed transparent;white-space:pre-wrap;overflow-wrap:anywhere}.editable:focus{outline-color:#5596e9}.slide-title{font-size:clamp(25px,3.2vw,52px);font-weight:700;line-height:1.16;margin:0 0 20px}.slide-body{font-size:clamp(15px,1.65vw,26px);line-height:1.55}.slide-no{position:absolute;right:22px;bottom:15px;color:#7d8791;font-size:12px}.notes{height:58px;flex:none;resize:none;border:0;border-top:1px solid #2b3d4c;background:#172431;color:#dbe5ed;padding:9px 12px}.status{height:23px;background:#0b121a;border-top:1px solid #2a3b49;color:#8196a8;padding:4px 10px;font-size:10px}.prop{display:grid;gap:5px;margin:12px 0;color:#9fb0bd;font-size:10px}.prop input,.prop textarea,.prop select{width:100%;border:1px solid #3c5061;border-radius:3px;background:#0f1923;color:#e5edf3;padding:7px}.prop textarea{resize:vertical}.inspector p{font-size:10px;line-height:1.65;color:#8298aa}
@media(max-width:950px){.app{grid-template-columns:155px minmax(0,1fr)}.inspector{display:none}}@media(max-width:620px){.app{grid-template-columns:95px minmax(0,1fr)}.sidebar{padding:6px}.stage{padding:8px}.tabbar button{padding:0 9px}.group{padding:2px 6px}.slide-title{font-size:clamp(19px,5vw,32px)}.slide-body{font-size:clamp(12px,3vw,18px)}}
</style></head><body>
<header class="titlebar"><div class="logo"><i>YC</i> PPTCraft</div><span class="docname" id="docName">프레젠테이션 1</span><span class="savehint" id="saveState">● 저장되지 않음</span><div class="title-actions"><button id="saveProject">저장</button><button id="openProject">열기</button><button class="share" id="export">내보내기</button><a href="/youthcraft/" style="color:#9eb1c1;text-decoration:none;padding:5px">YouthCraft ↗</a></div></header>
<nav class="tabbar"><button class="selected" data-tab="home">파일</button><button data-tab="home" class="selected">홈</button><button data-tab="insert">삽입</button><button data-tab="design">디자인</button><button data-tab="transition">전환</button><button data-tab="animation">애니메이션</button><button data-tab="slideshow">슬라이드 쇼</button><button data-tab="review">검토</button><button data-tab="view">보기</button></nav>
<section class="ribbon" id="ribbon">
<div class="group"><div class="groupbody"><button class="tool big" id="paste"><span class="ico">▣</span><small>붙여넣기</small></button><div class="stack"><button id="cut">잘라내기</button><button id="copy">복사</button><button id="format">서식 복사</button></div></div><span class="groupname">클립보드</span></div>
<div class="group"><div class="groupbody"><button class="tool big" id="newSlide"><span class="ico">▤＋</span><small>새 슬라이드</small></button><div class="stack"><button id="layout">레이아웃 ▾</button><button id="reset">다시 설정</button><button id="section">구역 ▾</button></div></div><span class="groupname">슬라이드</span></div>
<div class="group"><div class="groupbody"><label class="control">글꼴<select id="font"><option>맑은 고딕</option><option>Arial</option><option>Noto Sans KR</option><option>바탕</option></select></label><label class="control">크기<input id="fontSize" type="number" min="10" max="96" value="36"></label><div class="stack"><button id="bold"><b>B</b></button><button id="italic"><i>I</i></button><button id="underline"><u>U</u></button></div><label class="control">글자 색상<input type="color" id="textColor" value="#24313d"></label></div><span class="groupname">글꼴</span></div>
<div class="group"><div class="groupbody"><div class="stack"><button id="bullets">글머리 기호</button><button id="numbering">번호 매기기</button><button id="alignLeft">왼쪽 정렬</button><button id="alignCenter">가운데 정렬</button></div><div class="stack"><button id="alignRight">오른쪽 정렬</button><button id="lineSpacing">줄 간격</button></div></div><span class="groupname">단락</span></div>
<div class="group"><div class="groupbody"><button class="tool" id="addText"><span class="ico">T</span><small>텍스트 상자</small></button><button class="tool" id="addShape"><span class="ico">▱</span><small>도형</small></button><button class="tool" id="addImage"><span class="ico">▧</span><small>그림</small></button><button class="tool" id="addTable"><span class="ico">▦</span><small>표</small></button></div><span class="groupname">그리기 / 삽입</span></div>
<div class="group"><div class="groupbody"><label class="control">디자인 테마<select id="theme"><option value="white">클린 화이트</option><option value="dark">미드나이트</option><option value="warm">웜 페이퍼</option><option value="mint">민트</option></select></label><button id="bgColor" class="tool"><span class="ico">◩</span><small>배경 서식</small></button></div><span class="groupname">디자인</span></div>
<div class="group"><div class="groupbody"><button class="tool" id="undo"><span class="ico">↶</span><small>실행 취소</small></button><button class="tool" id="redo"><span class="ico">↷</span><small>다시 실행</small></button><button class="tool" id="startShow"><span class="ico">▷</span><small>슬라이드 쇼</small></button></div><span class="groupname">편집 / 발표</span></div>
<input id="projectFile" type="file" accept="application/json" hidden><input id="imageFile" type="file" accept="image/*" hidden></section>
<div class="app"><aside class="sidebar"><div class="section-label">슬라이드 탐색</div><div id="thumbs" class="thumbs"></div><button class="add" id="addBottom">＋ 슬라이드 추가</button></aside>
<main class="work"><div class="workbar"><span id="slideCount">슬라이드 1 / 1</span><span>와이드스크린 16:9　　편집 작업 공간</span></div><div class="stage"><article class="slide" id="slide"><h1 id="slideTitle" class="slide-title editable" contenteditable="true">제목을 입력하세요</h1><div id="slideBody" class="slide-body editable" contenteditable="true">부제목 또는 내용을 입력하세요.</div><span id="slideNo" class="slide-no">1</span></article></div><textarea id="notes" class="notes" placeholder="여기에 슬라이드 노트를 입력하십시오"></textarea></main>
<aside class="inspector"><div class="section-label">서식 / 슬라이드 속성</div><label class="prop">슬라이드 제목<input id="titleInput"></label><label class="prop">본문<textarea id="bodyInput" rows="6"></textarea></label><label class="prop">배경 색상<input type="color" id="background" value="#ffffff"></label><label class="prop">제목 색상<input type="color" id="headingColor" value="#263746"></label><label class="prop">제목 크기<input type="range" id="headingSize" min="20" max="72" value="42"></label><div class="section-label" style="margin-top:22px">작업 환경</div><p>슬라이드의 텍스트를 직접 클릭해 편집할 수 있습니다. 왼쪽에서 슬라이드를 선택하고 상단 리본에서 삽입·서식·디자인 기능을 사용하세요.</p></aside></div>
<div class="status" id="status">● YouthDeveloper Presentation Workspace　　로컬 편집 중</div>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script>
(()=>{const $=id=>document.getElementById(id);let data=[{title:"제목을 입력하세요",body:"부제목 또는 내용을 입력하세요.",notes:"",bg:"#ffffff",color:"#263746",size:42,images:[]}],idx=0,history=[],future=[];const clone=()=>JSON.parse(JSON.stringify(data));function snapshot(){history.push(clone());if(history.length>40)history.shift();future=[]}function sync(){let s=data[idx];s.title=$("titleInput").value;s.body=$("bodyInput").value;s.notes=$("notes").value;s.bg=$("background").value;s.color=$("headingColor").value;s.size=+$("headingSize").value}function render(){let s=data[idx];$("titleInput").value=s.title;$("bodyInput").value=s.body;$("notes").value=s.notes;$("background").value=s.bg;$("headingColor").value=s.color;$("headingSize").value=s.size;$("slideTitle").textContent=s.title;$("slideBody").textContent=s.body;$("slide").style.background=s.bg;$("slide").style.color=s.bg==="#14202b"?"#f2f6fa":"#25313b";$("slideTitle").style.color=s.color;$("slideTitle").style.fontSize="clamp(24px,3.1vw,"+s.size+"px)";$("slideNo").textContent=idx+1;$("slideCount").textContent="슬라이드 "+(idx+1)+" / "+data.length;$("thumbs").innerHTML=data.map((v,i)=>'<button class="thumb '+(i===idx?"active":"")+'" data-index="'+i+'"><div class="preview"><b>'+esc(v.title)+'</b><span>'+esc(v.body.slice(0,90))+'</span></div><div class="thumb-caption">'+(i+1)+'. '+esc(v.title.slice(0,24))+'</div></button>').join("");$("thumbs").querySelectorAll("[data-index]").forEach(b=>b.onclick=()=>{sync();idx=+b.dataset.index;render()});$("saveState").textContent="● 편집 중"}function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function changed(){sync();let s=data[idx];$("slideTitle").textContent=s.title;$("slideBody").textContent=s.body;$("slide").style.background=s.bg;$("slideTitle").style.color=s.color;$("slideTitle").style.fontSize=s.size+"px";$("thumbs").querySelectorAll(".thumb-caption").forEach((n,i)=>n.textContent=(i+1)+". "+data[i].title.slice(0,24));$("saveState").textContent="● 수정됨"}["titleInput","bodyInput","notes","background","headingColor","headingSize"].forEach(id=>$(id).addEventListener("input",changed));$("slideTitle").oninput=()=>{$("titleInput").value=$("slideTitle").textContent;changed()};$("slideBody").oninput=()=>{$("bodyInput").value=$("slideBody").textContent;changed()};function add(){sync();snapshot();data.push({title:"새 슬라이드",body:"핵심 내용을 입력하세요.",notes:"",bg:"#ffffff",color:"#263746",size:36,images:[]});idx=data.length-1;render()}$("newSlide").onclick=$("addBottom").onclick=add;$("reset").onclick=()=>{snapshot();$("titleInput").value="제목을 입력하세요";$("bodyInput").value="부제목 또는 내용을 입력하세요.";changed()};$("layout").onclick=()=>{snapshot();$("titleInput").value="제목을 입력하세요";$("bodyInput").value="내용을 입력하세요.";changed()};$("section").onclick=()=>alert("현재 문서의 구역은 슬라이드 목록으로 관리합니다.");$("bold").onclick=()=>document.execCommand("bold");$("italic").onclick=()=>document.execCommand("italic");$("underline").onclick=()=>document.execCommand("underline");$("font").onchange=e=>{document.execCommand("fontName",false,e.target.value);$("slide").focus()};$("fontSize").onchange=e=>{let v=Math.max(10,Math.min(96,+e.target.value));document.execCommand("fontSize",false,"7");document.querySelectorAll("#slide font[size='7']").forEach(n=>{n.removeAttribute("size");n.style.fontSize=v+"px"})};$("textColor").onchange=e=>document.execCommand("foreColor",false,e.target.value);$("bullets").onclick=()=>document.execCommand("insertUnorderedList");$("numbering").onclick=()=>document.execCommand("insertOrderedList");$("alignLeft").onclick=()=>document.execCommand("justifyLeft");$("alignCenter").onclick=()=>document.execCommand("justifyCenter");$("alignRight").onclick=()=>document.execCommand("justifyRight");$("lineSpacing").onclick=()=>{$("slideBody").style.lineHeight=$("slideBody").style.lineHeight==="1.8"?"1.35":"1.8"};$("addText").onclick=()=>{$("bodyInput").value+="\n새 텍스트 상자";changed();$("slideBody").focus()};$("addShape").onclick=()=>{snapshot();$("bodyInput").value+="\n◆ 도형";changed()};$("addTable").onclick=()=>{snapshot();$("bodyInput").value+="\n항목 1　　 항목 2\n내용　　　내용";changed()};$("addImage").onclick=()=>$("imageFile").click();$("imageFile").onchange=async e=>{let f=e.target.files[0];if(!f)return;let u=await new Promise(ok=>{let r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(f)});snapshot();let im=document.createElement("img");im.src=u;im.style.cssText="max-width:45%;max-height:220px;object-fit:contain";$("slideBody").appendChild(im);$("status").textContent="이미지가 슬라이드에 추가되었습니다."};$("bgColor").onclick=()=>$("background").click();$("theme").onchange=e=>{snapshot();let t={white:["#ffffff","#263746"],dark:["#14202b","#65d8c3"],warm:["#f4eee4","#76543d"],mint:["#e8f4ef","#236e5d"]}[e.target.value];$("background").value=t[0];$("headingColor").value=t[1];changed()};$("delete").onclick=()=>{if(data.length<2)return;snapshot();data.splice(idx,1);idx=Math.max(0,idx-1);render()};function download(blob,name){let a=document.createElement("a"),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1200)}$("saveProject").onclick=()=>{sync();download(new Blob([JSON.stringify({version:2,slides:data},null,2)],{type:"application/json"}),"pptcraft-project.json");$("saveState").textContent="● 프로젝트 저장됨"};$("openProject").onclick=()=>$("projectFile").click();$("projectFile").onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.slides)||!d.slides.length)throw Error();data=d.slides;idx=0;render()}catch{$("status").textContent="프로젝트 파일을 읽을 수 없습니다."}};$("export").onclick=async()=>{sync();if(!window.PptxGenJS){$("status").textContent="PPTX 모듈을 불러오지 못했습니다. 인터넷 연결을 확인하세요.";return}try{let p=new PptxGenJS();p.layout="LAYOUT_WIDE";p.author="YouthDeveloper";data.forEach(s=>{let sl=p.addSlide();sl.background={color:s.bg.replace("#","")};sl.addText(s.title,{x:.8,y:1.05,w:11.7,h:1.2,fontFace:"Aptos",fontSize:s.size,bold:true,color:s.color.replace("#",""),fit:"shrink"});sl.addText(s.body,{x:.9,y:2.65,w:11.3,h:3.8,fontFace:"Aptos",fontSize:22,color:s.bg==="#14202b"?"F2F6FA":"25313B",breakLine:false,fit:"shrink"});if(s.notes)sl.addNotes(s.notes)});await p.writeFile({fileName:"YouthDeveloper-Presentation.pptx"});$("status").textContent="PPTX 내보내기가 완료되었습니다."}catch(e){$("status").textContent="PPTX 내보내기 오류: "+e.message}};$("undo").onclick=()=>{if(!history.length)return;future.push(clone());data=history.pop();idx=Math.min(idx,data.length-1);render()};$("redo").onclick=()=>{if(!future.length)return;history.push(clone());data=future.pop();idx=Math.min(idx,data.length-1);render()};$("cut").onclick=()=>document.execCommand("cut");$("copy").onclick=()=>document.execCommand("copy");$("paste").onclick=()=>document.execCommand("paste");$("format").onclick=()=>document.execCommand("copy");$("startShow").onclick=()=>{sync();let w=window.open("","pptcraft-show");if(!w)return;w.document.write('<html><body style="margin:0;background:#080d13;display:grid;place-items:center;height:100vh;font-family:Arial"><main id="s" style="width:90vw;aspect-ratio:16/9;background:white;padding:7%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center"></main><script>const d='+JSON.stringify(data).replace(/</g,"\\u003c")+';let i=0;function draw(){let x=d[i];document.getElementById("s").style.background=x.bg;document.getElementById("s").innerHTML="<h1 style=\'font-size:5vw;color:"+x.color+"\'>"+x.title.replace(/[&<>]/g,"")+"</h1><p style=\'font-size:2.4vw;white-space:pre-wrap\'>"+x.body.replace(/[&<>]/g,"")+"</p>";}draw();onkeydown=e=>{if(e.key==="ArrowRight"||e.key===" "){i=Math.min(d.length-1,i+1);draw()}if(e.key==="ArrowLeft"){i=Math.max(0,i-1);draw()}if(e.key==="Escape")close()};<\/script></body></html>');w.document.close()};document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabbar button").forEach(x=>x.classList.toggle("selected",x===b));$("status").textContent=b.textContent+" 리본 선택"});render()})();
</script></body></html>
