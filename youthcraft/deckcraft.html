<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111113"><title>DeckCraft — YouthCraft</title>
<style>
:root{color-scheme:dark;--bg:#111113;--panel:#1a1a20;--line:#36363f;--text:#f6f6f8;--muted:#aaaab4;--accent:#70f0bd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,Arial,sans-serif}header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:#17171b}a{color:inherit;text-decoration:none}.brand{font-size:18px;font-weight:850}.brand span{color:var(--accent)}button,.btn{border:1px solid var(--line);background:#25252d;color:var(--text);padding:9px 12px;border-radius:7px;cursor:pointer;font:inherit}.primary{background:var(--accent);color:#111;border-color:var(--accent);font-weight:800}main{max-width:1100px;margin:0 auto;padding:26px 20px}.crumb{color:var(--muted);font-size:11px;letter-spacing:.13em}h1{margin:8px 0;font-size:32px;letter-spacing:-.04em}p{color:#c5c5cc}.intro{max-width:700px;line-height:1.8}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;margin-top:24px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}.panel h2{font-size:13px;letter-spacing:.12em;color:var(--muted);margin:0 0 14px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;color:var(--muted)}input,textarea,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;background:#101014;color:var(--text);font:inherit}input[type=color]{height:38px;padding:3px}input[type=range]{padding:0}textarea{min-height:110px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.stage{min-height:440px;display:grid;place-items:center;overflow:auto;background:#25252b;border-radius:8px;padding:14px}.stage canvas{max-width:100%;height:auto;background:white}.stage video,.stage audio{max-width:100%;width:100%}.hint{font-size:12px;color:var(--muted);line-height:1.7}.output{width:100%;min-height:360px;background:#fff;color:#17171b;border-radius:6px;padding:24px}.output[contenteditable=true]{outline:0}.status{font-size:12px;color:var(--muted);margin-top:10px}table{border-collapse:collapse;background:#fff;color:#161616;width:100%;table-layout:fixed}td,th{border:1px solid #ccc;padding:0}td input{border:0;border-radius:0;background:white;color:#111;padding:8px;min-width:50px}.foot{margin-top:24px;color:var(--muted);font-size:11px}@media(max-width:760px){header{padding:0 12px}.layout{grid-template-columns:1fr}main{padding:20px 12px}h1{font-size:27px}.stage{min-height:330px}}
</style></head><body>
<header><a class="brand" href="/youthcraft/">Youth<span>Craft</span> <span style="color:#aaaab4;font-size:12px;font-weight:500">/ DeckCraft</span></a><a class="btn" href="/youthcraft/">← 모든 도구</a></header>
<main><div class="crumb">YOUTHCRAFT TOOL / DECKCRAFT</div><h1>DeckCraft</h1><p class="intro">슬라이드 제목과 본문을 작성하고 프레젠테이션을 HTML 파일로 내보냅니다.</p>
<div class="layout"><section class="panel"><h2>TOOLS / 도구</h2><div id="controls"></div><div class="actions" id="actions"></div><div id="status" class="status">브라우저에서 실행됩니다.</div></section><section class="panel"><h2>슬라이드 제작</h2><div class="stage" id="stage"></div><p class="hint" id="hint">파일과 작업 내용은 기본적으로 브라우저 안에서 처리됩니다.</p></section></div>
<div class="foot">YouthCraft · by YouthDeveloper · 이 도구는 개발 초기 버전입니다.</div></main>
<script>
(()=>{const type="deck",$=id=>document.getElementById(id),controls=$('controls'),actions=$('actions'),stage=$('stage');let canvas,ctx,loaded=null;
function field(label,id,value,type='text'){const d=document.createElement('div');d.className='field';const l=document.createElement('label');l.textContent=label;const i=document.createElement('input');i.id=id;i.type=type;i.value=value;d.append(l,i);controls.append(d);return i}
function area(label,id,value){const d=document.createElement('div');d.className='field';const l=document.createElement('label');l.textContent=label;const i=document.createElement('textarea');i.id=id;i.value=value;d.append(l,i);controls.append(d);return i}
function btn(label,fn,primary=false){const b=document.createElement('button');b.textContent=label;if(primary)b.className='primary';b.onclick=fn;actions.append(b);return b}
function status(s){$('status').textContent=s}
function makeCanvas(w=900,h=600){stage.replaceChildren();canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;ctx=canvas.getContext('2d');stage.append(canvas);ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);return canvas}
function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function saveCanvas(name='youthcraft-design.png'){canvas.toBlob(b=>b&&saveBlob(b,name),'image/png')}
function upload(accept,fn){const i=document.createElement('input');i.type='file';i.accept=accept;i.onchange=()=>{if(i.files[0])fn(i.files[0])};i.click()}
if(type==='vector'||type==='cad'){
 const shape=field('도형','shape',type==='cad'?'rect':'circle');shape.outerHTML='<div class="field"><label for="shape">도형</label><select id="shape"><option value="rect">사각형</option><option value="circle">원</option><option value="line">선</option><option value="text">텍스트</option></select></div>';
 const color=field('색상','color','#70f0bd','color'),size=field('크기','size','160','number'),label=field('텍스트 (텍스트 도형용)','label','YouthCraft');
 makeCanvas();function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle=$('color').value;ctx.strokeStyle=$('color').value;ctx.lineWidth=5;let n=Math.max(20,Math.min(500,Number($('size').value)||160));if($('shape').value==='rect')ctx.fillRect(120,100,n,n*.65);if($('shape').value==='circle'){ctx.beginPath();ctx.arc(300,260,n/2,0,Math.PI*2);ctx.fill()}if($('shape').value==='line'){ctx.beginPath();ctx.moveTo(100,100);ctx.lineTo(100+n,100+n*.6);ctx.stroke()}if($('shape').value==='text'){ctx.font='bold 48px sans-serif';ctx.fillText($('label').value,70,170)}}['shape','color','size','label'].forEach(id=>$(id).addEventListener('input',draw));btn('SVG 내보내기',()=>{const n=Number($('size').value)||160,sh=$('shape').value,c=$('color').value;let el=sh==='circle'?'<circle cx="300" cy="220" r="'+n/2+'" fill="'+c+'"/>':sh==='line'?'<path d="M100 100 L'+(100+n)+' '+(100+n*.6)+'" stroke="'+c+'" stroke-width="5"/>':sh==='text'?'<text x="70" y="170" font-size="48" fill="'+c+'">'+$('label').value.replace(/[<>&]/g,'')+'</text>':'<rect x="120" y="100" width="'+n+'" height="'+n*.65+'" fill="'+c+'"/>';saveBlob(new Blob(['<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600">'+el+'</svg>'],{type:'image/svg+xml'}),'youthcraft.svg')},true);btn('PNG 내보내기',()=>saveCanvas());draw();
}else if(type==='design'||type==='fig'||type==='effects'){
 field('배경색','bg','#22263b','color');field('강조색','accent','#70f0bd','color');field('제목','title',type==='fig'?'Welcome to your app':'Your big idea');area('설명','body','여기에 설명을 입력하세요.');field('글자 크기','fontSize','44','number');makeCanvas();function draw(){const w=canvas.width,h=canvas.height;ctx.fillStyle=$('bg').value;ctx.fillRect(0,0,w,h);if(type==='fig'){ctx.fillStyle='#fff';ctx.fillRect(80,50,740,500);ctx.fillStyle=$('accent').value;ctx.fillRect(80,50,740,55);ctx.fillStyle='#222';ctx.font='bold 22px sans-serif';ctx.fillText($('title').value,105,86);ctx.fillStyle='#eee';ctx.fillRect(110,135,220,340);ctx.fillRect(360,135,420,150);ctx.fillRect(360,310,420,165);ctx.fillStyle='#aaa';ctx.fillRect(130,160,180,20);ctx.fillRect(130,200,150,12);ctx.fillStyle=$('accent').value;ctx.fillRect(390,165,180,85)}else{ctx.fillStyle=$('accent').value;ctx.fillRect(0,0,w,18);ctx.fillStyle='#fff';ctx.font='bold '+Math.max(16,Math.min(100,Number($('fontSize').value)||44))+'px sans-serif';wrapText(ctx,$('title').value,70,150,760,70);ctx.fillStyle='#d5d8e5';ctx.font='24px sans-serif';wrapText(ctx,$('body').value,72,300,740,38);if(type==='effects'){ctx.fillStyle=$('accent').value;ctx.beginPath();ctx.arc(700,420,60,0,Math.PI*2);ctx.fill()}}}function wrapText(c,t,x,y,max,lh){let line='';for(const word of t.split(' ')){let test=line+word+' ';if(c.measureText(test).width>max&&line){c.fillText(line,x,y);line=word+' ';y+=lh}else line=test}c.fillText(line,x,y)}['bg','accent','title','body','fontSize'].forEach(id=>$(id).addEventListener('input',draw));btn('PNG 내보내기',()=>saveCanvas(),true);if(type==='effects')btn('다음 프레임',()=>{draw();const t=$('title');t.value=t.value+' ';draw();status('프레임 미리보기 업데이트됨')});draw();
}else if(type==='light'){
 const inp=field('밝기','brightness','100','range');inp.min=40;inp.max=160;const con=field('대비','contrast','100','range');con.min=40;con.max=160;const sat=field('채도','saturation','100','range');sat.min=0;sat.max=200;btn('이미지 열기',()=>upload('image/*',f=>{const im=new Image();im.onload=()=>{loaded=im;makeCanvas(Math.min(1800,im.width),Math.min(1200,im.height));draw()};im.src=URL.createObjectURL(f)}));function draw(){if(!loaded)return;ctx.filter='brightness('+inp.value+'%) contrast('+con.value+'%) saturate('+sat.value+'%)';ctx.drawImage(loaded,0,0,canvas.width,canvas.height);ctx.filter='none'}[inp,con,sat].forEach(i=>i.addEventListener('input',draw));makeCanvas();btn('보정 PNG 저장',()=>saveCanvas('lightcraft.png'),true);
}else if(type==='video'||type==='audio'){
 btn('파일 열기',()=>upload(type==='video'?'video/*':'audio/*',f=>{stage.replaceChildren();const media=document.createElement(type);media.controls=true;media.src=URL.createObjectURL(f);stage.append(media);status(f.name+' · '+Math.round(f.size/1024)+' KB');$('hint').textContent='파일은 이 브라우저에서 재생됩니다. 서버에 업로드하지 않습니다.'}),true);$('hint').textContent=type==='video'?'영상 파일을 선택해 미리보기와 재생을 확인하세요.':'오디오 파일을 선택해 재생을 확인하세요.';
}else if(type==='word'){
 const title=field('문서 제목','title','새 문서');const text=area('문서 내용','body','여기에 문서를 작성하세요.\n\n문단을 나누어 작성할 수 있습니다.');stage.innerHTML='<div class="output" id="paper" contenteditable="true" spellcheck="true"></div>';function draw(){ $('paper').innerHTML='<h1>'+title.value.replace(/[<>&]/g,'')+'</h1><div style="white-space:pre-wrap;line-height:1.8">'+text.value.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))+'</div>'}$('paper').addEventListener('input',()=>{text.value=$('paper').innerText});title.addEventListener('input',draw);text.addEventListener('input',draw);btn('TXT 저장',()=>saveBlob(new Blob([title.value+'\n\n'+text.value],{type:'text/plain;charset=utf-8'}),'document.txt'),true);btn('HTML 저장',()=>saveBlob(new Blob(['<!doctype html><meta charset="utf-8"><title>'+title.value+'</title><h1>'+title.value.replace(/[<>&]/g,'')+'</h1><pre>'+text.value.replace(/[<>&]/g,'')+'</pre>'],{type:'text/html;charset=utf-8'}),'document.html'));draw();
}else if(type==='deck'){
 field('슬라이드 제목','title','발표 제목');area('슬라이드 본문','body','핵심 내용을 여기에 작성하세요.');field('배경색','bg','#20243a','color');makeCanvas(960,540);function draw(){ctx.fillStyle=$('bg').value;ctx.fillRect(0,0,960,540);ctx.fillStyle='#70f0bd';ctx.fillRect(0,0,960,14);ctx.fillStyle='#fff';ctx.font='bold 54px sans-serif';ctx.fillText($('title').value,70,160,820);ctx.font='28px sans-serif';let y=245;for(const line of $('body').value.split('\n')){ctx.fillText(line,75,y,800);y+=46}}['title','body','bg'].forEach(id=>$(id).addEventListener('input',draw));btn('슬라이드 PNG',()=>saveCanvas('slide.png'));btn('HTML 발표자료 저장',()=>{const html='<!doctype html><meta charset="utf-8"><title>'+$('title').value+'</title><style>body{font:28px Arial;background:'+$('bg').value+';color:white;padding:8vw}h1{color:#70f0bd}</style><h1>'+$('title').value.replace(/[<>&]/g,'')+'</h1><p>'+ $('body').value.replace(/[<>&]/g,'').replace(/\n/g,'<br>')+'</p>';saveBlob(new Blob([html],{type:'text/html'}),'presentation.html')},true);draw();
}else if(type==='grid'){
 const rows=8,cols=5;stage.innerHTML='';const table=document.createElement('table');const data=Array.from({length:rows},(_,r)=>Array.from({length:cols},(_,c)=>r===0?'열 '+(c+1):''));function draw(){table.replaceChildren();data.forEach((row,r)=>{const tr=document.createElement('tr');row.forEach((v,c)=>{const td=document.createElement('td'),i=document.createElement('input');i.value=v;i.setAttribute('aria-label','행 '+(r+1)+' 열 '+(c+1));i.oninput=()=>data[r][c]=i.value;td.append(i);tr.append(td)});table.append(tr)});stage.append(table)}btn('CSV 내보내기',()=>saveBlob(new Blob([data.map(r=>r.map(v=>'"'+v.replace(/"/g,'""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),'grid.csv'),true);btn('행 추가',()=>{data.push(Array(cols).fill(''));draw()});draw();$('hint').textContent='셀을 직접 편집하고 CSV로 저장할 수 있습니다.';
}else if(type==='pdf'){
 const title=field('문서 제목','title','YouthCraft 문서');const text=area('본문','body','PDF로 저장할 내용을 입력하세요.');stage.innerHTML='<div class="output" id="paper" style="white-space:pre-wrap"></div>';function draw(){$('paper').innerHTML='<h1>'+title.value.replace(/[<>&]/g,'')+'</h1><p>'+text.value.replace(/[<>&]/g,'').replace(/\n/g,'<br>')+'</p>'}title.oninput=text.oninput=draw;btn('PDF로 인쇄 / 저장',()=>window.print(),true);btn('텍스트 저장',()=>saveBlob(new Blob([title.value+'\n\n'+text.value],{type:'text/plain;charset=utf-8'}),'document.txt'));draw();$('hint').textContent='“PDF로 인쇄 / 저장”을 누른 뒤 인쇄 대화상자에서 PDF로 저장을 선택하세요.';
}
})();
</script></body></html>
