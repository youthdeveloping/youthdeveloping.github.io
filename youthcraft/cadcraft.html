<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111318"><title>CADCraft — YouthCraft</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101319;color:#edf1f7;font:13px/1.45 Inter,"Segoe UI","Noto Sans KR",sans-serif}button,input,select{font:inherit}button{background:#252c37;color:#edf1f7;border:1px solid #414b5c;border-radius:5px;padding:7px 10px;cursor:pointer}button:hover{border-color:#70e8bd}button.active,.primary{background:#70e8bd;color:#0d1914;border-color:#70e8bd;font-weight:800}input,select{background:#151a22;color:#edf1f7;border:1px solid #414b5c;border-radius:5px;padding:7px;min-width:0;width:100%}input[type=color]{height:31px;padding:2px}input[type=checkbox]{width:auto}header{height:48px;display:flex;align-items:center;gap:12px;padding:0 13px;background:#191e27;border-bottom:1px solid #394252}.brand{font-size:16px;font-weight:900;color:inherit;text-decoration:none}.brand em{font-style:normal;color:#70e8bd}.top{margin-left:auto;display:flex;gap:5px}.toolbar{height:42px;display:flex;align-items:center;gap:5px;padding:5px 8px;background:#202631;border-bottom:1px solid #394252;overflow:auto;white-space:nowrap}.toolbar button{flex:none}.layout{height:calc(100% - 138px);display:grid;grid-template-columns:185px minmax(0,1fr) 205px;min-height:0}.side{padding:10px;background:#191e27;overflow:auto;border-right:1px solid #394252}.side.right{border:0;border-left:1px solid #394252}.sect{font-size:10px;letter-spacing:.15em;color:#9eabba;margin:5px 0 9px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:5px}.tools button{font-size:11px;text-align:left}.field{display:grid;gap:4px;margin:9px 0;color:#aeb9c8;font-size:11px}.canvasarea{min-width:0;min-height:0;display:flex;flex-direction:column}.viewbar{height:32px;display:flex;align-items:center;gap:10px;padding:0 10px;background:#202631;color:#aab5c5;font-size:10px}.viewbar b{color:#edf1f7}.viewport{flex:1;min-height:0;overflow:hidden;background:#10151d;position:relative;touch-action:none}.viewport canvas{display:block;width:100%;height:100%;touch-action:none}.layers{display:grid;gap:4px}.layer{display:flex;align-items:center;gap:5px;padding:6px;background:#242b36;border:1px solid #404b5c;border-radius:5px;font-size:10px}.layer span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.layer.active{border-color:#70e8bd}.status{height:24px;padding:4px 10px;background:#191e27;border-top:1px solid #394252;color:#aab5c5;font-size:10px}.hint{font-size:10px;color:#929eae;line-height:1.65;margin-top:10px}.group{display:flex;gap:5px;margin:8px 0}.group button{flex:1}.badge{color:#70e8bd}.hidden{display:none!important}@media(max-width:850px){.layout{grid-template-columns:150px minmax(0,1fr)}.side.right{display:none}}@media(max-width:580px){header{height:auto;min-height:48px;flex-wrap:wrap;padding:6px}.top{max-width:100%;overflow:auto}.layout{height:calc(100% - 138px);grid-template-columns:1fr}.side.left{order:2;max-height:125px;border:0;border-top:1px solid #394252}.canvasarea{order:1;min-height:180px}.tools{grid-template-columns:repeat(4,1fr)}}

</head><body>
<header><a class="brand" href="/youthcraft/">Youth<em>Craft</em> / CADCraft</a><div class="top"><button id="new">새 도면</button><button id="open">열기</button><button id="save">프로젝트 저장</button><a href="/youthcraft/" style="color:#aab5c5;text-decoration:none;padding:7px">모든 도구</a></div></header>
<div class="toolbar" id="bar"><button id="undo">실행 취소</button><button id="redo">다시 실행</button><button id="grid">격자 표시 ✓</button><button id="snap">스냅 ✓</button><button id="zoomFit">화면 맞춤</button><button id="svg">SVG 내보내기</button><button id="dxf" class="primary">DXF 내보내기</button><button id="png">PNG 저장</button></div>
<div class="layout"><aside class="side left"><div class="sect">DRAWING TOOLS</div><div class="tools" id="tools"></div><div class="sect" style="margin-top:16px">DRAWING SETTINGS</div><label class="field">격자 간격 (mm)<input id="gridSize" type="number" min="1" max="500" value="10"></label><label class="field">도면 폭 (mm)<input id="worldW" type="number" value="420"></label><label class="field">도면 높이 (mm)<input id="worldH" type="number" value="297"></label><label class="field">기본 선 색상<input id="color" type="color" value="#243246"></label><label class="field">선 두께 (mm)<input id="lineWidth" type="number" value="0.5" min="0.1" max="20" step="0.1"></label><p class="hint">휠: 확대/축소 · 가운데 버튼 또는 스페이스+드래그: 화면 이동 · Esc: 선택 도구</p></aside>
<main class="canvasarea"><div class="viewbar"><b>MODEL SPACE</b><span id="coord">X 0.00 · Y 0.00</span><span id="scale" style="margin-left:auto">1:1</span></div><div class="viewport" id="viewport"><canvas id="canvas"></canvas></div><div class="status" id="status">CAD 도면 준비 완료 · 단위 mm · 로컬 작업</div></main>
<aside class="side right"><div class="sect">PROPERTIES</div><div id="props">객체를 선택하면 속성을 편집할 수 있습니다.</div><div class="sect" style="margin-top:18px">LAYERS</div><div class="group"><button id="addLayer">레이어 추가</button></div><div id="layers" class="layers"></div><p class="hint">객체를 선택한 뒤 속성 패널에서 위치·크기·색상·레이어를 변경할 수 있습니다.</p></aside></div>
<input id="project" type="file" accept=".json,.cadcraft" hidden>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),cv=$('canvas'),ctx=cv.getContext('2d'),vp=$('viewport');
let objects=[],layers=[{name:'0',visible:true,locked:false,color:'#243246'}],activeLayer=0,selected=null,tool='select',gridOn=true,snapOn=true,view={x:0,y:0,s:1},undoStack=[],redoStack=[],drag=null,space=false,pan=null,seq=0;
const say=s=>$('status').textContent=s,uid=()=>++seq,clone=x=>JSON.parse(JSON.stringify(x)),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function saveHistory(){undoStack.push(JSON.stringify({objects,layers,activeLayer}));if(undoStack.length>80)undoStack.shift();redoStack=[]}
function restore(raw){const d=JSON.parse(raw);objects=d.objects;layers=d.layers;activeLayer=d.activeLayer;selected=null;renderAll()}
function undo(){if(!undoStack.length)return;redoStack.push(JSON.stringify({objects,layers,activeLayer}));restore(undoStack.pop());say('실행 취소')}
function redo(){if(!redoStack.length)return;undoStack.push(JSON.stringify({objects,layers,activeLayer}));restore(redoStack.pop());say('다시 실행')}
function layer(){return layers[activeLayer]||layers[0]}
function world(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-view.x)/view.s,y:(e.clientY-r.top-view.y)/view.s}}
function snap(p){if(!snapOn)return p;const g=Math.max(1,+$('gridSize').value||10);return{x:Math.round(p.x/g)*g,y:Math.round(p.y/g)*g}}
function screen(p){return{x:p.x*view.s+view.x,y:p.y*view.s+view.y}}
function resize(){const r=vp.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));ctx.setTransform(d,0,0,d,0,0);draw()}
function line(a,b,color='#243246',w=.5){ctx.strokeStyle=color;ctx.lineWidth=Math.max(.7,w*view.s);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
function draw(){const d=devicePixelRatio||1,W=cv.width/d,H=cv.height/d;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle='#10151d';ctx.fillRect(0,0,W,H);const ox=view.x,oy=view.y,s=view.s;ctx.save();ctx.translate(ox,oy);ctx.scale(s,s);
const ww=+ $('worldW').value||420,wh=+$('worldH').value||297;ctx.fillStyle='#fff';ctx.fillRect(0,0,ww,wh);ctx.strokeStyle='#c9d1da';ctx.lineWidth=1/s;ctx.strokeRect(0,0,ww,wh);
if(gridOn){const g=Math.max(1,+$('gridSize').value||10),left=Math.max(0,Math.floor(-ox/s/g)*g),top=Math.max(0,Math.floor(-oy/s/g)*g),right=Math.min(ww,Math.ceil((W-ox)/s/g)*g),bottom=Math.min(wh,Math.ceil((H-oy)/s/g)*g);ctx.beginPath();ctx.strokeStyle='#e7ebef';ctx.lineWidth=.45/s;for(let x=left;x<=right;x+=g){ctx.moveTo(x,0);ctx.lineTo(x,wh)}for(let y=top;y<=bottom;y+=g){ctx.moveTo(0,y);ctx.lineTo(ww,y)}ctx.stroke()}
objects.forEach(o=>{const l=layers.find(x=>x.name===o.layer);if(l&&!l.visible)return;ctx.save();ctx.strokeStyle=o.color||l?.color||'#243246';ctx.fillStyle=o.fill||'transparent';ctx.lineWidth=(o.width||.5);if(o.type==='rect'){ctx.strokeRect(o.x,o.y,o.w,o.h);if(o.fill)ctx.fillRect(o.x,o.y,o.w,o.h)}if(o.type==='circle'){ctx.beginPath();ctx.arc(o.x,o.y,Math.abs(o.r),0,Math.PI*2);ctx.stroke()}if(o.type==='line'||o.type==='dimension'){ctx.beginPath();ctx.moveTo(o.x,o.y);ctx.lineTo(o.x2,o.y2);ctx.stroke();if(o.type==='dimension'){const len=Math.hypot(o.x2-o.x,o.y2-o.y),ang=Math.atan2(o.y2-o.y,o.x2-o.x);ctx.save();ctx.translate((o.x+o.x2)/2,(o.y+o.y2)/2);ctx.rotate(ang);ctx.fillStyle=o.color;ctx.font='4px Arial';ctx.textAlign='center';ctx.fillText(len.toFixed(2)+' mm',0,-2);ctx.restore()}}if(o.type==='text'){ctx.fillStyle=o.color;ctx.font=(o.size||6)+'px Arial';ctx.fillText(o.text,o.x,o.y)}if(selected===o.id){ctx.strokeStyle='#1488ff';ctx.lineWidth=1/s;ctx.setLineDash([4/s,3/s]);ctx.strokeRect((o.x||0)-3/s,(o.y||0)-3/s,(o.w||o.r*2||8)+6/s,(o.h||o.r*2||8)+6/s)}ctx.restore()});ctx.restore();$('scale').textContent='1:'+Math.max(.01,1/view.s).toFixed(2)}
function renderTools(){const names=[['선택','select'],['선','line'],['사각형','rect'],['원','circle'],['치수선','dimension'],['문자','text']];$('tools').replaceChildren();names.forEach(([n,t])=>{const b=document.createElement('button');b.textContent=n;b.classList.toggle('active',tool===t);b.onclick=()=>setTool(t);$('tools').append(b)})}
function setTool(t){tool=t;renderTools();say('도구: '+({select:'선택',line:'선',rect:'사각형',circle:'원',dimension:'치수선',text:'문자'}[t]))}
function hit(p){for(let i=objects.length-1;i>=0;i--){const o=objects[i],l=layers.find(x=>x.name===o.layer);if(l&&!l.visible||l?.locked)continue;let d=Infinity;if(o.type==='rect'){const dx=Math.max(o.x-p.x,0,p.x-(o.x+o.w)),dy=Math.max(o.y-p.y,0,p.y-(o.y+o.h));d=Math.hypot(dx,dy)}else if(o.type==='circle')d=Math.abs(Math.hypot(p.x-o.x,p.y-o.y)-o.r);else if(o.type==='text')d=Math.hypot(p.x-o.x,p.y-o.y);else{const vx=o.x2-o.x,vy=o.y2-o.y,t=Math.max(0,Math.min(1,((p.x-o.x)*vx+(p.y-o.y)*vy)/(vx*vx+vy*vy||1)));d=Math.hypot(p.x-o.x-t*vx,p.y-o.y-t*vy)}if(d<Math.max(4,6/view.s))return o}return null}
function addObject(o){saveHistory();o.id=uid();o.layer=layer().name;o.color=$('color').value;o.width=+$('lineWidth').value||.5;objects.push(o);selected=o.id;renderAll();say('객체를 추가했습니다.')}
function renderProps(){const p=$('props');p.replaceChildren();const o=objects.find(x=>x.id===selected);if(!o){p.textContent='객체를 선택하면 속성을 편집할 수 있습니다.';return}function field(label,key,val,type='number'){const l=document.createElement('label');l.className='field';l.textContent=label;const i=document.createElement('input');i.type=type;i.value=val;i.onchange=()=>{saveHistory();o[key]=type==='number'?+i.value:i.value;draw();say('속성을 변경했습니다.')};l.append(i);p.append(l)}field('색상','color',o.color||'#243246','color');field('선 두께','width',o.width||.5);if(o.type==='rect'){field('X','x',o.x);field('Y','y',o.y);field('너비','w',o.w);field('높이','h',o.h)}else if(o.type==='circle'){field('중심 X','x',o.x);field('중심 Y','y',o.y);field('반지름','r',o.r)}else if(o.type==='text'){field('X','x',o.x);field('Y','y',o.y);field('문자','text',o.text,'text');field('문자 크기','size',o.size||6)}else{field('시작 X','x',o.x);field('시작 Y','y',o.y);field('끝 X','x2',o.x2);field('끝 Y','y2',o.y2)}const del=document.createElement('button');del.textContent='객체 삭제';del.onclick=()=>{saveHistory();objects=objects.filter(x=>x.id!==selected);selected=null;renderAll()};p.append(del)}
function renderLayers(){const p=$('layers');p.replaceChildren();layers.forEach((l,i)=>{const row=document.createElement('div');row.className='layer';const b=document.createElement('button');b.textContent=l.visible?'표시':'숨김';b.onclick=()=>{l.visible=!l.visible;renderAll()};const name=document.createElement('span');name.textContent=l.name;name.onclick=()=>{activeLayer=i;renderAll()};const lock=document.createElement('button');lock.textContent=l.locked?'잠금':'열림';lock.onclick=()=>{l.locked=!l.locked;renderAll()};row.classList.toggle('active',i===activeLayer);row.append(b,name,lock);p.append(row)})}
function renderAll(){draw();renderProps();renderLayers();renderTools()}
function finish(p){if(!drag)return;const a=drag.start,b=snap(p),dx=b.x-a.x,dy=b.y-a.y;if(drag.type==='line'||drag.type==='dimension')addObject({type:drag.type,x:a.x,y:a.y,x2:b.x,y2:b.y});if(drag.type==='rect')addObject({type:'rect',x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(dx),h:Math.abs(dy)});if(drag.type==='circle')addObject({type:'circle',x:a.x,y:a.y,r:Math.hypot(dx,dy)});drag=null;draw()}
cv.addEventListener('pointerdown',e=>{if(e.button===1||space){pan={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};cv.setPointerCapture(e.pointerId);return}const p=snap(world(e));if(tool==='select'){const o=hit(p);selected=o?.id??null;if(o){saveHistory();drag={move:o.id,start:p,ox:o.x,oy:o.y,ox2:o.x2,oy2:o.y2}}renderAll();return}if(tool==='text'){const text=prompt('도면에 넣을 문자');if(text)addObject({type:'text',x:p.x,y:p.y,text,size:6});return}drag={type:tool,start:p};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{const p=world(e);$('coord').textContent='X '+p.x.toFixed(2)+' · Y '+p.y.toFixed(2);if(pan){view.x=pan.vx+e.clientX-pan.x;view.y=pan.vy+e.clientY-pan.y;draw();return}if(!drag)return;if(drag.move){const o=objects.find(x=>x.id===drag.move);if(o){const dx=p.x-drag.start.x,dy=p.y-drag.start.y;o.x=drag.ox+dx;o.y=drag.oy+dy;if(o.x2!==undefined){o.x2=drag.ox2+dx;o.y2=drag.oy2+dy}}draw()}else{draw();const a=screen(drag.start),b=screen(p);ctx.strokeStyle='#1488ff';ctx.setLineDash([5,4]);ctx.lineWidth=1;ctx.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y);ctx.setLineDash([])}});
cv.addEventListener('pointerup',e=>{if(pan){pan=null;return}if(drag?.move){drag=null;renderProps();say('객체를 이동했습니다.');return}finish(world(e))});
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,old=view.s,next=Math.max(.15,Math.min(8,old*(e.deltaY<0?1.12:.89)));view.x=mx-(mx-view.x)*next/old;view.y=my-(my-view.y)*next/old;view.s=next;draw()},{passive:false});
window.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){space=true;e.preventDefault()}if(e.key==='Escape')setTool('select');if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}if(e.key==='Delete'&&selected!==null){saveHistory();objects=objects.filter(x=>x.id!==selected);selected=null;renderAll()}});
window.addEventListener('keyup',e=>{if(e.code==='Space')space=false});
function fit(){const ww=+$('worldW').value||420,wh=+$('worldH').value||297,r=vp.getBoundingClientRect();view.s=Math.min((r.width-50)/ww,(r.height-50)/wh);view.x=(r.width-ww*view.s)/2;view.y=(r.height-wh*view.s)/2;draw()}
function svg(){const ww=+$('worldW').value||420,wh=+$('worldH').value||297,els=objects.map(o=>{const c=o.color||'#243246',w=o.width||.5;if(o.type==='rect')return '<rect x="'+o.x+'" y="'+o.y+'" width="'+o.w+'" height="'+o.h+'" fill="none" stroke="'+c+'" stroke-width="'+w+'"/>';if(o.type==='circle')return '<circle cx="'+o.x+'" cy="'+o.y+'" r="'+o.r+'" fill="none" stroke="'+c+'" stroke-width="'+w+'"/>';if(o.type==='text')return '<text x="'+o.x+'" y="'+o.y+'" fill="'+c+'" font-size="'+(o.size||6)+'">'+esc(o.text)+'</text>';return '<line x1="'+o.x+'" y1="'+o.y+'" x2="'+o.x2+'" y2="'+o.y2+'" stroke="'+c+'" stroke-width="'+w+'"/>'}).join('');return '<svg xmlns="http://www.w3.org/2000/svg" width="'+ww+'mm" height="'+wh+'mm" viewBox="0 0 '+ww+' '+wh+'">'+els+'</svg>'}
function dxf(){const out=['0','SECTION','2','HEADER','9','$INSUNITS','70','4','0','ENDSEC','0','SECTION','2','TABLES','0','TABLE','2','LAYER','70',String(layers.length)];layers.forEach((l,i)=>out.push('0','LAYER','2',l.name,'70',l.locked?'4':'0','62',String(i===activeLayer?7:7),'6','CONTINUOUS'));out.push('0','ENDTAB','0','ENDSEC','0','SECTION','2','ENTITIES');objects.forEach(o=>{if(o.type==='rect'){const pts=[[o.x,o.y],[o.x+o.w,o.y],[o.x+o.w,o.y+o.h],[o.x,o.y+o.h]];pts.forEach((p,i)=>{const q=pts[(i+1)%4];out.push('0','LINE','8',o.layer,'10',p[0],'20',-p[1],'30','0','11',q[0],'21',-q[1],'31','0')})}else if(o.type==='circle')out.push('0','CIRCLE','8',o.layer,'10',o.x,'20',-o.y,'30','0','40',o.r);else if(o.type==='text')out.push('0','TEXT','8',o.layer,'10',o.x,'20',-o.y,'30','0','40',o.size||6,'1',o.text);else out.push('0','LINE','8',o.layer,'10',o.x,'20',-o.y,'30','0','11',o.x2,'21',-o.y2,'31','0')});out.push('0','ENDSEC','0','EOF');return out.join('\r\n')}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1200)}
$('undo').onclick=undo;$('redo').onclick=redo;$('grid').onclick=()=>{gridOn=!gridOn;$('grid').textContent=gridOn?'격자 표시 ✓':'격자 표시';draw()};$('snap').onclick=()=>{snapOn=!snapOn;$('snap').textContent=snapOn?'스냅 ✓':'스냅';};$('zoomFit').onclick=fit;$('svg').onclick=()=>download(new Blob([svg()],{type:'image/svg+xml'}),'cadcraft.svg');$('dxf').onclick=()=>download(new Blob([dxf()],{type:'application/dxf'}),'cadcraft.dxf');$('png').onclick=()=>{const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='cadcraft.png';a.click()};
$('save').onclick=()=>download(new Blob([JSON.stringify({version:1,objects,layers,activeLayer,worldW:$('worldW').value,worldH:$('worldH').value})],{type:'application/json'}),'drawing.cadcraft');
$('open').onclick=()=>$('project').click();$('project').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.objects)||!Array.isArray(d.layers))throw Error('잘못된 CADCraft 프로젝트입니다.');objects=d.objects;layers=d.layers;activeLayer=d.activeLayer||0;$('worldW').value=d.worldW||420;$('worldH').value=d.worldH||297;selected=null;renderAll();fit();say('프로젝트를 불러왔습니다.')}catch(err){say('열기 실패: '+err.message)}e.target.value=''};
$('new').onclick=()=>{if(!confirm('현재 도면을 비우시겠습니까?'))return;saveHistory();objects=[];selected=null;renderAll();say('새 도면을 만들었습니다.')};
$('addLayer').onclick=()=>{const n=prompt('새 레이어 이름','Layer '+(layers.length));if(!n||layers.some(x=>x.name===n))return;saveHistory();layers.push({name:n,visible:true,locked:false,color:'#243246'});activeLayer=layers.length-1;renderLayers();say('레이어를 추가했습니다.')};
['gridSize','worldW','worldH'].forEach(id=>$(id).addEventListener('change',draw));new ResizeObserver(resize).observe(vp);renderTools();renderLayers();resize();fit();
})();
</script></body></html>
