<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070a"><title>👥 팀 자동 나누기 · YouthDeveloper</title><style>
:root{--bg:#05070a;--panel:#0c1016;--line:rgba(255,255,255,.09);--text:#edf2f7;--muted:#7d8996;--green:#61ff9a;--cyan:#62e8ff;--mono:"SFMono-Regular","Cascadia Code","Roboto Mono",Consolas,monospace;--sans:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--text);background:radial-gradient(circle at 80% 10%,rgba(98,232,255,.07),transparent 30rem),var(--bg);font-family:var(--sans)}
a{color:inherit}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}.top{padding:22px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(5,7,10,.88);backdrop-filter:blur(14px);z-index:5}.nav{display:flex;justify-content:space-between;align-items:center}.brand{font:700 18px var(--mono);text-decoration:none}.brand span{color:var(--green)}.back{font:11px var(--mono);color:var(--muted);text-decoration:none}.back:hover{color:var(--green)}.hero{padding:58px 0 34px}.eyebrow{font:10px var(--mono);letter-spacing:.14em;color:var(--green)}h1{font-size:clamp(36px,6vw,68px);letter-spacing:-.06em;margin:9px 0}.hero p{color:var(--muted);max-width:680px;line-height:1.8}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.filter{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:8px 11px;border-radius:999px;cursor:pointer;font:11px var(--mono)}.filter.active,.filter:hover{color:var(--green);border-color:rgba(97,255,154,.35)}.grid{display:grid;grid-template-columns:minmax(0,760px);justify-content:center;gap:12px;padding-bottom:70px}
.card{border:1px solid var(--line);background:rgba(12,16,22,.72);border-radius:14px;overflow:hidden;scroll-margin-top:90px;transition:border-color .25s ease,box-shadow .25s ease}
.card.hide{display:none}
.card:target{border-color:rgba(97,255,154,.6);box-shadow:0 0 0 1px rgba(97,255,154,.25),0 0 30px rgba(97,255,154,.12)}
.cardhead{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.cardhead h2{font-size:15px;margin:0}.tag{font:9px var(--mono);color:var(--green)}.tool{padding:18px}.tool input,.tool textarea,.tool select{width:100%;padding:10px 11px;margin:5px 0;border:1px solid var(--line);background:#080b0f;color:var(--text);border-radius:8px;outline:none;font:12px var(--mono)}.tool input:focus,.tool textarea:focus,.tool select:focus{border-color:rgba(97,255,154,.4)}.tool textarea{min-height:100px;resize:vertical}.tool button{padding:9px 12px;border:1px solid rgba(97,255,154,.25);background:rgba(97,255,154,.07);color:var(--green);border-radius:8px;cursor:pointer;font:11px var(--mono);margin:4px 3px 4px 0}.tool button:hover{background:rgba(97,255,154,.14)}.out{margin-top:9px;padding:11px;border:1px dashed var(--line);border-radius:8px;min-height:40px;color:var(--muted);font:12px var(--mono);white-space:pre-wrap;word-break:break-word}.big{font-size:27px;color:var(--text);text-align:center;padding:12px}.row{display:flex;gap:7px}.row>*{flex:1}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.keys button{margin:0}.target{height:170px;position:relative;background:#080b0f;border:1px solid var(--line);border-radius:8px;overflow:hidden}#reactionArea{cursor:pointer}.target button{position:absolute;width:34px;height:34px;border-radius:50%;padding:0;margin:0}.todo-row{display:flex;align-items:center;gap:8px;margin:6px 0;font:12px var(--mono)}.todo-row input{width:auto;margin:0}.todo-row span{flex:1;word-break:break-word}.todo-row.done span{text-decoration:line-through;opacity:.5}.todo-row button{margin:0;padding:3px 8px}.footer{padding:25px 0;border-top:1px solid var(--line);color:var(--muted);font:10px var(--mono)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.grid{grid-template-columns:1fr}.wrap{width:min(100% - 20px,1180px)}.hero{padding-top:38px}}
</style></head><body><header class="top"><div class="wrap nav"><a class="brand" href="/">Youth<span>Developer</span></a><a class="back" href="/services.html">← ALL SERVICES</a></div></header><main class="wrap"><section class="hero"><div class="eyebrow">YOUTHDEVELOPER / TOOL</div><h1>👥 팀 자동 나누기</h1><p>브라우저에서 바로 사용할 수 있는 도구입니다.</p></section><section class="grid" id="grid"><article class="card" data-cat="game" id="teams"><div class="cardhead"><h2>👥 팀 자동 나누기</h2><span class="tag">GAME</span></div><div class="tool"><textarea id="teamNames" placeholder="한 줄에 한 명"></textarea><input id="teamCount" type="number" min="2" value="2" aria-label="팀 수"><button onclick="makeTeams()">팀 배정</button><div class="out" id="teamOut"></div></div></article></section></main><footer class="footer"><div class="wrap">YouthDeveloper // client-side tools · 2026</div></footer><script src="/services/tools.js"></script></body></html>
