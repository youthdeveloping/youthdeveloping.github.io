<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>위치 기록</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; font-family: sans-serif; }
  #map { height: calc(100% - 96px); }
  #bar { height: 96px; box-sizing: border-box; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  #buttons { display: flex; gap: 8px; }
  button { flex: 1; padding: 10px; font-size: 15px; border: 1px solid #888; border-radius: 8px; background: #fff; }
  #status { font-size: 13px; color: #444; }
</style>
</head>
<body>
<div id="map"></div>
<div id="bar">
  <div id="buttons">
    <button id="start">기록 시작</button>
    <button id="stop" disabled>기록 중지</button>
    <button id="export" disabled>GPX 저장</button>
    <button id="clear">초기화</button>
  </div>
  <div id="status">대기 중</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([37.5665, 126.9780], 14);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const KEY = 'track-points';
let points = JSON.parse(localStorage.getItem(KEY) || '[]');
let watchId = null, marker = null, wakeLock = null;
const line = L.polyline(points.map(p => [p.lat, p.lng]), { weight: 5 }).addTo(map);
if (points.length) map.fitBounds(line.getBounds());
if (points.length) $('export').disabled = false;

function $(id) { return document.getElementById(id); }
const setStatus = t => $('status').textContent = t;

function distanceM(a, b) {
  const R = 6371000, rad = x => x * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 +
            Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function onPosition(pos) {
  const p = {
    lat: pos.coords.latitude,
    lng: pos.coords.longitude,
    acc: pos.coords.accuracy,
    t: pos.timestamp
  };
  const last = points[points.length - 1];
  // 정확도가 낮거나 5m 미만 이동은 기록하지 않아 지터를 줄입니다.
  if (p.acc > 50 || (last && distanceM(last, p) < 5)) return;
  points.push(p);
  localStorage.setItem(KEY, JSON.stringify(points));
  line.addLatLng([p.lat, p.lng]);
  if (!marker) marker = L.marker([p.lat, p.lng]).addTo(map);
  else marker.setLatLng([p.lat, p.lng]);
  map.panTo([p.lat, p.lng]);
  setStatus(`기록 중 · 지점 ${points.length}개 · 오차 약 ${Math.round(p.acc)}m`);
  $('export').disabled = false;
}

function onError(err) {
  const msg = {
    1: '위치 권한이 거부되었습니다. 브라우저 설정에서 허용해 주세요.',
    2: '위치를 확인할 수 없습니다.',
    3: '위치 요청 시간이 초과되었습니다.'
  }[err.code] || '알 수 없는 오류가 발생했습니다.';
  setStatus(msg);
}

async function keepAwake() {
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}

$('start').onclick = () => {
  if (!navigator.geolocation) return setStatus('이 브라우저는 위치 기능을 지원하지 않습니다.');
  watchId = navigator.geolocation.watchPosition(onPosition, onError, {
    enableHighAccuracy: true, maximumAge: 0, timeout: 20000
  });
  keepAwake();
  $('start').disabled = true; $('stop').disabled = false;
  setStatus('위치 확인 중...');
};

$('stop').onclick = () => {
  navigator.geolocation.clearWatch(watchId);
  watchId = null;
  if (wakeLock) wakeLock.release();
  $('start').disabled = false; $('stop').disabled = true;
  setStatus(`중지됨 · 지점 ${points.length}개`);
};

$('export').onclick = () => {
  const trkpts = points.map(p =>
    `<trkpt lat="${p.lat}" lon="${p.lng}"><time>${new Date(p.t).toISOString()}</time></trkpt>`).join('');
  const gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="track" xmlns="http://www.topografix.com/GPX/1/1"><trk><trkseg>${trkpts}</trkseg></trk></gpx>`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([gpx], { type: 'application/gpx+xml' }));
  a.download = 'track.gpx';
  a.click();
};

$('clear').onclick = () => {
  if (!confirm('저장된 경로를 모두 삭제할까요?')) return;
  points = [];
  localStorage.removeItem(KEY);
  line.setLatLngs([]);
  if (marker) { map.removeLayer(marker); marker = null; }
  $('export').disabled = true;
  setStatus('초기화되었습니다.');
};

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && watchId !== null) keepAwake();
});
</script>
</body>
</html>
