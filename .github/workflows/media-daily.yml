name: YouthDeveloper Media Daily

on:
  schedule:
    # GitHub Actions cron is UTC: 00:00 UTC = 09:00 Korea Standard Time.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youthdeveloper-media-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run generator tests
        run: python -m unittest discover -s tests -v

      - name: Generate original IT article and Naver-ready draft
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python tools/media_engine.py

      - name: Commit and publish website article
        run: |
          git config user.name "youthdeveloper-media[bot]"
          git config user.email "youthdeveloper-media[bot]@users.noreply.github.com"
          git add media/articles media/naver-drafts
          if git diff --cached --quiet; then
            echo "No new article was generated."
            exit 0
          fi
          git commit -m "Publish daily IT media article"
          git push
